
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Manage active and inactive students in Fila Grades System.">
<meta name="theme-color" content="#173f70">

<link rel="icon" type="image/x-icon" href="../../images/favicon/favicon.ico">
<link rel="icon" type="image/png" sizes="512x512" href="../../images/favicon/favicon.png">
<link rel="stylesheet" href="../../style.css">

<title>Students Management | Fila Grades System</title>

<style>
:root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --success: #15803d;
    --danger: #dc2626;
    --warning: #b45309;
    --background: #f4f6fb;
    --border: #e5e7eb;
    --text: #1f2937;
    --muted: #64748b;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px 15px;
    background: var(--background);
    color: var(--text);
    font-family: Arial, sans-serif;
}

button {
    border: none;
    border-radius: 7px;
    padding: 10px 15px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
    transition: .2s ease;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.container {
    max-width: 1100px;
    margin: 25px auto;
    padding: 26px;
    background: white;
    border: 1px solid #edf0f5;
    border-radius: 14px;
    box-shadow: 0 5px 22px rgba(15, 23, 42, .05);
}

/* HEADER */

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 23px;
}

.header h2 {
    margin: 0 0 6px;
    font-size: 21px;
    color: #173f70;
}

.header p {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
}

.add-btn,
.save-btn {
    background: var(--primary);
    color: white;
}

.add-btn:hover,
.save-btn:hover {
    background: var(--primary-dark);
}

/* SUMMARY */

.summary-cards {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 24px;
}

.summary-card {
    padding: 17px 19px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fff;
}

.summary-card.active-summary {
    border-left: 4px solid var(--success);
}

.summary-card.inactive-summary {
    border-left: 4px solid #d97706;
}

.summary-card span {
    display: block;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 7px;
}

.summary-card strong {
    font-size: 25px;
    color: var(--text);
}

/* TABS */

.student-tabs {
    display: flex;
    gap: 8px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 23px;
}

.tab-button {
    position: relative;
    background: transparent;
    color: var(--muted);
    border-radius: 7px 7px 0 0;
    padding: 13px 17px;
    font-size: 14px;
}

.tab-button:hover {
    background: #f8fafc;
    color: var(--primary);
}

.tab-button.active {
    color: var(--primary);
    background: #eff6ff;
}

.tab-button.active::after {
    content: "";
    position: absolute;
    height: 3px;
    bottom: -1px;
    left: 0;
    right: 0;
    background: var(--primary);
    border-radius: 5px 5px 0 0;
}

.tab-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 22px;
    height: 21px;
    margin-left: 5px;
    padding: 0 6px;
    border-radius: 20px;
    background: #e2e8f0;
    color: #475569;
    font-size: 11px;
}

.tab-button.active .tab-count {
    background: #dbeafe;
    color: #1d4ed8;
}

/* STATUS MESSAGE */

.status-message {
    display: none;
    padding: 13px 15px;
    margin-bottom: 18px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.5;
}

.status-message.success {
    display: block;
    background: #dcfce7;
    color: #166534;
}

.status-message.error {
    display: block;
    background: #fee2e2;
    color: #991b1b;
}

.status-message.info {
    display: block;
    background: #eff6ff;
    color: #1d4ed8;
}

/* SECTION INSTRUCTIONS */

.section-intro {
    margin: 0 0 15px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
}

/* CLASS CARDS */

.class-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
}

.class-card {
    display: block;
    width: 100%;
    padding: 17px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fff;
    color: var(--text);
    text-align: center;
}

.class-card:hover {
    border-color: var(--primary);
    background: #f8fbff;
}

.class-card.active {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
}

.class-card strong {
    display: block;
    font-size: 16px;
    margin-bottom: 7px;
}

.class-card small {
    font-size: 12px;
    opacity: .85;
}

/* STUDENT TABLE */

.class-section {
    margin-top: 20px;
}

.class-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    padding: 14px 16px;
    margin: 0 0 13px;
    border-radius: 8px;
    background: #eff6ff;
    color: #1d4ed8;
    font-size: 15px;
}

.table-wrapper {
    width: 100%;
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 9px;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 580px;
}

th,
td {
    text-align: left;
    padding: 13px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
}

th {
    background: #f8fafc;
    color: #475569;
    font-weight: 700;
    white-space: nowrap;
}

tbody tr:last-child td {
    border-bottom: none;
}

tbody tr:hover {
    background: #fafcff;
}

.action-buttons {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

.edit-btn {
    background: #dbeafe;
    color: #1d4ed8;
}

.deactivate-btn {
    background: #fff7ed;
    color: #c2410c;
}

.activate-btn {
    background: #dcfce7;
    color: #166534;
}

.delete-btn {
    background: #fee2e2;
    color: #b91c1c;
}

.edit-btn:hover,
.deactivate-btn:hover,
.activate-btn:hover,
.delete-btn:hover {
    filter: brightness(.96);
}

.status-pill {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
}

.status-pill.active {
    background: #dcfce7;
    color: #166534;
}

.status-pill.inactive {
    background: #fef3c7;
    color: #92400e;
}

.empty-message {
    text-align: center;
    color: var(--muted);
    padding: 25px 15px;
    font-size: 14px;
    line-height: 1.6;
}

/* MODAL */

.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    inset: 0;
    background: rgba(15, 23, 42, .55);
    align-items: center;
    justify-content: center;
    padding: 15px;
}

.modal-content {
    background: white;
    width: 100%;
    max-width: 480px;
    padding: 25px;
    border-radius: 13px;
    box-shadow: 0 15px 45px rgba(0,0,0,.18);
    max-height: 90vh;
    overflow-y: auto;
}

.modal-content h3 {
    margin: 0 0 7px;
    color: #173f70;
    font-size: 19px;
}

.modal-subtitle {
    margin: 0 0 22px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
}

.form-group {
    margin-bottom: 19px;
}

.form-group label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 9px;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 7px;
    outline: none;
    font-size: 14px;
    background: white;
}

.form-group input:focus,
.form-group select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, .1);
}

/* MODAL CLASS CARDS */

.form-class-cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
}

.form-class-card {
    width: 100%;
    padding: 12px 5px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: white;
    color: var(--text);
    font-size: 12px;
}

.form-class-card:hover {
    border-color: var(--primary);
    background: #eff6ff;
}

.form-class-card.active {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 22px;
}

.cancel-btn {
    background: #e5e7eb;
    color: #374151;
}

/* RESPONSIVE */

@media(max-width: 600px) {
    body {
        padding: 10px;
    }

    .container {
        padding: 16px;
        margin: 10px auto;
    }

    .header {
        align-items: flex-start;
    }

    .header h2 {
        font-size: 18px;
    }

    .header .add-btn {
        width: 100%;
    }

    .summary-cards {
        gap: 9px;
    }

    .summary-card {
        padding: 13px;
    }

    .summary-card strong {
        font-size: 21px;
    }

    .student-tabs {
        gap: 2px;
    }

    .tab-button {
        flex: 1;
        padding: 12px 5px;
        font-size: 12px;
    }

    .class-cards {
        grid-template-columns: repeat(2, 1fr);
    }

    .form-class-cards {
        grid-template-columns: repeat(2, 1fr);
    }

    .modal-content {
        padding: 20px;
    }

    .action-buttons button {
        padding: 9px 10px;
        font-size: 12px;
    }
}
</style>
</head>

<body>

<div id="schoolSidebarContainer"></div>

<main class="school-main-content">

<div class="container">

    <div class="header">
        <div>
            <h2>STUDENT MANAGEMENT</h2>
            <p>Manage student registration and enrolment status.</p>
        </div>

        <button class="add-btn" id="addStudentBtn">
            + Register Student
        </button>
    </div>

    <div class="summary-cards">
        <div class="summary-card active-summary">
            <span>Active Students</span>
            <strong id="activeTotal">0</strong>
        </div>

        <div class="summary-card inactive-summary">
            <span>Inactive Students</span>
            <strong id="inactiveTotal">0</strong>
        </div>
    </div>

    <div id="statusMessage" class="status-message"></div>

    <!-- TABS -->

    <div class="student-tabs" role="tablist">
        <button
            type="button"
            class="tab-button active"
            id="activeTab"
            role="tab"
            aria-selected="true"
        >
            Active Students
            <span class="tab-count" id="activeTabCount">0</span>
        </button>

        <button
            type="button"
            class="tab-button"
            id="inactiveTab"
            role="tab"
            aria-selected="false"
        >
            Inactive Students
            <span class="tab-count" id="inactiveTabCount">0</span>
        </button>
    </div>

    <p class="section-intro" id="sectionInstruction">
        Select a class to view its active students.
    </p>

    <div id="classCards" class="class-cards"></div>

    <div id="studentsContainer">
        <p class="empty-message">Loading students...</p>
    </div>

</div>

<!-- STUDENT REGISTRATION / EDIT MODAL -->

<div class="modal" id="studentModal">
    <div class="modal-content">

        <h3 id="modalTitle">Register Student</h3>

        <p class="modal-subtitle">
            Enter the student's details and select their class.
        </p>

        <form id="studentForm">

            <div class="form-group">
                <label>Select Class</label>
                <div id="formClassCards" class="form-class-cards"></div>
            </div>

            <div class="form-group">
                <label for="studentName">Student Full Name</label>
                <input
                    type="text"
                    id="studentName"
                    maxlength="200"
                    placeholder="Enter student full name"
                    autocomplete="off"
                    required
                >
            </div>

            <div class="form-group">
                <label for="studentGender">Gender</label>
                <select id="studentGender">
                    <option value="">Select gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>

            <div class="modal-actions">
                <button type="button" class="cancel-btn" id="cancelBtn">
                    Cancel
                </button>

                <button type="submit" class="save-btn" id="saveBtn">
                    Save Student
                </button>
            </div>

        </form>
    </div>
</div>

</main>

<script>
document.addEventListener("DOMContentLoaded", async function () {
    try {
        const response = await fetch("/api/auth/session", {
            credentials: "same-origin",
            cache: "no-store"
        });

        const data = await response.json();

        if (!response.ok || !data.success || !data.user) return;

        if (data.user.role !== "school_admin") return;

        const css = document.createElement("link");
        css.rel = "stylesheet";
        css.href = "../css/school-sidebar.css";
        document.head.appendChild(css);

        const script = document.createElement("script");
        script.src = "../js/school-sidebar.js";
        document.body.appendChild(script);

    } catch (error) {
        console.error("Sidebar loading error:", error);
    }
});
</script>

<script>
"use strict";

/* =====================================
   AUTHENTICATION
===================================== */

let currentUser = null;

try {
    currentUser = JSON.parse(
        localStorage.getItem("currentUser") || "null"
    );
} catch {
    currentUser = null;
}

if (
    !["school_admin", "dos"].includes(localStorage.getItem("role")) ||
    !currentUser
) {
    window.location.replace("../../index.html");
}

/* =====================================
   ELEMENTS
===================================== */

const studentsContainer = document.getElementById("studentsContainer");
const classCards = document.getElementById("classCards");
const formClassCards = document.getElementById("formClassCards");

const studentModal = document.getElementById("studentModal");
const studentForm = document.getElementById("studentForm");

const studentName = document.getElementById("studentName");
const studentGender = document.getElementById("studentGender");

const modalTitle = document.getElementById("modalTitle");
const saveBtn = document.getElementById("saveBtn");
const statusMessage = document.getElementById("statusMessage");
const addStudentBtn = document.getElementById("addStudentBtn");

const activeTab = document.getElementById("activeTab");
const inactiveTab = document.getElementById("inactiveTab");

const activeTotal = document.getElementById("activeTotal");
const inactiveTotal = document.getElementById("inactiveTotal");

const activeTabCount = document.getElementById("activeTabCount");
const inactiveTabCount = document.getElementById("inactiveTabCount");

const sectionInstruction = document.getElementById("sectionInstruction");

/* =====================================
   STATE
===================================== */

let students = [];
let classes = [];

let currentTab = "active";
let selectedClassId = "";
let formClassId = "";

let editingStudentId = null;
let messageTimer = null;

/* =====================================
   API REQUEST HELPER
===================================== */

async function apiRequest(url, options = {}) {
    const response = await fetch(url, {
        ...options,
        credentials: "same-origin",
        headers: {
            ...(options.body
                ? { "Content-Type": "application/json" }
                : {}),
            ...(options.headers || {})
        }
    });

    const result = await response.json().catch(() => null);

    if (!result) {
        throw new Error(
            "The server returned an invalid response. Check the API endpoint."
        );
    }

    if (response.status === 401) {
        window.location.replace("../../index.html");
        throw new Error("Your session has expired. Please log in again.");
    }

    if (!response.ok || result.success === false) {
        throw new Error(result.message || "Request failed.");
    }

    return result;
}

/* =====================================
   MESSAGE
===================================== */

function showMessage(message, type = "success") {
    clearTimeout(messageTimer);

    statusMessage.textContent = message;
    statusMessage.className = "status-message " + type;

    if (type !== "info") {
        messageTimer = setTimeout(() => {
            statusMessage.className = "status-message";
            statusMessage.textContent = "";
        }, 6000);
    }
}

/* =====================================
   CLASS NAME FORMATTING
===================================== */

function formatClassName(name) {
    const value = String(name || "").trim();

    const mapping = {
        "P1": "Primary 1",
        "P2": "Primary 2",
        "P3": "Primary 3",
        "P4": "Primary 4",
        "P5": "Primary 5",
        "P6": "Primary 6",
        "S1": "Senior 1",
        "S2": "Senior 2",
        "S3": "Senior 3",
        "S4": "Senior 4",
        "S5": "Senior 5",
        "S6": "Senior 6"
    };

    return mapping[value.toUpperCase()] || value;
}

/* =====================================
   STUDENT STATUS HELPERS
===================================== */

function isActive(student) {
    return String(student.status || "").toLowerCase() === "active";
}

function getStudentsByStatus(status, classId = null) {
    return students
        .filter(student => {
            const matchesStatus = isActive(student) === (status === "active");

            const matchesClass = classId === null ||
                String(student.class_id) === String(classId);

            return matchesStatus && matchesClass;
        })
        .sort((a, b) =>
            String(a.full_name || "").localeCompare(
                String(b.full_name || "")
            )
        );
}

/* =====================================
   UPDATE COUNTS
===================================== */

function updateCounts() {
    const activeCount = students.filter(isActive).length;
    const inactiveCount = students.filter(student => !isActive(student)).length;

    activeTotal.textContent = activeCount;
    inactiveTotal.textContent = inactiveCount;

    activeTabCount.textContent = activeCount;
    inactiveTabCount.textContent = inactiveCount;
}

/* =====================================
   LOAD CLASSES
===================================== */

async function loadClasses() {
    const result = await apiRequest("/api/classes");

    if (!Array.isArray(result.classes)) {
        throw new Error("The server did not return a valid classes list.");
    }

    classes = result.classes;

    // Automatically select the first available class.
    if (classes.length > 0) {
        selectedClassId = String(classes[0].id);
        formClassId = String(classes[0].id);
    } else {
        selectedClassId = "";
        formClassId = "";
    }

    renderFormClassCards();
}
/* =====================================
   LOAD STUDENTS
===================================== */

async function loadStudents() {
    studentsContainer.replaceChildren();

    const loading = document.createElement("p");
    loading.className = "empty-message";
    loading.textContent = "Loading students...";
    studentsContainer.appendChild(loading);

    const result = await apiRequest("/api/students");

    students = Array.isArray(result.students) ? result.students : [];

    updateCounts();

    renderClassCards();
    renderStudents();
}

/* =====================================
   TAB SWITCHING
===================================== */

function switchTab(tab) {
    currentTab = tab;

    activeTab.classList.toggle("active", tab === "active");
    inactiveTab.classList.toggle("active", tab === "inactive");

    activeTab.setAttribute("aria-selected", String(tab === "active"));
    inactiveTab.setAttribute("aria-selected", String(tab === "inactive"));

    addStudentBtn.style.display = tab === "active" ? "inline-block" : "none";

    sectionInstruction.textContent = tab === "active"
        ? "Select a class to view its active students."
        : "Select a class to view its inactive students.";

    renderClassCards();
    renderStudents();
}

activeTab.addEventListener("click", () => switchTab("active"));
inactiveTab.addEventListener("click", () => switchTab("inactive"));

/* =====================================
   RENDER CLASS CARDS
===================================== */

function renderClassCards() {
    classCards.replaceChildren();

    const availableClasses = classes.filter(cls =>
        getStudentsByStatus(currentTab, cls.id).length > 0
    );

    if (availableClasses.length === 0) {
        selectedClassId = "";

        const message = document.createElement("p");
        message.className = "empty-message";

        message.textContent = currentTab === "active"
            ? "There are currently no active students."
            : "There are currently no inactive students.";

        classCards.appendChild(message);
        return;
    }

    // Keep the selected class if it has students in this tab.
    // Otherwise automatically select the first available class.
    const selectedClassExists = availableClasses.some(
        cls => String(cls.id) === String(selectedClassId)
    );

    if (!selectedClassExists) {
        selectedClassId = String(availableClasses[0].id);
    }

    availableClasses.forEach(cls => {
        const count = getStudentsByStatus(currentTab, cls.id).length;

        const card = document.createElement("button");
        card.type = "button";
        card.className = "class-card";

        if (String(selectedClassId) === String(cls.id)) {
            card.classList.add("active");
        }

        const title = document.createElement("strong");
        title.textContent = formatClassName(cls.class_name);

        const total = document.createElement("small");
        total.textContent = count + (count === 1
            ? " student"
            : " students");

        card.append(title, total);

        card.addEventListener("click", () => {
            selectedClassId = String(cls.id);
            renderClassCards();
            renderStudents();
        });

        classCards.appendChild(card);
    });
}
/* =====================================
   RENDER FORM CLASS CARDS
===================================== */

function renderFormClassCards() {
    formClassCards.replaceChildren();

    if (classes.length === 0) {
        const message = document.createElement("p");
        message.className = "empty-message";
        message.textContent = "No classes available.";
        formClassCards.appendChild(message);
        return;
    }

    classes.forEach(cls => {
        const card = document.createElement("button");

        card.type = "button";
        card.className = "form-class-card";

        if (String(formClassId) === String(cls.id)) {
            card.classList.add("active");
        }

        card.textContent = formatClassName(cls.class_name);

        card.addEventListener("click", () => {
            formClassId = String(cls.id);
            renderFormClassCards();
        });

        formClassCards.appendChild(card);
    });
}

/* =====================================
   RENDER STUDENTS TABLE
===================================== */

function renderStudents() {
    studentsContainer.replaceChildren();

    if (!selectedClassId) {
        const message = document.createElement("p");
        message.className = "empty-message";
        message.textContent = "Select a class above to view its students.";
        studentsContainer.appendChild(message);
        return;
    }

    const selectedClass = classes.find(cls =>
        String(cls.id) === String(selectedClassId)
    );

    if (!selectedClass) {
        const message = document.createElement("p");
        message.className = "empty-message";
        message.textContent = "Selected class was not found.";
        studentsContainer.appendChild(message);
        return;
    }

    const sectionStudents = getStudentsByStatus(currentTab, selectedClassId);

    const section = document.createElement("div");
    section.className = "class-section";

    const heading = document.createElement("h3");
    heading.className = "class-title";

    heading.textContent =
        formatClassName(selectedClass.class_name) +
        " (" + sectionStudents.length + " students)";

    section.appendChild(heading);

    const wrapper = document.createElement("div");
    wrapper.className = "table-wrapper";

    const table = document.createElement("table");

    const thead = document.createElement("thead");
    const headerRow = document.createElement("tr");

    ["#", "Student Name", "Student Code", "Status", "Actions"].forEach(label => {
        const th = document.createElement("th");
        th.textContent = label;
        headerRow.appendChild(th);
    });

    thead.appendChild(headerRow);
    table.appendChild(thead);

    const tbody = document.createElement("tbody");

    if (sectionStudents.length === 0) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");

        cell.colSpan = 5;
        cell.className = "empty-message";
        cell.textContent = "No students found in this class.";

        row.appendChild(cell);
        tbody.appendChild(row);
    } else {
        sectionStudents.forEach((student, index) => {
            const row = document.createElement("tr");

            const numberCell = document.createElement("td");
            numberCell.textContent = String(index + 1);

            const nameCell = document.createElement("td");
            nameCell.textContent = student.full_name || "";

            const codeCell = document.createElement("td");
            codeCell.textContent = student.student_code || "—";

            const statusCell = document.createElement("td");
            const statusPill = document.createElement("span");

            statusPill.className = "status-pill " + currentTab;
            statusPill.textContent = currentTab === "active" ? "Active" : "Inactive";

            statusCell.appendChild(statusPill);

            const actionsCell = document.createElement("td");
            const actions = document.createElement("div");
            actions.className = "action-buttons";

            if (currentTab === "active") {
                const editButton = document.createElement("button");
                editButton.type = "button";
                editButton.className = "edit-btn";
                editButton.textContent = "Edit";

                editButton.addEventListener("click", () => {
                    openEditModal(student.id);
                });

                const deactivateButton = document.createElement("button");
                deactivateButton.type = "button";
                deactivateButton.className = "deactivate-btn";
                deactivateButton.textContent = "Deactivate";

                deactivateButton.addEventListener("click", () => {
                    deactivateStudent(student.id);
                });

                actions.append(editButton, deactivateButton);
            } else {
                const activateButton = document.createElement("button");
                activateButton.type = "button";
                activateButton.className = "activate-btn";
                activateButton.textContent = "Activate";

                activateButton.addEventListener("click", () => {
                    activateStudent(student.id);
                });

                const deleteButton = document.createElement("button");
                deleteButton.type = "button";
                deleteButton.className = "delete-btn";
                deleteButton.textContent = "Delete Permanently";

                deleteButton.addEventListener("click", () => {
                    permanentlyDeleteStudent(student.id);
                });

                actions.append(activateButton, deleteButton);
            }

            actionsCell.appendChild(actions);

            row.append(
                numberCell,
                nameCell,
                codeCell,
                statusCell,
                actionsCell
            );

            tbody.appendChild(row);
        });
    }

    table.appendChild(tbody);
    wrapper.appendChild(table);
    section.appendChild(wrapper);
    studentsContainer.appendChild(section);
}

/* =====================================
   OPEN ADD STUDENT MODAL
===================================== */

function openAddModal() {
    if (classes.length === 0) {
        showMessage("No classes are available for registration.", "error");
        return;
    }

    editingStudentId = null;
    studentForm.reset();

    formClassId = selectedClassId || "";

    modalTitle.textContent = "Register Student";
    saveBtn.textContent = "Save Student";

    renderFormClassCards();
    studentModal.style.display = "flex";
}

/* =====================================
   OPEN EDIT STUDENT MODAL
===================================== */

function openEditModal(id) {
    const student = students.find(item =>
        String(item.id) === String(id)
    );

    if (!student || !isActive(student)) {
        showMessage("Active student not found.", "error");
        return;
    }

    editingStudentId = student.id;
    formClassId = String(student.class_id);

    studentName.value = student.full_name || "";
    studentGender.value = student.gender || "";

    modalTitle.textContent = "Edit Student";
    saveBtn.textContent = "Update Student";

    renderFormClassCards();
    studentModal.style.display = "flex";
}

/* =====================================
   CLOSE MODAL
===================================== */

function closeModal() {
    studentModal.style.display = "none";
    studentForm.reset();

    editingStudentId = null;
    formClassId = "";
}

document.getElementById("cancelBtn").addEventListener("click", closeModal);

studentModal.addEventListener("click", event => {
    if (event.target === studentModal) {
        closeModal();
    }
});

/* =====================================
   SAVE / UPDATE STUDENT
===================================== */

studentForm.addEventListener("submit", async event => {
    event.preventDefault();

    const fullName = studentName.value.trim();
    const classId = Number(formClassId);

    if (!classId || !fullName) {
        showMessage(
            "Please select a class and enter the student's name.",
            "error"
        );
        return;
    }

    const isEditing = editingStudentId !== null;

    const payload = {
        class_id: classId,
        full_name: fullName,
        gender: studentGender.value || null
    };

    if (isEditing) {
        payload.id = editingStudentId;
    }

    saveBtn.disabled = true;
    saveBtn.textContent = "Please wait...";

    try {
        if (isEditing) {
            await apiRequest("/api/students/update", {
                method: "POST",
                body: JSON.stringify(payload)
            });
        } else {
            await apiRequest("/api/students", {
                method: "POST",
                body: JSON.stringify(payload)
            });
        }

        closeModal();

        await loadStudents();

        if (isEditing) {
            selectedClassId = String(classId);
            renderClassCards();
            renderStudents();
        }

        showMessage(
            isEditing
                ? "Student details updated successfully."
                : "Student registered successfully."
        );

    } catch (error) {
        showMessage(error.message, "error");
    } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = editingStudentId === null
            ? "Save Student"
            : "Update Student";
    }
});

/* =====================================
   DEACTIVATE STUDENT
===================================== */

async function deactivateStudent(id) {
    const confirmed = confirm(
        "Deactivate this student?\n\n" +
        "The student will be moved to the Inactive Students section. " +
        "Their recorded marks will be retained."
    );

    if (!confirmed) return;

    try {
        await apiRequest("/api/students/delete", {
            method: "POST",
            body: JSON.stringify({ id })
        });

        await loadStudents();

        showMessage("Student deactivated successfully.");
    } catch (error) {
        showMessage(error.message, "error");
    }
}

/* =====================================
   ACTIVATE STUDENT
===================================== */

async function activateStudent(id) {
    const confirmed = confirm(
        "Activate this student?\n\n" +
        "The student will be moved back to Active Students."
    );

    if (!confirmed) return;

    try {
        await apiRequest("/api/students/activate", {
            method: "POST",
            body: JSON.stringify({ id })
        });

        await loadStudents();

        showMessage("Student activated successfully.");
    } catch (error) {
        showMessage(error.message, "error");
    }
}

/* =====================================
   PERMANENTLY DELETE STUDENT
===================================== */

async function permanentlyDeleteStudent(id) {
    try {
        /*
           First request asks the server to check
           whether the student has recorded marks.
           It must not delete anything yet.
        */

        const preview = await apiRequest("/api/students/permanent-delete", {
            method: "POST",
            body: JSON.stringify({
                id,
                confirm: false
            })
        });

        const marksCount = Number(preview.marksCount || 0);

        let warning;

        if (marksCount > 0) {
            warning =
                "PERMANENT DELETION WARNING\n\n" +
                "This student has " + marksCount +
                " recorded mark record(s).\n\n" +
                "If you continue:\n" +
                "• The student's recorded marks will also be deleted.\n" +
                "• The student will be permanently removed from the system.\n" +
                "• This action cannot be reversed.\n\n" +
                "Do you want to permanently delete this student and the associated marks?";
        } else {
            warning =
                "PERMANENT DELETION CONFIRMATION\n\n" +
                "This student has no recorded marks.\n\n" +
                "The student will be permanently removed from the system. " +
                "This action cannot be reversed.\n\n" +
                "Do you want to continue?";
        }

        if (!confirm(warning)) return;

        await apiRequest("/api/students/permanent-delete", {
            method: "POST",
            body: JSON.stringify({
                id,
                confirm: true
            })
        });

        await loadStudents();

        showMessage(
            "The student and associated records were permanently deleted."
        );

    } catch (error) {
        showMessage(error.message, "error");
    }
}

/* =====================================
   BUTTON EVENTS
===================================== */

addStudentBtn.addEventListener("click", openAddModal);

/* =====================================
   INITIALIZE PAGE
===================================== */

async function initializePage() {
    addStudentBtn.disabled = true;

    try {
        await loadClasses();
        await loadStudents();
    } catch (error) {
        showMessage(error.message, "error");

        classCards.replaceChildren();
        formClassCards.replaceChildren();
        studentsContainer.replaceChildren();

        const message = document.createElement("p");
        message.className = "empty-message";
        message.textContent = error.message;

        studentsContainer.appendChild(message);
    } finally {
        addStudentBtn.disabled = false;
    }
}

initializePage();
</script>
