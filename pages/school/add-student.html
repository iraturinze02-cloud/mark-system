
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Students</title>

<style>
body{
    font-family:'Segoe UI', Arial;
    margin:0;
    background:#f4f6fb;
    color:#222;
}

/* HEADER */
header{
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    color:white;
    text-align:center;
    padding:20px;
}

header h1{
    margin:0;
    font-size:22px;
}

.btn-add{
    margin-top:10px;
    background:white;
    color:#1d4ed8;
    padding:8px 14px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

/* CONTAINER */
.container{
    width:95%;
    max-width:1000px;
    margin:auto;
    padding:20px;
}

/* CLASS SECTION */
.class-box{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:25px;
    box-shadow:0 4px 10px rgba(0,0,0,0.05);
}

.class-title{
    font-size:18px;
    color:#1d4ed8;
    margin-bottom:10px;
    border-left:4px solid #1d4ed8;
    padding-left:8px;
}

/* TABLE */
.table-wrapper{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    font-size:14px;
}

th{
    background:#1d4ed8;
    color:white;
    padding:10px;
    text-align:left;
}

td{
    padding:10px;
    border-bottom:1px solid #eee;
}

tr:hover{
    background:#f0f6ff;
}

/* BUTTONS */
.edit{
    background:#f59e0b;
    color:white;
    padding:6px 10px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    margin-right:5px;
}

.delete{
    background:#ef4444;
    color:white;
    padding:6px 10px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

/* MODAL */
.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    justify-content:center;
    align-items:center;
    z-index:1000;
}

.modal-box{
    background:white;
    padding:20px;
    border-radius:10px;
    width:320px;
    max-width:calc(100% - 70px);
}

.modal-box input,
.modal-box select{
    width:100%;
    padding:8px;
    margin:8px 0;
    box-sizing:border-box;
}

.save{
    background:#2563eb;
    color:white;
    width:100%;
    padding:10px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.close{
    background:#ef4444;
    color:white;
    width:100%;
    padding:10px;
    border:none;
    border-radius:6px;
    margin-top:5px;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* MESSAGES */
.message{
    display:none;
    padding:10px 12px;
    margin:12px auto;
    border-radius:6px;
    font-size:14px;
    max-width:1000px;
    width:90%;
}

.message.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.message.success{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.empty-row{
    text-align:center;
    color:#777;
}
</style>
</head>

<body>

<script>
const role = localStorage.getItem("role");

if(role !== "school_admin"){
    alert("Access denied");
    location.href = "login.html";
}
</script>

<header>
    <h1>REGISTERED STUDENTS</h1>
    <button class="btn-add" onclick="openModal()">
        + Add Student
    </button>
</header>

<div id="message" class="message"></div>

<div class="container">

    <!-- PRIMARY 6 -->
    <div id="p6Box" class="class-box" style="display:none;">
        <div class="class-title">Primary 6 Students</div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="p6Table"></tbody>
            </table>
        </div>
    </div>

    <!-- SENIOR 3 -->
    <div id="s3Box" class="class-box" style="display:none;">
        <div class="class-title">Senior 3 Students</div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="s3Table"></tbody>
            </table>
        </div>
    </div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">

    <div class="modal-box">

        <h3 id="modalTitle">Add Student</h3>

        <input type="hidden" id="editId">

        <select id="className" required>
            <option value="">Select Class</option>
        </select>

        <input
            type="text"
            id="name"
            placeholder="Student Name"
            maxlength="200"
            required
        >

        <button class="save" id="saveButton" onclick="saveStudent()">
            Save
        </button>

        <button class="close" onclick="closeModal()">
            Close
        </button>

    </div>

</div>

<script>
"use strict";

/* ======================================
   AUTHENTICATION
====================================== */

const currentUser = JSON.parse(
    localStorage.getItem("currentUser") || "null"
);

if(
    localStorage.getItem("role") !== "school_admin" ||
    !currentUser
){
    window.location.href = "login.html";
}

/* ======================================
   VARIABLES
====================================== */

let students = [];
let classes = [];
let editMode = false;

const p6Table = document.getElementById("p6Table");
const s3Table = document.getElementById("s3Table");
const p6Box = document.getElementById("p6Box");
const s3Box = document.getElementById("s3Box");

const modal = document.getElementById("modal");
const modalTitle = document.getElementById("modalTitle");
const editId = document.getElementById("editId");
const nameInput = document.getElementById("name");
const classSelect = document.getElementById("className");
const saveButton = document.getElementById("saveButton");
const messageBox = document.getElementById("message");

/* ======================================
   API HELPER
====================================== */

async function apiRequest(url, options = {}){

    const response = await fetch(url, {
        ...options,
        credentials: "same-origin",
        headers: {
            "Content-Type": "application/json",
            ...(options.headers || {})
        }
    });

    const data = await response.json().catch(() => null);

    if(!data){
        throw new Error(
            "Invalid server response. Please check the API endpoint."
        );
    }

    if(!response.ok || data.success === false){

        if(response.status === 401 || response.status === 403){
            throw new Error(
                data.message || "Your session has expired or access is denied."
            );
        }

        throw new Error(data.message || "Something went wrong.");
    }

    return data;
}

/* ======================================
   MESSAGE
====================================== */

function showMessage(text, type){

    messageBox.textContent = text;
    messageBox.className = "message " + type;

    setTimeout(() => {
        messageBox.className = "message";
    }, 5000);
}

/* ======================================
   CLASS NAME HELPERS
====================================== */

function normalizeClass(value){

    return String(value || "")
        .toLowerCase()
        .replace(/[^a-z0-9]/g, "");
}

function displayClassName(value){

    const key = normalizeClass(value);

    const names = {
        "p1": "Primary 1",
        "p2": "Primary 2",
        "p3": "Primary 3",
        "p4": "Primary 4",
        "p5": "Primary 5",
        "p6": "Primary 6",
        "s1": "Senior 1",
        "s2": "Senior 2",
        "s3": "Senior 3",
        "s4": "Senior 4",
        "s5": "Senior 5",
        "s6": "Senior 6",
        "primary6": "Primary 6",
        "senior3": "Senior 3"
    };

    return names[key] || value;
}

/* ======================================
   LOAD CLASSES
====================================== */

async function loadClasses(){

    const data = await apiRequest("/api/classes");

    classes = Array.isArray(data)
        ? data
        : (data.classes || []);

    classSelect.replaceChildren();

    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "Select Class";

    classSelect.appendChild(placeholder);

    // Only offer the two classes shown on this page.
    const allowedClasses = classes.filter(c => {
        const key = normalizeClass(c.class_name);

        return key === "p6" ||
               key === "primary6" ||
               key === "s3" ||
               key === "senior3";
    });

    allowedClasses.forEach(c => {

        const option = document.createElement("option");

        option.value = String(c.id);
        option.textContent = displayClassName(c.class_name);

        classSelect.appendChild(option);
    });

    if(allowedClasses.length === 0){
        showMessage(
            "Primary 6 and Senior 3 classes were not found. Please check your school's classes.",
            "error"
        );
    }
}

/* ======================================
   LOAD STUDENTS
====================================== */

async function loadStudents(){

    try{

        const data = await apiRequest("/api/students");

        students = data.students || [];

        // Sort alphabetically.
        students.sort((a,b) =>
            String(a.full_name || "").localeCompare(
                String(b.full_name || ""),
                undefined,
                {sensitivity:"base"}
            )
        );

        renderStudents();

    }catch(error){

        showMessage(error.message, "error");

        p6Table.replaceChildren();
        s3Table.replaceChildren();

        p6Box.style.display = "none";
        s3Box.style.display = "none";
    }
}

/* ======================================
   RENDER TABLE ROW
====================================== */

function createStudentRow(student, number){

    const row = document.createElement("tr");

    const numberCell = document.createElement("td");
    numberCell.textContent = number;

    const nameCell = document.createElement("td");
    nameCell.textContent = student.full_name;

    const actionsCell = document.createElement("td");

    const editButton = document.createElement("button");
    editButton.className = "edit";
    editButton.textContent = "Edit";

    editButton.addEventListener("click", () => {
        editStudent(student.id);
    });

    const deleteButton = document.createElement("button");
    deleteButton.className = "delete";
    deleteButton.textContent = "Delete";

    deleteButton.addEventListener("click", () => {
        deleteStudent(student.id);
    });

    actionsCell.append(editButton, deleteButton);

    row.append(numberCell, nameCell, actionsCell);

    return row;
}

/* ======================================
   RENDER STUDENTS
====================================== */

function renderStudents(){

    p6Table.replaceChildren();
    s3Table.replaceChildren();

    const p6Students = students.filter(s => {
        const key = normalizeClass(s.class_name);

        return key === "p6" || key === "primary6";
    });

    const s3Students = students.filter(s => {
        const key = normalizeClass(s.class_name);

        return key === "s3" || key === "senior3";
    });

    // P6 numbering.
    p6Students.forEach((student, index) => {
        p6Table.appendChild(
            createStudentRow(student, index + 1)
        );
    });

    // S3 numbering.
    s3Students.forEach((student, index) => {
        s3Table.appendChild(
            createStudentRow(student, index + 1)
        );
    });

    // Hide empty classes.
    p6Box.style.display =
        p6Students.length > 0 ? "block" : "none";

    s3Box.style.display =
        s3Students.length > 0 ? "block" : "none";
}

/* ======================================
   OPEN MODAL
====================================== */

function openModal(){

    editMode = false;

    modalTitle.textContent = "Add Student";
    editId.value = "";
    nameInput.value = "";
    classSelect.value = "";

    saveButton.textContent = "Save";
    saveButton.disabled = false;

    modal.style.display = "flex";
}

/* ======================================
   EDIT STUDENT
====================================== */

function editStudent(id){

    const student = students.find(
        s => String(s.id) === String(id)
    );

    if(!student){
        showMessage("Student not found.", "error");
        return;
    }

    editMode = true;

    modalTitle.textContent = "Edit Student";
    editId.value = student.id;
    nameInput.value = student.full_name || "";
    classSelect.value = String(student.class_id);

    saveButton.textContent = "Update";

    modal.style.display = "flex";
}

/* ======================================
   CLOSE MODAL
====================================== */

function closeModal(){

    modal.style.display = "none";

    editMode = false;
    editId.value = "";
    nameInput.value = "";
    classSelect.value = "";

    saveButton.disabled = false;
    saveButton.textContent = "Save";
}

/* ======================================
   SAVE STUDENT
====================================== */

async function saveStudent(){

    const id = editId.value;
    const full_name = nameInput.value.trim();
    const class_id = Number(classSelect.value);

    if(!full_name){
        showMessage("Enter the student's name.", "error");
        return;
    }

    if(!class_id){
        showMessage("Please select a class.", "error");
        return;
    }

    const body = {
        full_name,
        class_id
    };

    let url = "/api/students";

    if(editMode){
        url = "/api/students/update";
        body.id = Number(id);
    }

    saveButton.disabled = true;
    saveButton.textContent = "Saving...";

    try{

        await apiRequest(url, {
            method: "POST",
            body: JSON.stringify(body)
        });

        closeModal();

        showMessage(
            editMode
                ? "Student updated successfully."
                : "Student registered successfully.",
            "success"
        );

        await loadStudents();

    }catch(error){

        showMessage(error.message, "error");

    }finally{

        saveButton.disabled = false;
        saveButton.textContent = editMode ? "Update" : "Save";
    }
}

/* ======================================
   DELETE / DEACTIVATE STUDENT
====================================== */

async function deleteStudent(id){

    if(!confirm("Delete student?")) return;

    try{

        await apiRequest("/api/students/delete", {
            method: "POST",
            body: JSON.stringify({id: Number(id)})
        });

        showMessage("Student deactivated successfully.", "success");

        await loadStudents();

    }catch(error){

        showMessage(error.message, "error");
    }
}

/* ======================================
   INITIALIZE
====================================== */

async function initialize(){

    try{

        await loadClasses();
        await loadStudents();

    }catch(error){

        showMessage(error.message, "error");
    }
}

initialize();

</script>

</body>
</html>
