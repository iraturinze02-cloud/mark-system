
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Students Management</title>
<link rel="stylesheet" href="style.css">

<style>
:root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --success: #15803d;
    --danger: #dc2626;
    --background: #f4f6fb;
    --border: #e5e7eb;
    --text: #1f2937;
    --muted: #64748b;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px 15px;
    background: var(--background);
    color: var(--text);
    font-family: Arial, sans-serif;
}

.container {
    max-width: 1050px;
    margin: 25px auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 4px 18px rgba(0,0,0,.06);
}

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 25px;
}

.header h2 {
    margin: 0;
    font-size: 21px;
}

button {
    border: none;
    border-radius: 6px;
    padding: 10px 15px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
}

.add-btn {
    background: var(--primary);
    color: white;
}

.add-btn:hover {
    background: var(--primary-dark);
}

.class-section {
    margin-top: 25px;
}

.class-title {
    background: #eff6ff;
    color: #1d4ed8;
    padding: 12px 15px;
    border-radius: 7px;
    margin-bottom: 12px;
    font-size: 16px;
}

.table-wrapper {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 500px;
}

th, td {
    text-align: left;
    padding: 13px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
}

th {
    background: #f8fafc;
    font-weight: 700;
}

.action-buttons {
    display: flex;
    gap: 7px;
}

.edit-btn {
    background: #dbeafe;
    color: #1d4ed8;
}

.delete-btn {
    background: #fee2e2;
    color: #b91c1c;
}

.empty-message {
    text-align: center;
    color: var(--muted);
    padding: 20px;
}

.status-message {
    display: none;
    padding: 12px 15px;
    margin-bottom: 18px;
    border-radius: 7px;
    font-size: 14px;
}

.status-message.success {
    display: block;
    background: #dcfce7;
    color: #166534;
}

.status-message.error {
    display: block;
    background: #fee2e2;
    color: #991b1b;
}

.status-message.info {
    display: block;
    background: #eff6ff;
    color: #1d4ed8;
}

/* MODAL */

.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    inset: 0;
    background: rgba(0,0,0,.5);
    align-items: center;
    justify-content: center;
    padding: 15px;
}

.modal-content {
    background: white;
    width: 100%;
    max-width: 450px;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 10px 35px rgba(0,0,0,.15);
}

.modal-content h3 {
    margin: 0 0 20px;
}

.form-group {
    margin-bottom: 17px;
}

.form-group label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 7px;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    outline: none;
    font-size: 14px;
    background: white;
}

.form-group input:focus,
.form-group select:focus {
    border-color: var(--primary);
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 22px;
}

.cancel-btn {
    background: #e5e7eb;
    color: #374151;
}

.save-btn {
    background: var(--primary);
    color: white;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

@media(max-width:600px) {
    .container {
        padding: 16px;
        margin: 10px auto;
    }

    .header h2 {
        font-size: 18px;
    }

    .header button {
        width: 100%;
    }

    .modal-content {
        padding: 20px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h2>REGISTERED STUDENTS</h2>
        <button class="add-btn" id="addStudentBtn">
            + Add Student
        </button>
    </div>

    <div id="statusMessage" class="status-message"></div>

    <div id="studentsContainer">
        <p class="empty-message">Loading students...</p>
    </div>

</div>

<!-- STUDENT MODAL -->

<div class="modal" id="studentModal">
    <div class="modal-content">

        <h3 id="modalTitle">Register Student</h3>

        <form id="studentForm">

            <div class="form-group">
                <label for="studentClass">Class</label>
                <select id="studentClass" required>
                    <option value="">Loading classes...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="studentName">Student Full Name</label>
                <input
                    type="text"
                    id="studentName"
                    maxlength="200"
                    placeholder="Enter student full name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="studentGender">Gender</label>
                <select id="studentGender">
                    <option value="">Select gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>

            <div class="form-group">
                <label for="dateOfBirth">Date of Birth</label>
                <input type="date" id="dateOfBirth">
            </div>

            <div class="form-group">
                <label for="admissionDate">Admission Date</label>
                <input type="date" id="admissionDate">
            </div>

            <div class="modal-actions">
                <button type="button" class="cancel-btn" id="cancelBtn">
                    Cancel
                </button>

                <button type="submit" class="save-btn" id="saveBtn">
                    Save Student
                </button>
            </div>

        </form>
    </div>
</div>

<script>
"use strict";

/* =====================================
   AUTHENTICATION
===================================== */

const currentUser = JSON.parse(
    localStorage.getItem("currentUser") || "null"
);

if (localStorage.getItem("role") !== "school_admin" || !currentUser) {
    window.location.href = "login.html";
}

/* =====================================
   ELEMENTS AND STATE
===================================== */

const studentsContainer = document.getElementById("studentsContainer");
const studentModal = document.getElementById("studentModal");
const studentForm = document.getElementById("studentForm");
const studentClass = document.getElementById("studentClass");
const studentName = document.getElementById("studentName");
const studentGender = document.getElementById("studentGender");
const dateOfBirth = document.getElementById("dateOfBirth");
const admissionDate = document.getElementById("admissionDate");
const modalTitle = document.getElementById("modalTitle");
const saveBtn = document.getElementById("saveBtn");
const statusMessage = document.getElementById("statusMessage");

let students = [];
let classes = [];
let editingStudentId = null;

/* =====================================
   API REQUEST HELPER
===================================== */

async function apiRequest(url, options = {}) {
    const response = await fetch(url, {
        ...options,
        credentials: "same-origin",
        headers: {
            "Content-Type": "application/json",
            ...(options.headers || {})
        }
    });

    const result = await response.json().catch(() => null);

    if (!result) {
        throw new Error(
            "The server returned an invalid response. Check the API endpoint."
        );
    }

    if (!response.ok || result.success === false) {
        if (response.status === 401 || response.status === 403) {
            throw new Error(result.message || "Your session is not authorized.");
        }

        throw new Error(result.message || "Request failed.");
    }

    return result;
}

/* =====================================
   MESSAGE
===================================== */

function showMessage(message, type = "success") {
    statusMessage.textContent = message;
    statusMessage.className = "status-message " + type;

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

    if (type !== "info") {
        setTimeout(() => {
            statusMessage.style.display = "none";
            statusMessage.className = "status-message";
        }, 5000);
    }
}

/* =====================================
   LOAD CLASSES
===================================== */

async function loadClasses() {
    const result = await apiRequest("/api/classes");

    classes = Array.isArray(result)
        ? result
        : (result.classes || []);

    studentClass.replaceChildren();

    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "Select class";
    studentClass.appendChild(placeholder);

    classes.forEach(item => {
        const option = document.createElement("option");

        option.value = item.id;
        option.textContent = formatClassName(item.class_name);

        studentClass.appendChild(option);
    });

    if (classes.length === 0) {
        studentClass.replaceChildren();

        const option = document.createElement("option");
        option.value = "";
        option.textContent = "No classes available";
        studentClass.appendChild(option);
    }
}

/* =====================================
   CLASS NAME FORMATTING
===================================== */

function formatClassName(name) {
    const value = String(name || "").trim();

    const mapping = {
        "P1": "Primary 1",
        "P2": "Primary 2",
        "P3": "Primary 3",
        "P4": "Primary 4",
        "P5": "Primary 5",
        "P6": "Primary 6",
        "S1": "Senior 1",
        "S2": "Senior 2",
        "S3": "Senior 3",
        "S4": "Senior 4",
        "S5": "Senior 5",
        "S6": "Senior 6"
    };

    return mapping[value.toUpperCase()] || value;
}

function normalizeClassName(name) {
    return String(name || "")
        .toLowerCase()
        .replace(/[^a-z0-9]/g, "");
}

function getStudentClassName(student) {
    return student.class_name || "";
}

/* =====================================
   LOAD STUDENTS
===================================== */

async function loadStudents() {
    studentsContainer.replaceChildren();

    const loading = document.createElement("p");
    loading.className = "empty-message";
    loading.textContent = "Loading students...";
    studentsContainer.appendChild(loading);

    try {
        const result = await apiRequest("/api/students");

        students = result.students || [];

        renderStudents();

    } catch (error) {
        studentsContainer.replaceChildren();

        const message = document.createElement("p");
        message.className = "empty-message";
        message.textContent = error.message;

        studentsContainer.appendChild(message);
        showMessage(error.message, "error");
    }
}

/* =====================================
   RENDER STUDENTS
===================================== */

function renderStudents() {
    studentsContainer.replaceChildren();

    /*
       Keep the original two sections:
       Primary 6 and Senior 3.
    */

    const sections = [
        {
            title: "Primary 6",
            names: ["p6", "primary6"]
        },
        {
            title: "Senior 3",
            names: ["s3", "senior3"]
        }
    ];

    sections.forEach(section => {
        const sectionStudents = students.filter(student => {
            const name = normalizeClassName(
                getStudentClassName(student)
            );

            return section.names.includes(name);
        });

        const sectionElement = document.createElement("div");
        sectionElement.className = "class-section";

        const heading = document.createElement("h3");
        heading.className = "class-title";
        heading.textContent =
            section.title + " (" + sectionStudents.length + ")";

        sectionElement.appendChild(heading);

        const wrapper = document.createElement("div");
        wrapper.className = "table-wrapper";

        const table = document.createElement("table");

        const thead = document.createElement("thead");
        const headerRow = document.createElement("tr");

        ["#", "Student Name", "Student Code", "Actions"].forEach(label => {
            const th = document.createElement("th");
            th.textContent = label;
            headerRow.appendChild(th);
        });

        thead.appendChild(headerRow);
        table.appendChild(thead);

        const tbody = document.createElement("tbody");

        if (sectionStudents.length === 0) {
            const row = document.createElement("tr");
            const cell = document.createElement("td");

            cell.colSpan = 4;
            cell.className = "empty-message";
            cell.textContent = "No students registered in this class.";

            row.appendChild(cell);
            tbody.appendChild(row);

        } else {
            sectionStudents.forEach((student, index) => {
                const row = document.createElement("tr");

                const numberCell = document.createElement("td");
                numberCell.textContent = String(index + 1);

                const nameCell = document.createElement("td");
                nameCell.textContent = student.full_name;

                const codeCell = document.createElement("td");
                codeCell.textContent = student.student_code || "—";

                const actionsCell = document.createElement("td");
                const actions = document.createElement("div");
                actions.className = "action-buttons";

                const editButton = document.createElement("button");
                editButton.type = "button";
                editButton.className = "edit-btn";
                editButton.textContent = "Edit";
                editButton.addEventListener("click", () => {
                    openEditModal(student.id);
                });

                const deleteButton = document.createElement("button");
                deleteButton.type = "button";
                deleteButton.className = "delete-btn";
                deleteButton.textContent = "Delete";
                deleteButton.addEventListener("click", () => {
                    deactivateStudent(student.id);
                });

                actions.append(editButton, deleteButton);
                actionsCell.appendChild(actions);

                row.append(
                    numberCell,
                    nameCell,
                    codeCell,
                    actionsCell
                );

                tbody.appendChild(row);
            });
        }

        table.appendChild(tbody);
        wrapper.appendChild(table);
        sectionElement.appendChild(wrapper);

        studentsContainer.appendChild(sectionElement);
    });
}

/* =====================================
   OPEN REGISTRATION MODAL
===================================== */

function openAddModal() {
    editingStudentId = null;

    studentForm.reset();

    modalTitle.textContent = "Register Student";
    saveBtn.textContent = "Save Student";

    studentModal.style.display = "flex";
}

/* =====================================
   OPEN EDIT MODAL
===================================== */

function openEditModal(id) {
    const student = students.find(item => String(item.id) === String(id));

    if (!student) {
        showMessage("Student not found.", "error");
        return;
    }

    editingStudentId = student.id;

    studentClass.value = student.class_id;
    studentName.value = student.full_name || "";
    studentGender.value = student.gender || "";
    dateOfBirth.value = student.date_of_birth
        ? String(student.date_of_birth).slice(0, 10)
        : "";
    admissionDate.value = student.admission_date
        ? String(student.admission_date).slice(0, 10)
        : "";

    modalTitle.textContent = "Edit Student";
    saveBtn.textContent = "Update Student";

    studentModal.style.display = "flex";
}

/* =====================================
   CLOSE MODAL
===================================== */

function closeModal() {
    studentModal.style.display = "none";
    studentForm.reset();
    editingStudentId = null;
}

document.getElementById("cancelBtn").addEventListener(
    "click",
    closeModal
);

studentModal.addEventListener("click", event => {
    if (event.target === studentModal) {
        closeModal();
    }
});

/* =====================================
   SAVE / UPDATE STUDENT
===================================== */

studentForm.addEventListener("submit", async event => {
    event.preventDefault();

    const classId = Number(studentClass.value);
    const fullName = studentName.value.trim();

    if (!classId || !fullName) {
        showMessage("Please enter the student name and select a class.", "error");
        return;
    }

    const payload = {
        class_id: classId,
        full_name: fullName,
        gender: studentGender.value || null,
        date_of_birth: dateOfBirth.value || null,
        admission_date: admissionDate.value || null
    };

    saveBtn.disabled = true;
    saveBtn.textContent = "Please wait...";

    try {
        if (editingStudentId !== null) {
            payload.id = editingStudentId;

            await apiRequest("/api/students/update", {
                method: "POST",
                body: JSON.stringify(payload)
            });

            closeModal();
            showMessage("Student updated successfully.");

        } else {
            await apiRequest("/api/students", {
                method: "POST",
                body: JSON.stringify(payload)
            });

            closeModal();
            showMessage("Student registered successfully.");
        }

        await loadStudents();

    } catch (error) {
        showMessage(error.message, "error");

    } finally {
        saveBtn.disabled = false;
        saveBtn.textContent =
            editingStudentId !== null ? "Update Student" : "Save Student";
    }
});

/* =====================================
   DEACTIVATE STUDENT
===================================== */

async function deactivateStudent(id) {
    const confirmed = confirm(
        "Are you sure you want to deactivate this student?"
    );

    if (!confirmed) return;

    try {
        await apiRequest("/api/students/delete", {
            method: "POST",
            body: JSON.stringify({ id })
        });

        students = students.filter(
            student => String(student.id) !== String(id)
        );

        renderStudents();

        showMessage("Student deactivated successfully.");

    } catch (error) {
        showMessage(error.message, "error");
    }
}

/* =====================================
   BUTTON EVENTS
===================================== */

document.getElementById("addStudentBtn").addEventListener(
    "click",
    openAddModal
);

/* =====================================
   INITIALIZE PAGE
===================================== */

async function initializePage() {
    try {
        await loadClasses();
        await loadStudents();

    } catch (error) {
        showMessage(error.message, "error");
        studentsContainer.textContent = error.message;
    }
}

initializePage();

</script>

</body>
</html>
