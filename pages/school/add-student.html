
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Students Management</title>
<link rel="stylesheet" href="../../style.css">

<style>
:root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --success: #15803d;
    --danger: #dc2626;
    --background: #f4f6fb;
    --border: #e5e7eb;
    --text: #1f2937;
    --muted: #64748b;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px 15px;
    background: var(--background);
    color: var(--text);
    font-family: Arial, sans-serif;
}

.container {
    max-width: 1050px;
    margin: 25px auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 4px 18px rgba(0,0,0,.06);
}

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 25px;
}

.header h2 {
    margin: 0;
    font-size: 21px;
}

button {
    border: none;
    border-radius: 6px;
    padding: 10px 15px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.add-btn,
.save-btn {
    background: var(--primary);
    color: white;
}

.add-btn:hover,
.save-btn:hover {
    background: var(--primary-dark);
}

/* =====================================
   CLASS SELECTION CARDS
===================================== */

.class-instruction {
    font-size: 14px;
    color: var(--muted);
    margin: 0 0 14px;
}

.class-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
    gap: 12px;
    margin-bottom: 25px;
}

.class-card {
    display: block;
    width: 100%;
    padding: 17px 12px;
    border: 2px solid var(--border);
    border-radius: 9px;
    background: #fff;
    color: var(--text);
    text-align: center;
    transition: .2s ease;
}

.class-card:hover {
    border-color: var(--primary);
    background: #eff6ff;
}

.class-card.active {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
}

.class-card strong {
    display: block;
    font-size: 16px;
    margin-bottom: 7px;
}

.class-card small {
    font-size: 12px;
    font-weight: 400;
    opacity: .85;
}

/* =====================================
   STUDENT TABLE
===================================== */

.class-section {
    margin-top: 20px;
}

.class-title {
    background: #eff6ff;
    color: #1d4ed8;
    padding: 12px 15px;
    border-radius: 7px;
    margin-bottom: 12px;
    font-size: 16px;
}

.table-wrapper {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 500px;
}

th,
td {
    text-align: left;
    padding: 13px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
}

th {
    background: #f8fafc;
    font-weight: 700;
}

.action-buttons {
    display: flex;
    gap: 7px;
}

.edit-btn {
    background: #dbeafe;
    color: #1d4ed8;
}

.delete-btn {
    background: #fee2e2;
    color: #b91c1c;
}

.empty-message {
    text-align: center;
    color: var(--muted);
    padding: 22px;
    font-size: 14px;
}

/* =====================================
   STATUS MESSAGE
===================================== */

.status-message {
    display: none;
    padding: 12px 15px;
    margin-bottom: 18px;
    border-radius: 7px;
    font-size: 14px;
}

.status-message.success {
    display: block;
    background: #dcfce7;
    color: #166534;
}

.status-message.error {
    display: block;
    background: #fee2e2;
    color: #991b1b;
}

.status-message.info {
    display: block;
    background: #eff6ff;
    color: #1d4ed8;
}

/* =====================================
   MODAL
===================================== */

.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    inset: 0;
    background: rgba(0,0,0,.5);
    align-items: center;
    justify-content: center;
    padding: 15px;
}

.modal-content {
    background: white;
    width: 100%;
    max-width: 470px;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 10px 35px rgba(0,0,0,.15);
    max-height: 90vh;
    overflow-y: auto;
}

.modal-content h3 {
    margin: 0 0 20px;
}

.form-group {
    margin-bottom: 19px;
}

.form-group label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 9px;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    outline: none;
    font-size: 14px;
    background: white;
}

.form-group input:focus,
.form-group select:focus {
    border-color: var(--primary);
}

/* =====================================
   MODAL CLASS CARDS
===================================== */

.form-class-cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
}

.form-class-card {
    width: 100%;
    padding: 12px 5px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: white;
    color: var(--text);
    font-size: 13px;
    text-align: center;
    transition: .2s ease;
}

.form-class-card:hover {
    border-color: var(--primary);
    background: #eff6ff;
}

.form-class-card.active {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 22px;
}

.cancel-btn {
    background: #e5e7eb;
    color: #374151;
}

/* =====================================
   RESPONSIVE
===================================== */

@media(max-width:600px) {
    body {
        padding: 10px;
    }

    .container {
        padding: 16px;
        margin: 10px auto;
    }

    .header h2 {
        font-size: 18px;
    }

    .header button {
        width: 100%;
    }

    .class-cards {
        grid-template-columns: repeat(2, 1fr);
    }

    .form-class-cards {
        grid-template-columns: repeat(2, 1fr);
    }

    .modal-content {
        padding: 20px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h2>REGISTERED STUDENTS</h2>

        <button class="add-btn" id="addStudentBtn">
            + Add Student
        </button>
    </div>

    <div id="statusMessage" class="status-message"></div>

    <p class="class-instruction">
        Select a class to view its registered students.
    </p>

    <!-- ONLY CLASSES WITH ACTIVE STUDENTS -->
    <div id="classCards" class="class-cards"></div>

    <!-- SELECTED CLASS STUDENTS -->
    <div id="studentsContainer">
        <p class="empty-message">Loading students...</p>
    </div>

</div>

<!-- =====================================
     STUDENT MODAL
===================================== -->

<div class="modal" id="studentModal">

    <div class="modal-content">

        <h3 id="modalTitle">Register Student</h3>

        <form id="studentForm">

            <div class="form-group">

                <label>Select Class</label>

                <!-- ALL CLASSES, INCLUDING EMPTY CLASSES -->
                <div id="formClassCards" class="form-class-cards"></div>

            </div>

            <div class="form-group">

                <label for="studentName">
                    Student Full Name
                </label>

                <input
                    type="text"
                    id="studentName"
                    maxlength="200"
                    placeholder="Enter student full name"
                    autocomplete="off"
                    required
                >

            </div>

            <div class="form-group">

                <label for="studentGender">Gender</label>

                <select id="studentGender">
                    <option value="">Select gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>

            </div>

            <div class="modal-actions">

                <button
                    type="button"
                    class="cancel-btn"
                    id="cancelBtn"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="save-btn"
                    id="saveBtn"
                >
                    Save Student
                </button>

            </div>

        </form>

    </div>

</div>

<script>
"use strict";

/* =====================================
   AUTHENTICATION
===================================== */

let currentUser = null;

try {
    currentUser = JSON.parse(
        localStorage.getItem("currentUser") || "null"
    );
} catch {
    currentUser = null;
}

if (
    localStorage.getItem("role") !== "school_admin" ||
    !currentUser
) {
    window.location.replace("login.html");
}

/* =====================================
   ELEMENTS
===================================== */

const studentsContainer =
    document.getElementById("studentsContainer");

const classCards =
    document.getElementById("classCards");

const formClassCards =
    document.getElementById("formClassCards");

const studentModal =
    document.getElementById("studentModal");

const studentForm =
    document.getElementById("studentForm");

const studentName =
    document.getElementById("studentName");

const studentGender =
    document.getElementById("studentGender");

const modalTitle =
    document.getElementById("modalTitle");

const saveBtn =
    document.getElementById("saveBtn");

const statusMessage =
    document.getElementById("statusMessage");

const addStudentBtn =
    document.getElementById("addStudentBtn");

/* =====================================
   STATE
===================================== */

let students = [];
let classes = [];

let selectedClassId = "";
let formClassId = "";

let editingStudentId = null;
let messageTimer = null;

/* =====================================
   API REQUEST HELPER
===================================== */

async function apiRequest(url, options = {}) {

    const response = await fetch(url, {
        ...options,

        credentials: "same-origin",

        headers: {
            ...(options.body
                ? { "Content-Type": "application/json" }
                : {}),
            ...(options.headers || {})
        }
    });

    const result = await response.json().catch(() => null);

    if (!result) {
        throw new Error(
            "The server returned an invalid response. Check the API endpoint."
        );
    }

    if (!response.ok || result.success === false) {

        if (response.status === 401 || response.status === 403) {
            window.location.replace("login.html");
        }

        throw new Error(
            result.message || "Request failed."
        );
    }

    return result;
}

/* =====================================
   MESSAGE
===================================== */

function showMessage(message, type = "success") {

    clearTimeout(messageTimer);

    statusMessage.textContent = message;
    statusMessage.className = "status-message " + type;

    if (type !== "info") {

        messageTimer = setTimeout(() => {
            statusMessage.className = "status-message";
            statusMessage.textContent = "";
        }, 5000);
    }
}

/* =====================================
   CLASS NAME FORMATTING
===================================== */

function formatClassName(name) {

    const value = String(name || "").trim();

    const mapping = {
        "P1": "Primary 1",
        "P2": "Primary 2",
        "P3": "Primary 3",
        "P4": "Primary 4",
        "P5": "Primary 5",
        "P6": "Primary 6",

        "S1": "Senior 1",
        "S2": "Senior 2",
        "S3": "Senior 3",
        "S4": "Senior 4",
        "S5": "Senior 5",
        "S6": "Senior 6"
    };

    return mapping[value.toUpperCase()] || value;
}

/* =====================================
   LOAD ALL SCHOOL CLASSES
===================================== */

async function loadClasses() {

    const result = await apiRequest("/api/classes");

    classes = Array.isArray(result)
        ? result
        : (result.classes || []);

    renderClassCards();
    renderFormClassCards();

    addStudentBtn.disabled = classes.length === 0;
}

/* =====================================
   LOAD STUDENTS
===================================== */

async function loadStudents() {

    studentsContainer.replaceChildren();

    const loading = document.createElement("p");
    loading.className = "empty-message";
    loading.textContent = "Loading students...";

    studentsContainer.appendChild(loading);

    const result = await apiRequest("/api/students");

    students = result.students || [];

    // Refresh visible class cards after loading learners.
    renderClassCards();

    // Display the currently selected class.
    renderStudents();
}

/* =====================================
   GET ACTIVE STUDENTS IN A CLASS
===================================== */

function getClassStudents(classId) {

    return students
        .filter(student =>
            String(student.class_id) === String(classId) &&
            student.status === "active"
        )
        .sort((a, b) =>
            String(a.full_name || "").localeCompare(
                String(b.full_name || "")
            )
        );
}

/* =====================================
   RENDER MAIN CLASS CARDS
===================================== */

function renderClassCards() {

    classCards.replaceChildren();

    /*
       Only show classes containing at least
       one active registered student.
    */

    const availableClasses = classes.filter(cls =>
        getClassStudents(cls.id).length > 0
    );

    /*
       If the selected class no longer has
       active students, clear its selection.
    */

    const selectedStillAvailable = availableClasses.some(
        cls => String(cls.id) === String(selectedClassId)
    );

    if (!selectedStillAvailable) {
        selectedClassId = "";
    }

    if (availableClasses.length === 0) {

        const message = document.createElement("p");
        message.className = "empty-message";
        message.textContent =
            "No students have been registered in any class yet.";

        classCards.appendChild(message);

        return;
    }

    availableClasses.forEach(cls => {

        const count = getClassStudents(cls.id).length;

        const card = document.createElement("button");

        card.type = "button";
        card.className = "class-card";

        if (String(selectedClassId) === String(cls.id)) {
            card.classList.add("active");
            card.setAttribute("aria-pressed", "true");
        } else {
            card.setAttribute("aria-pressed", "false");
        }

        const title = document.createElement("strong");
        title.textContent = formatClassName(cls.class_name);

        const total = document.createElement("small");
        total.textContent =
            count + (count === 1
                ? " registered student"
                : " registered students");

        card.append(title, total);

        card.addEventListener("click", () => {

            selectedClassId = String(cls.id);

            renderClassCards();
            renderStudents();

        });

        classCards.appendChild(card);

    });
}

/* =====================================
   RENDER MODAL CLASS CARDS
===================================== */

function renderFormClassCards() {

    formClassCards.replaceChildren();

    if (classes.length === 0) {

        const message = document.createElement("p");
        message.className = "empty-message";
        message.textContent = "No classes available.";

        formClassCards.appendChild(message);

        return;
    }

    /*
       Show ALL classes here, even if they
       do not have registered students yet.
    */

    classes.forEach(cls => {

        const card = document.createElement("button");

        card.type = "button";
        card.className = "form-class-card";

        if (String(formClassId) === String(cls.id)) {
            card.classList.add("active");
            card.setAttribute("aria-pressed", "true");
        } else {
            card.setAttribute("aria-pressed", "false");
        }

        card.textContent = formatClassName(cls.class_name);

        card.addEventListener("click", () => {

            formClassId = String(cls.id);

            renderFormClassCards();

        });

        formClassCards.appendChild(card);

    });
}

/* =====================================
   RENDER SELECTED CLASS STUDENTS
===================================== */

function renderStudents() {

    studentsContainer.replaceChildren();

    if (!selectedClassId) {

        const message = document.createElement("p");

        message.className = "empty-message";

        message.textContent =
            "Tap a class above to view its registered students.";

        studentsContainer.appendChild(message);

        return;
    }

    const selectedClass = classes.find(cls =>
        String(cls.id) === String(selectedClassId)
    );

    if (!selectedClass) {

        const message = document.createElement("p");

        message.className = "empty-message";
        message.textContent = "Selected class was not found.";

        studentsContainer.appendChild(message);

        return;
    }

    const sectionStudents = getClassStudents(selectedClassId);

    const section = document.createElement("div");
    section.className = "class-section";

    const heading = document.createElement("h3");

    heading.className = "class-title";

    heading.textContent =
        formatClassName(selectedClass.class_name) +
        " (" + sectionStudents.length + " students)";

    section.appendChild(heading);

    const wrapper = document.createElement("div");
    wrapper.className = "table-wrapper";

    const table = document.createElement("table");

    const thead = document.createElement("thead");
    const headerRow = document.createElement("tr");

    ["#", "Student Name", "Student Code", "Actions"].forEach(label => {

        const th = document.createElement("th");

        th.textContent = label;

        headerRow.appendChild(th);

    });

    thead.appendChild(headerRow);
    table.appendChild(thead);

    const tbody = document.createElement("tbody");

    if (sectionStudents.length === 0) {

        const row = document.createElement("tr");
        const cell = document.createElement("td");

        cell.colSpan = 4;
        cell.className = "empty-message";
        cell.textContent = "No students registered in this class.";

        row.appendChild(cell);
        tbody.appendChild(row);

    } else {

        sectionStudents.forEach((student, index) => {

            const row = document.createElement("tr");

            const numberCell = document.createElement("td");
            numberCell.textContent = String(index + 1);

            const nameCell = document.createElement("td");
            nameCell.textContent = student.full_name || "";

            const codeCell = document.createElement("td");
            codeCell.textContent = student.student_code || "—";

            const actionsCell = document.createElement("td");

            const actions = document.createElement("div");
            actions.className = "action-buttons";

            // EDIT BUTTON

            const editButton = document.createElement("button");

            editButton.type = "button";
            editButton.className = "edit-btn";
            editButton.textContent = "Edit";

            editButton.addEventListener("click", () => {
                openEditModal(student.id);
            });

            // DELETE BUTTON

            const deleteButton = document.createElement("button");

            deleteButton.type = "button";
            deleteButton.className = "delete-btn";
            deleteButton.textContent = "Delete";

            deleteButton.addEventListener("click", () => {
                deactivateStudent(student.id);
            });

            actions.append(editButton, deleteButton);

            actionsCell.appendChild(actions);

            row.append(
                numberCell,
                nameCell,
                codeCell,
                actionsCell
            );

            tbody.appendChild(row);

        });

    }

    table.appendChild(tbody);
    wrapper.appendChild(table);
    section.appendChild(wrapper);

    studentsContainer.appendChild(section);
}

/* =====================================
   OPEN ADD STUDENT MODAL
===================================== */

function openAddModal() {

    if (classes.length === 0) {

        showMessage(
            "No classes are available for registration.",
            "error"
        );

        return;
    }

    editingStudentId = null;

    studentForm.reset();

    /*
       Automatically select the class currently
       being viewed, if there is one.
    */

    formClassId = selectedClassId || "";

    modalTitle.textContent = "Register Student";
    saveBtn.textContent = "Save Student";

    renderFormClassCards();

    studentModal.style.display = "flex";
}

/* =====================================
   OPEN EDIT STUDENT MODAL
===================================== */

function openEditModal(id) {

    const student = students.find(item =>
        String(item.id) === String(id)
    );

    if (!student) {

        showMessage("Student not found.", "error");

        return;
    }

    editingStudentId = student.id;

    formClassId = String(student.class_id);

    studentName.value = student.full_name || "";

    studentGender.value = student.gender || "";

    modalTitle.textContent = "Edit Student";

    saveBtn.textContent = "Update Student";

    renderFormClassCards();

    studentModal.style.display = "flex";
}

/* =====================================
   CLOSE MODAL
===================================== */

function closeModal() {

    studentModal.style.display = "none";

    studentForm.reset();

    editingStudentId = null;
    formClassId = "";
}

document.getElementById("cancelBtn").addEventListener(
    "click",
    closeModal
);

studentModal.addEventListener("click", event => {

    if (event.target === studentModal) {
        closeModal();
    }

});

/* =====================================
   SAVE / UPDATE STUDENT
===================================== */

studentForm.addEventListener("submit", async event => {

    event.preventDefault();

    const fullName = studentName.value.trim();

    const classId = Number(formClassId);

    if (!classId || !fullName) {

        showMessage(
            "Please select a class and enter the student's name.",
            "error"
        );

        return;
    }

    const isEditing = editingStudentId !== null;

    const payload = {
        class_id: classId,
        full_name: fullName,
        gender: studentGender.value || null
    };

    if (isEditing) {
        payload.id = editingStudentId;
    }

    saveBtn.disabled = true;
    saveBtn.textContent = "Please wait...";

    try {

        if (isEditing) {

            await apiRequest("/api/students/update", {
                method: "POST",
                body: JSON.stringify(payload)
            });

        } else {

            await apiRequest("/api/students", {
                method: "POST",
                body: JSON.stringify(payload)
            });

        }

        /*
           After registration or moving a learner,
           display the class selected in the form.
        */

        selectedClassId = String(classId);

        closeModal();

        await loadStudents();

        showMessage(
            isEditing
                ? "Student updated successfully."
                : "Student registered successfully."
        );

    } catch (error) {

        showMessage(error.message, "error");

    } finally {

        saveBtn.disabled = false;
        saveBtn.textContent = "Save Student";

    }

});

/* =====================================
   DEACTIVATE STUDENT
===================================== */

async function deactivateStudent(id) {

    const confirmed = confirm(
        "Are you sure you want to deactivate this student?"
    );

    if (!confirmed) return;

    try {

        await apiRequest("/api/students/delete", {
            method: "POST",
            body: JSON.stringify({ id })
        });

        // Remove from the local active student list.
        students = students.filter(student =>
            String(student.id) !== String(id)
        );

        // A class with no remaining active learners
        // automatically disappears from the cards.
        renderClassCards();
        renderStudents();

        showMessage("Student deactivated successfully.");

    } catch (error) {

        showMessage(error.message, "error");

    }
}

/* =====================================
   BUTTON EVENTS
===================================== */

addStudentBtn.addEventListener("click", openAddModal);

/* =====================================
   INITIALIZE PAGE
===================================== */

async function initializePage() {

    try {

        addStudentBtn.disabled = true;

        await loadClasses();

        await loadStudents();

    } catch (error) {

        showMessage(error.message, "error");

        classCards.replaceChildren();
        studentsContainer.replaceChildren();

        const message = document.createElement("p");

        message.className = "empty-message";
        message.textContent = error.message;

        studentsContainer.appendChild(message);

    } finally {

        addStudentBtn.disabled = classes.length === 0;

    }

}

initializePage();

</script>

</body>
</html>
