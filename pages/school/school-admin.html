
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>School Admin Dashboard | Sector Education Examination Platform</title>

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f7fb;
            font-family: Arial, sans-serif;
            color: #1f2937;
        }

        /* HEADER */
        .admin-header {
            background: linear-gradient(135deg, #1e40af, #1d4ed8);
            color: white;
            padding: 25px 20px;
            text-align: center;
        }

        .admin-header h1 {
            margin: 0;
            font-size: 25px;
            letter-spacing: 0.5px;
        }

        .admin-header p {
            margin: 8px 0 0;
            font-size: 14px;
            opacity: 0.9;
        }

        /* TOP ACTIONS */
        .top-actions {
            max-width: 1100px;
            margin: 15px auto 0;
            padding: 0 20px;
            display: flex;
            justify-content: flex-end;
        }

        .logout-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .logout-btn:hover {
            background: #b91c1c;
        }

        .logout-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* MAIN CONTENT */
        .dashboard-container {
            max-width: 1100px;
            margin: 25px auto;
            padding: 0 20px 35px;
        }

        .welcome-card {
            background: white;
            padding: 28px;
            border-radius: 14px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        .welcome-card h2 {
            margin: 0;
            color: #1e40af;
            font-size: 22px;
        }

        .welcome-message {
            margin: 10px 0 0;
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
        }

        /* DASHBOARD GRID */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
            margin-top: 28px;
        }

        /* DASHBOARD CARDS */
        .dashboard-card {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #ffffff, #f8fafc);
            border: 1px solid #e2e8f0;
            padding: 25px;
            border-radius: 12px;
            text-align: left;
            cursor: pointer;
            color: inherit;
            transition: 0.25s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
        }

        .dashboard-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.09);
            border-color: #2563eb;
        }

        .dashboard-card:focus-visible,
        .logout-btn:focus-visible {
            outline: 3px solid #93c5fd;
            outline-offset: 3px;
        }

        .card-icon {
            font-size: 30px;
            margin-bottom: 15px;
        }

        .dashboard-card h3 {
            margin: 0;
            color: #1d4ed8;
            font-size: 17px;
        }

        .dashboard-card p {
            margin: 10px 0 0;
            font-size: 13px;
            color: #64748b;
            line-height: 1.6;
        }

        .card-link {
            display: inline-block;
            margin-top: 18px;
            color: #1d4ed8;
            font-size: 13px;
            font-weight: bold;
        }

        /* FOOTER */
        .dashboard-footer {
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
            margin-top: 25px;
        }

        /* TABLET */
        @media (max-width: 900px) {
            .cards-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        /* MOBILE */
        @media (max-width: 600px) {
            .admin-header h1 {
                font-size: 21px;
            }

            .cards-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .welcome-card {
                padding: 20px;
            }

            .dashboard-container {
                margin-top: 18px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header class="admin-header">
        <h1>SCHOOL ADMIN DASHBOARD</h1>
        <p>Manage teachers, students and school marks</p>
    </header>

    <!-- LOGOUT -->
    <div class="top-actions">
        <button class="logout-btn" id="logoutBtn" type="button">
            Logout
        </button>
    </div>

    <!-- MAIN CONTENT -->
    <main class="dashboard-container">

        <section class="welcome-card">

            <h2 id="welcomeTitle">Welcome, School Administrator</h2>

            <p class="welcome-message">
                Manage your school's academic activities from this dashboard.
                Register teachers, manage student records and monitor
                examination marks.
            </p>

            <div class="cards-grid">

                <!-- ADD TEACHER -->
                <button
                    class="dashboard-card"
                    type="button"
                    onclick="window.location.href='add-teacher.html'">

                    <div class="card-icon">👨‍🏫</div>

                    <h3>Add Teacher</h3>

                    <p>
                        Create teacher accounts and assign teachers
                        to their respective classes and subjects.
                    </p>

                    <span class="card-link">Manage Teachers →</span>
                </button>

                <!-- ADD STUDENTS -->
                <button
                    class="dashboard-card"
                    type="button"
                    onclick="window.location.href='add-students.html'">

                    <div class="card-icon">🎓</div>

                    <h3>Manage Students</h3>

                    <p>
                        Register students and organize them according
                        to their respective classes.
                    </p>

                    <span class="card-link">Manage Students →</span>
                </button>

                <!-- VIEW MARKS -->
                <button
                    class="dashboard-card"
                    type="button"
                    onclick="window.location.href='view-school-marks.html'">

                    <div class="card-icon">📊</div>

                    <h3>View School Marks</h3>

                    <p>
                        Monitor examination marks entered by teachers
                        and review student academic performance.
                    </p>

                    <span class="card-link">View Marks →</span>
                </button>

            </div>

        </section>

        <div class="dashboard-footer">
            Sector Education Examination Platform
        </div>

    </main>

    <script>
        // ==========================================
        // SCHOOL ADMIN AUTHENTICATION
        // ==========================================

        (function () {

            let currentUser = null;

            try {
                currentUser = JSON.parse(
                    localStorage.getItem("currentUser") || "null"
                );
            } catch (error) {
                currentUser = null;
            }

            const storedRole = localStorage.getItem("role");

            if (
                !currentUser ||
                !currentUser.id ||
                storedRole !== "school_admin" ||
                currentUser.role !== "school_admin"
            ) {
                window.location.replace("../../index.html");
                return;
            }

            // Display administrator's name.
            const welcomeTitle = document.getElementById("welcomeTitle");

            if (currentUser.full_name) {
                welcomeTitle.textContent =
                    "Welcome, " + currentUser.full_name;
            }

        })();


        // ==========================================
        // LOGOUT
        // ==========================================

        document.getElementById("logoutBtn").addEventListener("click", logout);

        async function logout() {

            const logoutBtn = document.getElementById("logoutBtn");

            logoutBtn.disabled = true;
            logoutBtn.textContent = "Logging out...";

            try {
                await fetch("/api/logout", {
                    method: "POST",
                    credentials: "same-origin"
                });
            } catch (error) {
                console.error("Logout request failed:", error);
            } finally {

                localStorage.removeItem("currentUser");
                localStorage.removeItem("role");
                localStorage.removeItem("selectedTest");

                window.location.replace("../../index.html");
            }
        }
    </script>

</body>
</html>
