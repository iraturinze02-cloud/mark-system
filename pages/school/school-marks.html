
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Record and manage student marks for assigned classes and subjects in Fila Grades System.">

    <meta name="theme-color" content="#173f70">

    <link rel="icon" type="image/x-icon" href="../../images/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="512x512" href="../../images/favicon/favicon.png">


<title>School Marks | Results Dashboard</title>

<style>
*{box-sizing:border-box}

:root{
    --primary:#173f70;
    --primary2:#2563eb;
    --primary-light:#eff6ff;
    --background:#f1f5f9;
    --text:#172b4d;
    --muted:#64748b;
    --border:#e2e8f0;
    --white:#fff;
    --green:#15803d;
    --red:#dc2626;
    --amber:#b45309;
}

body{
    margin:0;
    font-family:"Segoe UI",Arial,sans-serif;
    background:var(--background);
    color:var(--text);
}

header{
    background:linear-gradient(120deg,#12345d,#1d4ed8);
    color:#fff;
    text-align:center;
    padding:28px 15px;
}

header h1{
    margin:0;
    font-size:27px;
    letter-spacing:.8px;
    font-weight:800;
}

header p{
    margin:7px 0 0;
    font-size:14px;
    opacity:.9;
}

.toolbar{
    width:95%;
    max-width:1500px;
    margin:18px auto;
    padding:15px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:13px;
    box-shadow:0 4px 15px rgba(15,23,42,.05);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:13px;
    flex-wrap:wrap;
}

button{
    border:0;
    border-radius:8px;
    padding:11px 16px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    filter:brightness(.95);
    transform:translateY(-1px);
}

.logout-btn{background:#dc2626;color:#fff}
.download-btn{background:var(--primary);color:#fff}

.academic-period-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    min-height:42px;
    padding:10px 16px;
    color:#fff;
    background:linear-gradient(135deg,#173f70,#2563eb);
    border:1px solid #1d4ed8;
    border-radius:9px;
    font-size:13px;
    font-weight:700;
    box-shadow:0 3px 8px rgba(29,78,216,.16);
}

.academic-period-btn svg{width:18px;height:18px}

.selectors{
    display:flex;
    align-items:end;
    gap:13px;
    flex:1;
    flex-wrap:wrap;
}

.selector-group{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.selector-group label{
    font-size:12px;
    color:#475569;
    font-weight:750;
}

.selector-group select{
    min-width:210px;
    max-width:100%;
    padding:11px 12px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    background:#fff;
    color:var(--text);
    font-size:13px;
    outline:none;
}

.selector-group select:focus{
    border-color:var(--primary2);
    box-shadow:0 0 0 3px rgba(37,99,235,.12);
}

.school-selector[hidden]{display:none}

.container{
    width:95%;
    max-width:1500px;
    margin:20px auto 45px;
}

.message{
    padding:35px 20px;
    text-align:center;
    background:#fff;
    border:1px solid var(--border);
    border-radius:12px;
    color:var(--muted);
    box-shadow:0 3px 12px rgba(15,23,42,.04);
}

.test-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:15px;
    padding:22px;
    box-shadow:0 5px 20px rgba(15,23,42,.045);
}

.test-heading{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
    padding-bottom:17px;
    margin-bottom:20px;
    border-bottom:1px solid var(--border);
}

.test-heading h2{
    margin:0 0 9px;
    color:var(--primary);
    font-size:22px;
    font-weight:800;
}

.status{
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
    background:#e0edff;
    color:#1e40af;
    font-size:10px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.5px;
}

.class-card{
    margin-top:22px;
    padding:19px;
    border:1px solid var(--border);
    border-radius:12px;
    background:#fff;
}

.class-heading{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.class-heading h3{
    margin:0 0 5px;
    color:#173f70;
    font-size:19px;
    font-weight:800;
}

.school-name{
    color:var(--muted);
    font-size:12px;
    font-weight:600;
}

.section-title{
    display:flex;
    align-items:center;
    gap:9px;
    margin:22px 0 12px;
    color:#173f70;
    font-size:15px;
    font-weight:800;
}

.section-title:before{
    content:"";
    width:4px;
    height:18px;
    border-radius:5px;
    background:#2563eb;
}

.metrics-grid{
    display:grid;
    grid-template-columns:repeat(5,minmax(0,1fr));
    gap:11px;
    margin:15px 0 20px;
}

.metric-card{
    min-width:0;
    padding:14px;
    background:#f8fafc;
    border:1px solid var(--border);
    border-radius:10px;
}

.metric-label{
    display:block;
    color:var(--muted);
    font-size:11px;
    font-weight:750;
    text-transform:uppercase;
    letter-spacing:.35px;
    margin-bottom:7px;
}

.metric-value{
    display:block;
    color:#173f70;
    font-size:23px;
    font-weight:850;
    line-height:1.1;
}

.metric-card.pass .metric-value{color:var(--green)}
.metric-card.fail .metric-value{color:var(--red)}
.metric-card.pending .metric-value{color:var(--amber)}

.analysis-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:15px;
    margin-top:12px;
}

.analysis-panel{
    min-width:0;
    padding:15px;
    border:1px solid var(--border);
    border-radius:11px;
    background:#fff;
}

.analysis-panel h4{
    margin:0 0 12px;
    color:#173f70;
    font-size:14px;
    font-weight:800;
}

.table-wrapper{
    width:100%;
    overflow-x:auto;
    margin-top:10px;
    border:1px solid var(--border);
    border-radius:8px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
    min-width:650px;
}

th,td{
    border-bottom:1px solid #e8edf4;
    padding:9px 10px;
    text-align:center;
    white-space:nowrap;
    font-size:12px;
}

thead{background:#173f70;color:#fff}

thead th{
    padding:10px 8px;
    font-weight:750;
    letter-spacing:.1px;
}

tbody tr:nth-child(even){background:#f8fafc}
tbody tr:hover{background:#eff6ff}
tbody tr:last-child td{border-bottom:0}

td.student-name{
    text-align:left;
    font-weight:650;
    color:#243b5a;
}

.category{
    display:inline-block;
    padding:4px 7px;
    border-radius:5px;
    font-size:10px;
    font-weight:800;
}

.category-a,.category-b{background:#dcfce7;color:#166534}
.category-c,.category-d{background:#dbeafe;color:#1e40af}
.category-e,.category-s{background:#fef3c7;color:#92400e}
.category-f{background:#fee2e2;color:#991b1b}
.category-pending{background:#f1f5f9;color:#64748b}

.gender-label{
    font-weight:800;
    color:#173f70;
}

.range-cell{
    font-weight:750;
    color:#334155;
}

.no-marks{
    padding:18px;
    text-align:center;
    background:#f8fafc;
    border-radius:8px;
    color:var(--muted);
    font-size:13px;
}

.download-note{
    margin:12px 0 0;
    color:var(--muted);
    font-size:11px;
}

@media(max-width:900px){
    .metrics-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}

@media(max-width:700px){
    header{padding:22px 12px}
    header h1{font-size:22px}
    .toolbar{align-items:stretch;padding:12px}
    .selectors{width:100%;flex-direction:column;align-items:stretch}
    .selector-group,.selector-group select{width:100%;min-width:0}
    .toolbar>button{width:100%}
    .container{width:96%}
    .test-card{padding:13px}
    .class-card{padding:12px}
    .test-heading h2{font-size:18px}
    .class-heading h3{font-size:17px}
    .metrics-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .analysis-grid{grid-template-columns:1fr}
}

/* COMPACT DOWNLOAD / PRINT */
@media print{
    @page{
        size:landscape;
        margin:7mm;
    }

    body{
        background:#fff!important;
        color:#111827;
        font-family:Arial,sans-serif;
    }

    header,.toolbar{display:none!important}

    .container{
        width:100%;
        max-width:none;
        margin:0;
    }

    .test-card{
        padding:0;
        border:0;
        border-radius:0;
        box-shadow:none;
    }

    .test-heading{
        padding:0 0 7px;
        margin:0 0 8px;
    }

    .test-heading h2{
        font-size:15px;
        margin:0 0 4px;
    }

    .status{
        font-size:8px;
        padding:3px 6px;
    }

    .class-card{
        margin:0 0 12px;
        padding:8px;
        border:1px solid #b8c4d3;
        border-radius:4px;
        break-inside:auto;
        page-break-inside:auto;
    }

    .class-heading{
        margin:0 0 6px;
    }

    .class-heading h3{
        font-size:12px;
        margin:0 0 2px;
    }

    .school-name{
        font-size:9px;
    }

    .section-title{
        font-size:10px;
        margin:9px 0 5px;
    }

    .section-title:before{
        height:11px;
        width:3px;
    }

    .metrics-grid{
        grid-template-columns:repeat(5,minmax(0,1fr));
        gap:5px;
        margin:6px 0 8px;
    }

    .metric-card{
        padding:6px;
        border-radius:3px;
    }

    .metric-label{
        font-size:7px;
        margin-bottom:3px;
    }

    .metric-value{
        font-size:13px;
    }

    .analysis-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:7px;
        margin-top:5px;
    }

    .analysis-panel{
        padding:6px;
        border-radius:3px;
    }

    .analysis-panel h4{
        font-size:9px;
        margin:0 0 4px;
    }

    .table-wrapper{
        overflow:visible;
        margin-top:5px;
        border-radius:0;
        border:0;
    }

    table{
        width:100%;
        min-width:0;
        table-layout:auto;
        border-collapse:collapse;
    }

    th,td{
        font-size:7px;
        padding:3px 4px;
        white-space:normal;
        border:1px solid #cbd5e1;
        color:#111827;
    }

    thead{
        display:table-header-group;
        background:#dbeafe!important;
        color:#173f70!important;
        print-color-adjust:exact;
        -webkit-print-color-adjust:exact;
    }

    thead th{
        font-size:7px;
        padding:4px 3px;
        color:#173f70!important;
    }

    tr{
        break-inside:avoid;
        page-break-inside:avoid;
    }

    tbody tr:nth-child(even){
        background:#f8fafc!important;
        print-color-adjust:exact;
        -webkit-print-color-adjust:exact;
    }

    .category{
        padding:2px 3px;
        font-size:6px;
        border:0;
    }

    .download-note{display:none}
    button{display:none!important}
}
</style>
</head>

<body>
<main class="school-main-content">

<header>
    <h1>VIEW SCHOOL MARKS</h1>
    <p>Tests Results Dashboard</p>
</header>

<!-- =====================================================
     TOOLBAR
===================================================== -->

<div class="toolbar">

    <button class="logout-btn" onclick="logout()">
        Logout
    </button>
<button
    type="button"
    id="academicPeriodBtn"
    class="academic-period-btn"
    onclick="openAcademicPeriodSelector()"
    title="Change the academic year and term"
>
    <svg viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round"
         aria-hidden="true">
        <rect x="3" y="5" width="18" height="16" rx="2"></rect>
        <path d="M16 3v4M8 3v4M3 10h18"></path>
        <path d="m9 16 2 2 4-4"></path>
    </svg>
    <span id="academicPeriodBtnText">Academic Year &amp; Term</span>
</button>
    <div class="selectors">

        <!-- TEST SELECTOR -->

        <div class="selector-group">

            <label for="testSelect">
                Select Test
            </label>

            <select id="testSelect" onchange="handleTestChange()">
                <option value="">Loading tests...</option>
            </select>

        </div>

        <!-- SCHOOL SELECTOR: SECTOR ADMIN ONLY -->

        <div class="selector-group school-selector"
             id="schoolSelector"
             hidden>

            <label for="schoolSelect">
                Select School
            </label>

            <select id="schoolSelect" onchange="displaySelectedTest()">
                <option value="all">All Schools</option>
            </select>

        </div>

    </div>

    <button class="download-btn" onclick="window.print()">
        Download / Print Results
    </button>

    <button
    id="generateReportCardsBtn"
    class="download-btn"
    onclick="openReportCards()"
    style="display: none;"
>
    GENERATE REPORT CARDS
</button>
<button
    id="viewSectorMarksBtn"
    class="download-btn"
    onclick="viewSectorMarks()"
    style="display: none;">
    View Marks Across All Sector Schools
</button>
</div>

<!-- =====================================================
     RESULTS
===================================================== -->

<div class="container" id="results">

    <div class="message">
        Loading school marks...
    </div>

</div>
    </main>

<script src="../js/academic-period.js"></script>

<script>
/* =====================================================
   HTML SECURITY
===================================================== */

function escapeHTML(value) {

    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    })[char]);

}

/* =====================================================
   CATEGORY
===================================================== */

function getCategory(percentage) {

    if (percentage >= 80) return "A (Excellent)";
    if (percentage >= 75) return "B (Very Good)";
    if (percentage >= 70) return "C (Good)";
    if (percentage >= 65) return "D (Satisfactory)";
    if (percentage >= 60) return "E (Adequate)";
    if (percentage >= 50) return "S (Pass)";

    return "F (Fail)";

}

/* =====================================================
   FORMAT NUMBER
===================================================== */

function formatNumber(value) {

    return Number(value).toFixed(2).replace(/\.00$/, "");

}

/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let allTests = [];

let selectedTestId = null;

let currentUserRole = null;

let selectedSchoolId = "all";
    /* =====================================================
   ACADEMIC YEAR AND TERM
===================================================== */

let currentAcademicPeriod = null;

function openAcademicPeriodSelector() {

    if (!window.FilaAcademicPeriod) {
        alert("Academic period selector is not available.");
        return;
    }

    window.FilaAcademicPeriod.open();
}

function updateAcademicPeriodButton(period) {

    const buttonText = document.getElementById(
        "academicPeriodBtnText"
    );

    if (!buttonText || !period) return;

    buttonText.textContent =
        `${period.academic_year} • ${period.term_name || period.term}`;
}

function waitForAcademicPeriod() {

    return new Promise((resolve, reject) => {

        if (window.FilaAcademicPeriod?.getSelection()) {

            currentAcademicPeriod =
                window.FilaAcademicPeriod.getSelection();

            updateAcademicPeriodButton(currentAcademicPeriod);

            resolve(currentAcademicPeriod);

            return;
        }

        window.addEventListener(
            "fila:academic-period-ready",
            function(event) {

                currentAcademicPeriod = event.detail;

                updateAcademicPeriodButton(currentAcademicPeriod);

                resolve(currentAcademicPeriod);

            },
            { once: true }
        );

        window.addEventListener(
            "fila:academic-period-error",
            function() {

                reject(
                    new Error("Unable to load the academic calendar.")
                );

            },
            { once: true }
        );

    });
}

/* Reload marks when the selected period changes */

window.addEventListener(
    "fila:academic-period-change",
    function(event) {

        currentAcademicPeriod = event.detail;

        updateAcademicPeriodButton(currentAcademicPeriod);

        selectedTestId = null;

        loadMarks();

    }
);


/* =====================================================
   LOAD SCHOOL MARKS
===================================================== */

async function loadMarks() {

    const container = document.getElementById("results");

    const testSelect = document.getElementById("testSelect");

    const schoolSelector = document.getElementById("schoolSelector");

    container.innerHTML = `
        <div class="message">
            Loading school marks...
        </div>
    `;

    try {

        if (!currentAcademicPeriod) {
    throw new Error("Please select an academic year and term.");
}

const params = new URLSearchParams({
    academic_year: currentAcademicPeriod.academic_year,
    term_number: String(currentAcademicPeriod.term_number)
});

const response = await fetch(
    `/api/school-marks?${params.toString()}`,
    {
        method: "GET",
        credentials: "same-origin",
        headers: {
            "Accept": "application/json"
        },
        cache: "no-store"
    }
);

        const data = await response.json();

        if (response.status === 401) {

            location.href = "../../index.html";

            return;

        }

        if (!response.ok || !data.success) {

            throw new Error(
                data.message || "Failed to load school marks."
            );

        }

        /* -------------------------------------
           GET AUTHENTICATED ROLE FROM SERVER
        ------------------------------------- */

        currentUserRole = data.role || data.user?.role || null;
        const reportCardsBtn = document.getElementById("generateReportCardsBtn");

reportCardsBtn.style.display =
    currentUserRole === "school_admin"
        ? "inline-block"
        : "none";

        if (
    !["sector_admin", "school_admin", "dos"].includes(currentUserRole)
) {
    throw new Error("You are not authorized to view school marks.");
}

        /* -------------------------------------
           SHOW SCHOOL SELECTOR ONLY FOR SECTOR
        ------------------------------------- */

        if (currentUserRole === "sector_admin") {

            schoolSelector.hidden = false;

        } else {

            schoolSelector.hidden = true;

        }

        allTests = Array.isArray(data.tests)
            ? data.tests
            : [];

        /* -------------------------------------
           NO TESTS
        ------------------------------------- */

        if (allTests.length === 0) {

            testSelect.innerHTML = `
                <option value="">No tests available</option>
            `;

            container.innerHTML = `
                <div class="message">
                    No tests are available.
                </div>
            `;

            return;

        }

        /* -------------------------------------
           SORT TESTS BY CREATION DATE
        ------------------------------------- */

        allTests.sort((a, b) => {

            return new Date(b.created_at || 0) -
                   new Date(a.created_at || 0);

        });

        /* -------------------------------------
           POPULATE TEST DROPDOWN
        ------------------------------------- */

        testSelect.innerHTML = `
            <option value="">Select a test</option>
        `;

        allTests.forEach(test => {

            const option = document.createElement("option");

            option.value = String(test.id);

            option.textContent =
                `${test.name} (${test.status})`;

            testSelect.appendChild(option);

        });

        /* -------------------------------------
           FIND LATEST OPEN OR CLOSED TEST
        ------------------------------------- */

        const preferredTest = allTests.find(test => {

            const status = String(test.status || "")
                .toLowerCase();

            return status === "open" || status === "closed";

        });

        const testToSelect = preferredTest || allTests[0];

        testSelect.value = String(testToSelect.id);

        selectedTestId = String(testToSelect.id);

        /* -------------------------------------
           POPULATE SCHOOL DROPDOWN
        ------------------------------------- */

        populateSchoolDropdown(testToSelect);

        /* -------------------------------------
           DISPLAY SELECTED TEST
        ------------------------------------- */

        displaySelectedTest();

    } catch (error) {

        console.error("School Marks error:", error);

        container.innerHTML = `
            <div class="message">
                ${escapeHTML(error.message)}
            </div>
        `;

    }

}
    function updateSectorMarksButton(test) {

    const button = document.getElementById("viewSectorMarksBtn");

    if (!button) return;

    const allowedRole = [
        "school_admin",
        "dos"
    ].includes(currentUserRole);

    const sectorCreated =
        test?.creator_role === "sector_admin";

    const testClosed =
        String(test?.status || "").toLowerCase() === "closed";

    button.style.display =
        allowedRole && sectorCreated && testClosed
            ? "inline-block"
            : "none";
}

function viewSectorMarks() {

    if (!selectedTestId) return;

    const test = allTests.find(
        item => String(item.id) === String(selectedTestId)
    );

    if (
        !test ||
        !["school_admin", "dos"].includes(currentUserRole) ||
        test.creator_role !== "sector_admin" ||
        String(test.status).toLowerCase() !== "closed"
    ) {
        return;
    }

    window.location.href =
        `../sector/view-all-students-marks.html?test_id=${encodeURIComponent(selectedTestId)}`;
}


/* =====================================================
   HANDLE TEST CHANGE
===================================================== */

function handleTestChange() {

    const testSelect = document.getElementById("testSelect");

    selectedTestId = String(testSelect.value);

    const test = allTests.find(item =>
        String(item.id) === selectedTestId
    );

    if (!test) {

        displaySelectedTest();

        return;

    }

    /* Reset school filter when changing test */

    populateSchoolDropdown(test);

displaySelectedTest();

}


/* =====================================================
   POPULATE SCHOOL DROPDOWN
===================================================== */

function populateSchoolDropdown(test) {

    const schoolSelect = document.getElementById("schoolSelect");

    if (!schoolSelect) return;

    schoolSelect.innerHTML = `
        <option value="all">All Schools</option>
    `;

    const schools = new Map();

    (test.classes || []).forEach(classItem => {

        if (
            classItem.school_id !== null &&
            classItem.school_id !== undefined &&
            classItem.school_name
        ) {

            schools.set(
                String(classItem.school_id),
                classItem.school_name
            );

        }

    });

    /* Sort school names alphabetically */

    const sortedSchools = [...schools.entries()]
        .sort((a, b) =>
            String(a[1]).localeCompare(String(b[1]))
        );

    sortedSchools.forEach(([schoolId, schoolName]) => {

        const option = document.createElement("option");

        option.value = schoolId;

        option.textContent = schoolName;

        schoolSelect.appendChild(option);

    });

   // Automatically select the first school
if (sortedSchools.length > 0) {

    schoolSelect.value = sortedSchools[0][0];

    selectedSchoolId = sortedSchools[0][0];

} else {

    schoolSelect.value = "all";

    selectedSchoolId = "all";

}
}

/* =====================================================
   DISPLAY SELECTED TEST - RESULTS AND ANALYSIS
===================================================== */

function displaySelectedTest() {

    const container = document.getElementById("results");
    const testSelect = document.getElementById("testSelect");
    const schoolSelect = document.getElementById("schoolSelect");

    if (!testSelect || !testSelect.value) {
        updateSectorMarksButton(null);

        container.innerHTML = `
            <div class="message">Please select a test.</div>
        `;
        return;
    }

    selectedTestId = String(testSelect.value);

    const test = allTests.find(item =>
        String(item.id) === selectedTestId
    );

    if (!test) {
        container.innerHTML = `
            <div class="message">Selected test could not be found.</div>
        `;
        updateSectorMarksButton(null);
        return;
    }

    updateSectorMarksButton(test);

    // Determine whether this test has been closed.
    const isClosed =
        String(test.status || "").trim().toLowerCase() === "closed";

    let classes = [...(test.classes || [])];

    if (currentUserRole === "sector_admin") {

        selectedSchoolId = schoolSelect
            ? schoolSelect.value
            : "all";

        if (selectedSchoolId !== "all") {
            classes = classes.filter(classItem =>
                String(classItem.school_id) === selectedSchoolId
            );
        }
    }

    const selectedSchoolName =
        currentUserRole === "sector_admin" &&
        schoolSelect &&
        schoolSelect.value !== "all"
            ? schoolSelect.options[schoolSelect.selectedIndex]?.text || ""
            : "";

    let html = `
        <section class="test-card">

            <div class="test-heading">
                <div>
                    <h2>${escapeHTML(test.name)}</h2>
                    <span class="status">${escapeHTML(test.status)}</span>

                    ${selectedSchoolName
                        ? `<div class="school-name">${escapeHTML(selectedSchoolName)}</div>`
                        : ""}
                </div>

                <button class="download-btn" onclick="downloadTest()">
                    Download Results
                </button>
            </div>
    `;

    if (classes.length === 0) {
        html += `
            <div class="message">
                No classes are available for this test and school selection.
            </div>
        </section>
        `;

        container.innerHTML = html;
        return;
    }

    classes.forEach((classItem, classIndex) => {

        const subjects = classItem.subjects || [];

        // A missing mark is different from a genuine recorded zero.
        // Empty strings are also treated as missing.
        const isRecordedMark = score => {

            if (score === null || score === undefined) {
                return false;
            }

            if (
                typeof score === "string" &&
                score.trim() === ""
            ) {
                return false;
            }

            return Number.isFinite(Number(score));
        };

        // The API also filters inactive students.
        // This is an additional defensive check when status is supplied.
        const students = [...(classItem.students || [])].filter(student => {

            if (student.status === undefined || student.status === null) {
                return true;
            }

            return String(student.status).trim().toLowerCase() === "active";
        });

        /* -------------------------------------
           CALCULATE EACH LEARNER'S RESULT
        ------------------------------------- */

        students.forEach(student => {

            let total = 0;
            let maximum = 0;
            let recorded = 0;
            let missing = 0;

            subjects.forEach(subject => {

                const score = student.marks
                    ? student.marks[subject.id]
                    : null;

                const subjectMaximum =
                    Number(subject.maximum_mark || 0);

                maximum += subjectMaximum;

                if (isRecordedMark(score)) {

                    total += Number(score);
                    recorded++;

                } else {

                    missing++;

                    // Missing marks count as zero only after closure.
                    // They are never saved as actual marks here.
                    if (isClosed) {
                        total += 0;
                    }
                }
            });

            student.total = total;
            student.maximum = maximum;
            student.recorded = recorded;
            student.missing = missing;

            // Open tests require every subject mark to be recorded.
            // Closed tests are finalized using zero for missing marks.
            student.complete =
                subjects.length > 0 &&
                maximum > 0 &&
                (
                    isClosed ||
                    recorded === subjects.length
                );

            student.percentage = student.complete
                ? (total / maximum) * 100
                : null;

            student.category = student.complete
                ? getCategory(student.percentage)
                : "Pending";
        });

        /* -------------------------------------
           SORT: COMPLETED RESULTS FIRST
        ------------------------------------- */

        students.sort((a, b) => {

            if (a.percentage === null) return 1;
            if (b.percentage === null) return -1;

            return b.percentage - a.percentage;
        });

        const completed = students.filter(
            student => student.complete
        );

        const pending = students.filter(
            student => !student.complete
        );

        const passed = completed.filter(
            student => student.percentage >= 50
        );

        const failed = completed.filter(
            student => student.percentage < 50
        );

        const average = completed.length
            ? completed.reduce(
                (sum, student) => sum + student.percentage, 0
            ) / completed.length
            : 0;

        const passRate = completed.length
            ? (passed.length / completed.length) * 100
            : 0;

        /* -------------------------------------
           GENDER ANALYSIS
        ------------------------------------- */

        const genderGroups = [
            { name: "Male", key: "male" },
            { name: "Female", key: "female" },
            { name: "Not recorded", key: "other" }
        ];

        const genderStats = genderGroups.map(group => {

            const groupStudents = students.filter(student => {

                const gender = String(student.gender || "")
                    .trim()
                    .toLowerCase();

                if (group.key === "male") return gender === "male";
                if (group.key === "female") return gender === "female";

                return gender !== "male" && gender !== "female";
            });

            const groupCompleted = groupStudents.filter(
                student => student.complete
            );

            const groupPassed = groupCompleted.filter(
                student => student.percentage >= 50
            );

            const groupFailed = groupCompleted.filter(
                student => student.percentage < 50
            );

            const groupAverage = groupCompleted.length
                ? groupCompleted.reduce(
                    (sum, student) => sum + student.percentage, 0
                ) / groupCompleted.length
                : 0;

            const groupPassRate = groupCompleted.length
                ? (groupPassed.length / groupCompleted.length) * 100
                : 0;

            return {
                name: group.name,
                total: groupStudents.length,
                completed: groupCompleted.length,
                pending: groupStudents.length - groupCompleted.length,
                passed: groupPassed.length,
                failed: groupFailed.length,
                average: groupAverage,
                passRate: groupPassRate
            };
        });

        /* -------------------------------------
           SCORE DISTRIBUTION: 10% RANGES
           Open-test pending learners are excluded.
           Closed-test missing marks count as zero.
        ------------------------------------- */

        const scoreRanges = [];

        for (let start = 0; start < 100; start += 10) {

            const end = start + 10;

            const count = completed.filter(student => {

                const percentage = student.percentage;

                if (start === 90) {
                    return percentage >= 90 && percentage <= 100;
                }

                return percentage >= start && percentage < end;

            }).length;

            scoreRanges.push({
                label: start === 90
                    ? "90–100%"
                    : `${start}–${end - 0.01}%`,
                count
            });
        }

        /* -------------------------------------
           CLASS HEADING AND SUMMARY
        ------------------------------------- */

        html += `
            <div class="class-card">

                <div class="class-heading">
                    <div>
                        <h3>${escapeHTML(classItem.class_name)}</h3>

                        <div class="school-name">
                            ${escapeHTML(classItem.school_name || "")}
                            &nbsp; | &nbsp;
                            ${students.length} learners
                        </div>
                    </div>
                </div>
        `;

        if (subjects.length === 0) {
            html += `
                <div class="no-marks">
                    No subjects configured for this test.
                </div>
            </div>
            `;
            return;
        }

        /* -------------------------------------
           OVERALL CLASS SUMMARY
        ------------------------------------- */

        html += `
            <div class="section-title">Class Performance Overview</div>

            <div class="metrics-grid">

                <div class="metric-card">
                    <span class="metric-label">Total Learners</span>
                    <span class="metric-value">${students.length}</span>
                </div>

                <div class="metric-card">
                    <span class="metric-label">Completed Results</span>
                    <span class="metric-value">${completed.length}</span>
                </div>

                <div class="metric-card pass">
                    <span class="metric-label">Passed</span>
                    <span class="metric-value">${passed.length}</span>
                </div>

                <div class="metric-card fail">
                    <span class="metric-label">Failed</span>
                    <span class="metric-value">${failed.length}</span>
                </div>

                <div class="metric-card pending">
                    <span class="metric-label">Pending</span>
                    <span class="metric-value">${pending.length}</span>
                </div>

                <div class="metric-card">
                    <span class="metric-label">Class Average</span>
                    <span class="metric-value">
                        ${completed.length ? average.toFixed(1) + "%" : "—"}
                    </span>
                </div>

                <div class="metric-card pass">
                    <span class="metric-label">Pass Rate</span>
                    <span class="metric-value">
                        ${completed.length ? passRate.toFixed(1) + "%" : "—"}
                    </span>
                </div>
            </div>
        `;

        /* -------------------------------------
           GENDER ANALYSIS
        ------------------------------------- */

        html += `
            <div class="section-title">Gender Performance Analysis</div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Gender</th>
                            <th>Total Learners</th>
                            <th>Completed</th>
                            <th>Pending</th>
                            <th>Passed</th>
                            <th>Failed</th>
                            <th>Average</th>
                            <th>Pass Rate</th>
                        </tr>
                    </thead>
                    <tbody>
        `;

        genderStats.forEach(group => {

            if (group.total === 0) return;

            html += `
                <tr>
                    <td class="gender-label">${escapeHTML(group.name)}</td>
                    <td>${group.total}</td>
                    <td>${group.completed}</td>
                    <td>${group.pending}</td>
                    <td>${group.passed}</td>
                    <td>${group.failed}</td>
                    <td>
                        ${group.completed
                            ? group.average.toFixed(2) + "%"
                            : "—"}
                    </td>
                    <td>
                        ${group.completed
                            ? group.passRate.toFixed(2) + "%"
                            : "—"}
                    </td>
                </tr>
            `;
        });

        html += `
                    </tbody>
                </table>
            </div>
        `;

        /* -------------------------------------
           SCORE DISTRIBUTION
        ------------------------------------- */

        html += `
            <div class="section-title">Learners by Score Range</div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Score Range</th>
                            <th>Number of Learners</th>
                            <th>Percentage of Completed Learners</th>
                        </tr>
                    </thead>
                    <tbody>
        `;

        scoreRanges.forEach(range => {

            const distributionRate = completed.length
                ? (range.count / completed.length) * 100
                : 0;

            html += `
                <tr>
                    <td class="range-cell">${range.label}</td>
                    <td><strong>${range.count}</strong></td>
                    <td>
                        ${completed.length
                            ? distributionRate.toFixed(1) + "%"
                            : "—"}
                    </td>
                </tr>
            `;
        });

        html += `
                    </tbody>
                </table>
            </div>
        `;

        /* -------------------------------------
           LEARNER RESULTS TABLE
        ------------------------------------- */

        html += `
            <div class="section-title">Detailed Learner Results</div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Position</th>
                            <th>Student Name</th>
                            <th>Gender</th>

                            ${subjects.map(subject => `
                                <th>${escapeHTML(subject.name)}</th>
                            `).join("")}

                            <th>Total</th>
                            <th>Percentage</th>
                            <th>Category</th>
                        </tr>
                    </thead>
                    <tbody>
        `;

        students.forEach((student, index) => {

            const categoryClass = student.percentage === null
                ? "category-pending"
                : student.percentage >= 80
                    ? "category-a"
                    : student.percentage >= 70
                        ? "category-c"
                        : student.percentage >= 60
                            ? "category-e"
                            : student.percentage >= 50
                                ? "category-s"
                                : "category-f";

            html += `
                <tr>
                    <td>${student.complete ? index + 1 : "—"}</td>

                    <td class="student-name">
                        ${escapeHTML(student.name)}
                    </td>

                    <td>
                        ${escapeHTML(student.gender || "Not recorded")}
                    </td>

                    ${subjects.map(subject => {

                        const score = student.marks
                            ? student.marks[subject.id]
                            : null;

                        return `
                            <td>
                                ${isRecordedMark(score)
                                    ? formatNumber(score)
                                    : "—"}
                            </td>
                        `;
                    }).join("")}

                    <td>
                        ${student.complete
                            ? formatNumber(student.total) + " / " +
                              formatNumber(student.maximum)
                            : "—"}
                    </td>

                    <td>
                        ${student.complete
                            ? student.percentage.toFixed(2) + "%"
                            : "—"}
                    </td>

                    <td>
                        <span class="category ${categoryClass}">
                            ${escapeHTML(student.category)}
                        </span>
                    </td>
                </tr>
            `;
        });

        if (students.length === 0) {
            html += `
                <tr>
                    <td colspan="${subjects.length + 6}">
                        No active learners registered in this class.
                    </td>
                </tr>
            `;
        }

        html += `
                    </tbody>
                </table>
            </div>
        `;

        /* -------------------------------------
           SUBJECT ANALYSIS
        ------------------------------------- */

        html += `
            <div class="section-title">Subject Performance Analysis</div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Subject</th>
                            <th>Average (%)</th>
                            <th>Passed</th>
                            <th>Failed</th>
                            <th>Pass Rate</th>
                            <th>Recorded Marks</th>
                        </tr>
                    </thead>
                    <tbody>
        `;

        subjects.forEach(subject => {

            const actualRecordedMarks = students
                .map(student =>
                    student.marks
                        ? student.marks[subject.id]
                        : null
                )
                .filter(isRecordedMark)
                .map(Number);

            // For a closed test, missing marks are included as zero
            // in the subject performance calculation.
            const marksForAnalysis = students
                .map(student => {

                    const score = student.marks
                        ? student.marks[subject.id]
                        : null;

                    if (isRecordedMark(score)) {
                        return Number(score);
                    }

                    return isClosed ? 0 : null;

                })
                .filter(score => score !== null);

            if (marksForAnalysis.length === 0) return;

            const subjectMaximum =
                Number(subject.maximum_mark || 0);

            const percentages = marksForAnalysis.map(score => {

                return subjectMaximum > 0
                    ? (score / subjectMaximum) * 100
                    : 0;
            });

            const subjectAverage = percentages.reduce(
                (a, b) => a + b, 0
            ) / percentages.length;

            const subjectPassed = percentages.filter(
                percentage => percentage >= 50
            ).length;

            const subjectFailed =
                percentages.length - subjectPassed;

            const subjectPassRate =
                (subjectPassed / percentages.length) * 100;

            html += `
                <tr>
                    <td>${escapeHTML(subject.name)}</td>
                    <td>${subjectAverage.toFixed(2)}%</td>
                    <td>${subjectPassed}</td>
                    <td>${subjectFailed}</td>
                    <td>${subjectPassRate.toFixed(2)}%</td>
                    <td>${actualRecordedMarks.length}</td>
                </tr>
            `;
        });

        html += `
                    </tbody>
                </table>
            </div>

            <p class="download-note">
                ${isClosed
                    ? "This test is closed. Missing marks are counted as zero for result calculations but remain displayed as — to distinguish them from genuine recorded zeros."
                    : "This test is open. Learners with missing subject marks remain Pending and are excluded from overall pass/fail rates, class averages and score distribution."}
            </p>

            </div>
        `;
    });

    html += `</section>`;

    container.innerHTML = html;
}
