
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>School Marks | Results Dashboard</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --primary: #1d4ed8;
    --primary-dark: #1e40af;
    --background: #f3f6fb;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
    --white: #ffffff;
}

body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--background);
    color: var(--text);
}

/* HEADER */

header {
    background: linear-gradient(135deg, #1d4ed8, #2563eb);
    color: white;
    text-align: center;
    padding: 30px 15px;
}

header h1 {
    margin: 0;
    font-size: 27px;
    letter-spacing: .5px;
}

header p {
    margin: 8px 0 0;
    opacity: .9;
}

/* TOOLBAR */

.toolbar {
    width: 95%;
    max-width: 1400px;
    margin: 20px auto;
    padding: 16px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.05);

    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
}

button {
    padding: 11px 17px;
    border: none;
    cursor: pointer;
    border-radius: 7px;
    font-weight: 600;
    font-size: 14px;
    transition: .2s;
}

button:hover {
    opacity: .9;
    transform: translateY(-1px);
}

.logout-btn {
    background: #ef4444;
    color: white;
}

.download-btn {
    background: var(--primary);
    color: white;
}

/* SELECTORS */

.selectors {
    display: flex;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
    flex: 1;
}

.selector-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.selector-group label {
    font-size: 13px;
    font-weight: 700;
    color: #475569;
}

.selector-group select {
    min-width: 220px;
    max-width: 100%;
    padding: 11px 13px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    background: white;
    color: var(--text);
    font-size: 14px;
    outline: none;
}

.selector-group select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37,99,235,.12);
}

.school-selector[hidden] {
    display: none;
}

/* MAIN CONTAINER */

.container {
    width: 95%;
    max-width: 1400px;
    margin: 20px auto 40px;
}

/* TEST CARD */

.test-card {
    background: white;
    padding: 22px;
    margin-bottom: 25px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.05);
}

.test-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    padding-bottom: 16px;
    margin-bottom: 20px;
}

.test-heading h2 {
    margin: 0 0 10px;
    color: var(--primary-dark);
    font-size: 22px;
}

.status {
    display: inline-block;
    padding: 5px 11px;
    border-radius: 20px;
    background: #e2e8f0;
    color: #334155;
    font-size: 11px;
    text-transform: uppercase;
    font-weight: bold;
}

/* CLASS CARD */

.class-card {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 17px;
    margin-top: 20px;
    background: #fff;
}

.class-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
}

.class-heading h3 {
    margin: 5px 0 8px;
    color: #1e293b;
    font-size: 19px;
}

.school-name {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 10px;
}

/* TABLES */

.table-wrapper {
    overflow-x: auto;
    margin-top: 12px;
    border-radius: 7px;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
    background: white;
}

th, td {
    border: 1px solid #e2e8f0;
    padding: 10px;
    text-align: center;
    white-space: nowrap;
    font-size: 13px;
}

thead {
    background: var(--primary);
    color: white;
}

thead th {
    font-weight: 600;
}

tbody tr:nth-child(even) {
    background: #f8fafc;
}

tbody tr:hover {
    background: #eff6ff;
}

/* ANALYSIS */

.analysis-box {
    margin-top: 25px;
}

.analysis-box h4 {
    margin: 0 0 10px;
    color: var(--primary-dark);
    font-size: 16px;
}

/* MESSAGES */

.message {
    text-align: center;
    background: white;
    padding: 35px 20px;
    border-radius: 10px;
    margin: 25px auto;
    color: var(--muted);
    box-shadow: 0 2px 8px rgba(0,0,0,.04);
}

.no-marks {
    color: var(--muted);
    text-align: center;
    padding: 25px;
    background: #f8fafc;
    border-radius: 7px;
}

/* RESPONSIVE */

@media(max-width: 700px) {

    header {
        padding: 23px 12px;
    }

    header h1 {
        font-size: 22px;
    }

    .toolbar {
        padding: 13px;
        align-items: stretch;
    }

    .selectors {
        width: 100%;
        flex-direction: column;
        align-items: stretch;
    }

    .selector-group {
        width: 100%;
    }

    .selector-group select {
        width: 100%;
        min-width: 0;
    }

    .toolbar > button {
        width: 100%;
    }

    .test-card {
        padding: 13px;
    }

    .class-card {
        padding: 10px;
    }

    .test-heading h2 {
        font-size: 19px;
    }

    .class-heading h3 {
        font-size: 17px;
    }
}

/* PRINT */

@media print {

    body {
        background: white;
        color: black;
    }

    header {
        background: white !important;
        color: black !important;
        border-bottom: 2px solid black;
    }

    .toolbar,
    .download-btn,
    .logout-btn {
        display: none !important;
    }

    .container {
        width: 100%;
        max-width: none;
        margin: 0;
    }

    .test-card,
    .class-card {
        box-shadow: none;
        border: 1px solid #aaa;
    }

    .class-card {
        break-inside: avoid;
    }

    table {
        min-width: 0;
    }

    th, td {
        font-size: 10px;
        padding: 5px;
    }

    thead {
        background: #ddd !important;
        color: black !important;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
    }
}
</style>
</head>

<body>

<header>
    <h1>VIEW SCHOOL MARKS</h1>
    <p>Tests Results Dashboard</p>
</header>

<!-- =====================================================
     TOOLBAR
===================================================== -->

<div class="toolbar">

    <button class="logout-btn" onclick="logout()">
        Logout
    </button>

    <div class="selectors">

        <!-- TEST SELECTOR -->

        <div class="selector-group">

            <label for="testSelect">
                Select Test
            </label>

            <select id="testSelect" onchange="handleTestChange()">
                <option value="">Loading tests...</option>
            </select>

        </div>

        <!-- SCHOOL SELECTOR: SECTOR ADMIN ONLY -->

        <div class="selector-group school-selector"
             id="schoolSelector"
             hidden>

            <label for="schoolSelect">
                Select School
            </label>

            <select id="schoolSelect" onchange="displaySelectedTest()">
                <option value="all">All Schools</option>
            </select>

        </div>

    </div>

    <button class="download-btn" onclick="window.print()">
        Download / Print Results
    </button>

</div>

<!-- =====================================================
     RESULTS
===================================================== -->

<div class="container" id="results">

    <div class="message">
        Loading school marks...
    </div>

</div>

<script>

/* =====================================================
   HTML SECURITY
===================================================== */

function escapeHTML(value) {

    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    })[char]);

}

/* =====================================================
   CATEGORY
===================================================== */

function getCategory(percentage) {

    if (percentage >= 80) return "A (Excellent)";
    if (percentage >= 75) return "B (Very Good)";
    if (percentage >= 70) return "C (Good)";
    if (percentage >= 65) return "D (Satisfactory)";
    if (percentage >= 60) return "E (Adequate)";
    if (percentage >= 50) return "S (Pass)";

    return "F (Fail)";

}

/* =====================================================
   FORMAT NUMBER
===================================================== */

function formatNumber(value) {

    return Number(value).toFixed(2).replace(/\.00$/, "");

}

/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let allTests = [];

let selectedTestId = null;

let currentUserRole = null;

let selectedSchoolId = "all";


/* =====================================================
   LOAD SCHOOL MARKS
===================================================== */

async function loadMarks() {

    const container = document.getElementById("results");

    const testSelect = document.getElementById("testSelect");

    const schoolSelector = document.getElementById("schoolSelector");

    container.innerHTML = `
        <div class="message">
            Loading school marks...
        </div>
    `;

    try {

        const response = await fetch("/api/school-marks", {

            method: "GET",

            credentials: "same-origin",

            headers: {
                "Accept": "application/json"
            },

            cache: "no-store"

        });

        const data = await response.json();

        if (response.status === 401) {

            location.href = "../../index.html";

            return;

        }

        if (!response.ok || !data.success) {

            throw new Error(
                data.message || "Failed to load school marks."
            );

        }

        /* -------------------------------------
           GET AUTHENTICATED ROLE FROM SERVER
        ------------------------------------- */

        currentUserRole = data.role || data.user?.role || null;

        if (
            currentUserRole !== "sector_admin" &&
            currentUserRole !== "school_admin"
        ) {

            throw new Error(
                "You are not authorized to view school marks."
            );

        }

        /* -------------------------------------
           SHOW SCHOOL SELECTOR ONLY FOR SECTOR
        ------------------------------------- */

        if (currentUserRole === "sector_admin") {

            schoolSelector.hidden = false;

        } else {

            schoolSelector.hidden = true;

        }

        allTests = Array.isArray(data.tests)
            ? data.tests
            : [];

        /* -------------------------------------
           NO TESTS
        ------------------------------------- */

        if (allTests.length === 0) {

            testSelect.innerHTML = `
                <option value="">No tests available</option>
            `;

            container.innerHTML = `
                <div class="message">
                    No tests are available.
                </div>
            `;

            return;

        }

        /* -------------------------------------
           SORT TESTS BY CREATION DATE
        ------------------------------------- */

        allTests.sort((a, b) => {

            return new Date(b.created_at || 0) -
                   new Date(a.created_at || 0);

        });

        /* -------------------------------------
           POPULATE TEST DROPDOWN
        ------------------------------------- */

        testSelect.innerHTML = `
            <option value="">Select a test</option>
        `;

        allTests.forEach(test => {

            const option = document.createElement("option");

            option.value = String(test.id);

            option.textContent =
                `${test.name} (${test.status})`;

            testSelect.appendChild(option);

        });

        /* -------------------------------------
           FIND LATEST OPEN OR CLOSED TEST
        ------------------------------------- */

        const preferredTest = allTests.find(test => {

            const status = String(test.status || "")
                .toLowerCase();

            return status === "open" || status === "closed";

        });

        const testToSelect = preferredTest || allTests[0];

        testSelect.value = String(testToSelect.id);

        selectedTestId = String(testToSelect.id);

        /* -------------------------------------
           POPULATE SCHOOL DROPDOWN
        ------------------------------------- */

        populateSchoolDropdown(testToSelect);

        /* -------------------------------------
           DISPLAY SELECTED TEST
        ------------------------------------- */

        displaySelectedTest();

    } catch (error) {

        console.error("School Marks error:", error);

        container.innerHTML = `
            <div class="message">
                ${escapeHTML(error.message)}
            </div>
        `;

    }

}


/* =====================================================
   HANDLE TEST CHANGE
===================================================== */

function handleTestChange() {

    const testSelect = document.getElementById("testSelect");

    selectedTestId = String(testSelect.value);

    const test = allTests.find(item =>
        String(item.id) === selectedTestId
    );

    if (!test) {

        displaySelectedTest();

        return;

    }

    /* Reset school filter when changing test */

    populateSchoolDropdown(test);

displaySelectedTest();

}


/* =====================================================
   POPULATE SCHOOL DROPDOWN
===================================================== */

function populateSchoolDropdown(test) {

    const schoolSelect = document.getElementById("schoolSelect");

    if (!schoolSelect) return;

    schoolSelect.innerHTML = `
        <option value="all">All Schools</option>
    `;

    const schools = new Map();

    (test.classes || []).forEach(classItem => {

        if (
            classItem.school_id !== null &&
            classItem.school_id !== undefined &&
            classItem.school_name
        ) {

            schools.set(
                String(classItem.school_id),
                classItem.school_name
            );

        }

    });

    /* Sort school names alphabetically */

    const sortedSchools = [...schools.entries()]
        .sort((a, b) =>
            String(a[1]).localeCompare(String(b[1]))
        );

    sortedSchools.forEach(([schoolId, schoolName]) => {

        const option = document.createElement("option");

        option.value = schoolId;

        option.textContent = schoolName;

        schoolSelect.appendChild(option);

    });

   // Automatically select the first school
if (sortedSchools.length > 0) {

    schoolSelect.value = sortedSchools[0][0];

    selectedSchoolId = sortedSchools[0][0];

} else {

    schoolSelect.value = "all";

    selectedSchoolId = "all";

}
}


/* =====================================================
   DISPLAY SELECTED TEST
===================================================== */

function displaySelectedTest() {

    const container = document.getElementById("results");

    const testSelect = document.getElementById("testSelect");

    const schoolSelect = document.getElementById("schoolSelect");

    if (!testSelect || !testSelect.value) {

        container.innerHTML = `
            <div class="message">
                Please select a test.
            </div>
        `;

        return;

    }

    selectedTestId = String(testSelect.value);

    const test = allTests.find(item =>
        String(item.id) === selectedTestId
    );

    if (!test) {

        container.innerHTML = `
            <div class="message">
                Selected test could not be found.
            </div>
        `;

        return;

    }

    /* -------------------------------------
       FILTER CLASSES BY SCHOOL
    ------------------------------------- */

    let classes = test.classes || [];

    if (currentUserRole === "sector_admin") {

        selectedSchoolId = schoolSelect
            ? schoolSelect.value
            : "all";

        if (selectedSchoolId !== "all") {

            classes = classes.filter(classItem =>
                String(classItem.school_id) === selectedSchoolId
            );

        }

    }

    /* -------------------------------------
       TEST HEADING
    ------------------------------------- */

    let html = `
        <section class="test-card">

            <div class="test-heading">

                <div>

                    <h2>${escapeHTML(test.name)}</h2>

                    <span class="status">
                        ${escapeHTML(test.status)}
                    </span>

                </div>

                <button class="download-btn"
                    onclick="downloadTest()">
                    Download
                </button>

            </div>
    `;

    /* -------------------------------------
       NO CLASSES
    ------------------------------------- */

    if (classes.length === 0) {

        html += `
            <div class="message">
                No classes are available for this test and school selection.
            </div>
        `;

        html += `</section>`;

        container.innerHTML = html;

        return;

    }

    /* =================================================
       DISPLAY EACH CLASS
    ================================================= */

    classes.forEach((classItem, classIndex) => {

        const subjects = classItem.subjects || [];

        const students = [...(classItem.students || [])];

        /* -------------------------------------
           CALCULATE TOTALS AND PERCENTAGES
        ------------------------------------- */

        students.forEach(student => {

            let total = 0;

            let maximum = 0;

            let recorded = 0;

            subjects.forEach(subject => {

                const score = student.marks
                    ? student.marks[subject.id]
                    : null;

                maximum += Number(subject.maximum_mark || 0);

                if (score !== null && score !== undefined) {

                    total += Number(score);

                    recorded++;

                }

            });

            student.total = total;

            student.maximum = maximum;

            student.recorded = recorded;

            student.percentage =
                recorded > 0 && maximum > 0
                    ? (total / maximum) * 100
                    : null;

        });

        /* -------------------------------------
           SORT STUDENTS BY PERCENTAGE
        ------------------------------------- */

        students.sort((a, b) => {

            if (a.percentage === null) return 1;

            if (b.percentage === null) return -1;

            return b.percentage - a.percentage;

        });

        /* -------------------------------------
           CLASS HEADING
        ------------------------------------- */

        html += `
            <div class="class-card">

                <div class="class-heading">

                    <div>

                        <h3>
                            ${escapeHTML(classItem.class_name)}
                        </h3>

                        <div class="school-name">
                            ${escapeHTML(classItem.school_name || "")}
                        </div>

                    </div>

                </div>
        `;

        /* -------------------------------------
           NO SUBJECTS
        ------------------------------------- */

        if (subjects.length === 0) {

            html += `
                <p class="no-marks">
                    No subjects configured for this test.
                </p>
            `;

            html += `</div>`;

            return;

        }

        /* =================================================
           RESULTS TABLE
        ================================================= */

        html += `
            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>Position</th>

                            <th>Student</th>

                            ${subjects.map(subject => `
                                <th>${escapeHTML(subject.name)}</th>
                            `).join("")}

                            <th>Total</th>

                            <th>%</th>

                            <th>Category</th>

                        </tr>

                    </thead>

                    <tbody>
        `;

        students.forEach((student, index) => {

            html += `
                <tr>

                    <td>
                        ${student.percentage === null
                            ? "—"
                            : index + 1}
                    </td>

                    <td>
                        ${escapeHTML(student.name)}
                    </td>

                    ${subjects.map(subject => {

                        const score = student.marks
                            ? student.marks[subject.id]
                            : null;

                        return `
                            <td>
                                ${score === null || score === undefined
                                    ? "—"
                                    : formatNumber(score)}
                            </td>
                        `;

                    }).join("")}

                    <td>
                        ${student.recorded
                            ? formatNumber(student.total) + " / " +
                              formatNumber(student.maximum)
                            : "—"}
                    </td>

                    <td>
                        ${student.percentage === null
                            ? "—"
                            : student.percentage.toFixed(2) + "%"}
                    </td>

                    <td>
                        ${student.percentage === null
                            ? "No marks"
                            : getCategory(student.percentage)}
                    </td>

                </tr>
            `;

        });

        if (students.length === 0) {

            html += `
                <tr>

                    <td colspan="${subjects.length + 5}">
                        No students registered in this class.
                    </td>

                </tr>
            `;

        }

        html += `
                    </tbody>

                </table>

            </div>
        `;

        /* =================================================
           SUBJECT ANALYSIS
        ================================================= */

        html += `
            <div class="analysis-box">

                <h4>Subject Analysis</h4>

                <div class="table-wrapper">

                    <table>

                        <thead>

                            <tr>
                                <th>Subject</th>
                                <th>Average (%)</th>
                                <th>Passed</th>
                                <th>Failed</th>
                                <th>Pass Rate</th>
                            </tr>

                        </thead>

                        <tbody>
        `;

        subjects.forEach(subject => {

            const recordedMarks = students

                .map(student =>
                    student.marks
                        ? student.marks[subject.id]
                        : null
                )

                .filter(score =>
                    score !== null && score !== undefined
                )

                .map(Number);

            if (recordedMarks.length === 0) return;

            const percentages = recordedMarks.map(score => {

                return Number(subject.maximum_mark) > 0
                    ? (score / Number(subject.maximum_mark)) * 100
                    : 0;

            });

            const average = percentages.reduce(
                (a, b) => a + b, 0
            ) / percentages.length;

            const passed = percentages.filter(
                percentage => percentage >= 50
            ).length;

            const failed = percentages.length - passed;

            const passRate =
                (passed / percentages.length) * 100;

            html += `
                <tr>

                    <td>
                        ${escapeHTML(subject.name)}
                    </td>

                    <td>
                        ${average.toFixed(2)}%
                    </td>

                    <td>
                        ${passed}
                    </td>

                    <td>
                        ${failed}
                    </td>

                    <td>
                        ${passRate.toFixed(2)}%
                    </td>

                </tr>
            `;

        });

        html += `
                        </tbody>

                    </table>

                </div>

            </div>

            </div>
        `;

    });

    html += `
        </section>
    `;

    container.innerHTML = html;

}


/* =====================================================
   DOWNLOAD CURRENTLY DISPLAYED RESULTS
===================================================== */

function downloadTest() {

    const container = document.getElementById("results");

    const testCard = container.querySelector(".test-card");

    if (!testCard) return;

    const test = allTests.find(item =>
        String(item.id) === String(selectedTestId)
    );

    if (!test) return;

    const content = testCard.cloneNode(true);

    /* Remove buttons from printed document */

    content.querySelectorAll("button").forEach(button => {
        button.remove();
    });

    const printWindow = window.open("", "_blank");

    if (!printWindow) {

        alert("Please allow pop-ups to download results.");

        return;

    }

    const schoolSelect = document.getElementById("schoolSelect");

    const selectedSchoolName =
        currentUserRole === "sector_admin" &&
        schoolSelect &&
        schoolSelect.value !== "all"
            ? schoolSelect.options[schoolSelect.selectedIndex].text
            : "All Schools";

    const printTitle =
        currentUserRole === "sector_admin"
            ? `${test.name} - ${selectedSchoolName}`
            : test.name;

    printWindow.document.write(`
        <!DOCTYPE html>
        <html>
        <head>

            <title>${escapeHTML(printTitle)} - School Marks</title>

            <style>

                body {
                    font-family: Arial, sans-serif;
                    padding: 20px;
                    color: #000;
                }

                h2, h3, h4 {
                    margin-top: 15px;
                }

                .status {
                    display: inline-block;
                    margin: 10px 0;
                }

                .school-name {
                    margin: 5px 0 15px;
                }

                .class-card {
                    margin-bottom: 30px;
                    page-break-inside: avoid;
                    break-inside: avoid;
                }

                table {
                    width: 100%;
                    border-collapse: collapse;
                    margin-bottom: 20px;
                }

                th, td {
                    border: 1px solid #000;
                    padding: 6px;
                    text-align: center;
                }

                th {
                    background: #eee;
                }

                @media print {

                    body {
                        padding: 0;
                    }

                    .class-card {
                        page-break-inside: avoid;
                    }

                }

            </style>

        </head>

        <body>

            ${content.innerHTML}

        </body>

        </html>
    `);

    printWindow.document.close();

    printWindow.focus();

    printWindow.onload = () => {
        printWindow.print();
    };

}


/* =====================================================
   LOGOUT
===================================================== */

function logout() {

    localStorage.clear();

    location.href = "index.html";

}


/* =====================================================
   START
===================================================== */

loadMarks();

</script>

</body>
</html>
