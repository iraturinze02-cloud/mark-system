<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="View and analyze student results across schools in Fila Grades System.">
<meta name="theme-color" content="#173f70">

<link rel="icon" type="image/x-icon" href="../../images/favicon/favicon.ico">
<link rel="icon" type="image/png" sizes="512x512" href="../../images/favicon/favicon.png">

<title>Fila Grades - All Schools Results</title>

<style>
:root {
    --primary: #1d4ed8;
    --primary-dark: #173f70;
    --blue-light: #eff6ff;
    --border: #e2e8f0;
    --text: #1e293b;
    --muted: #64748b;
    --green: #15803d;
    --red: #dc2626;
    --orange: #c2410c;
    --surface: #ffffff;
    --background: #f3f6fb;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--background);
    color: var(--text);
}

header {
    background: linear-gradient(135deg, #173f70, #2563eb);
    color: white;
    padding: 28px 16px;
    text-align: center;
}

header h1 {
    margin: 0 0 7px;
    font-size: clamp(22px, 4vw, 30px);
}

header p {
    margin: 0;
    opacity: .9;
}

.toolbar {
    width: 95%;
    max-width: 1500px;
    margin: 20px auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
}

.selector-box {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}

select,
input {
    min-height: 42px;
    padding: 10px 12px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    background: white;
    color: var(--text);
    font-size: 14px;
}

select {
    min-width: 230px;
}

input {
    min-width: 180px;
}

button {
    border: 0;
    border-radius: 8px;
    padding: 10px 15px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: .2s ease;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

button:hover:not(:disabled) {
    filter: brightness(.95);
}

.academic-period-btn {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    min-height: 42px;
    padding: 10px 15px;
    border: 1px solid #bfdbfe;
    background: #eff6ff;
    color: #1e40af;
}

.academic-period-btn svg {
    width: 19px;
    height: 19px;
}

.primary-btn,
.download-btn {
    background: var(--primary);
    color: white;
}

.logout-btn {
    background: #dc2626;
    color: white;
}

.table-container,
.panel {
    width: 95%;
    max-width: 1500px;
    margin: 18px auto;
    padding: 20px;
    border-radius: 13px;
    background: var(--surface);
    box-shadow: 0 3px 12px rgba(15, 23, 42, .045);
}

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 16px;
}

.section-header h2 {
    margin: 0;
    color: var(--primary-dark);
    font-size: 19px;
}

.section-description {
    color: var(--muted);
    font-size: 13px;
    margin: 5px 0 0;
}

.message {
    display: none;
    width: 95%;
    max-width: 1500px;
    margin: 14px auto;
    padding: 13px 15px;
    border-radius: 8px;
}

.message.error {
    display: block;
    background: #fee2e2;
    color: #991b1b;
}

.message.info {
    display: block;
    background: #dbeafe;
    color: #1e40af;
}

.empty {
    padding: 35px 15px;
    text-align: center;
    color: var(--muted);
}

.dashboard-grid {
    width: 95%;
    max-width: 1500px;
    margin: 18px auto;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
}

.stat-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 17px;
    box-shadow: 0 2px 8px rgba(15, 23, 42, .035);
}

.stat-label {
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .35px;
}

.stat-value {
    font-size: 27px;
    font-weight: 750;
    margin-top: 8px;
    color: var(--primary-dark);
}

.stat-note {
    color: var(--muted);
    font-size: 12px;
    margin-top: 5px;
}

.stat-card.green .stat-value {
    color: var(--green);
}

.stat-card.red .stat-value {
    color: var(--red);
}

.stat-card.orange .stat-value {
    color: var(--orange);
}

.two-column {
    width: 95%;
    max-width: 1500px;
    margin: 18px auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    align-items: start;
}

.two-column .panel {
    width: 100%;
    margin: 0;
    min-width: 0;
}

.table-scroll {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
}

th, td {
    border: 1px solid var(--border);
    padding: 10px 9px;
    text-align: center;
    font-size: 13px;
    white-space: nowrap;
}

thead {
    background: #1e40af;
    color: white;
}

tbody tr:nth-child(even) {
    background: #f8fafc;
}

tbody tr:hover {
    background: #eff6ff;
}

.school-name {
    font-weight: 700;
    color: var(--primary);
}

.class-heading {
    color: var(--primary-dark);
    margin: 0;
}

.analysis-school {
    background: #dbeafe !important;
    font-weight: 700;
}

.analysis-subject td:nth-child(2) {
    text-align: left;
    padding-left: 25px;
}

.gender-table th:first-child,
.gender-table td:first-child {
    text-align: left;
}

.rate {
    font-weight: 700;
}

.rate.good {
    color: var(--green);
}

.rate.bad {
    color: var(--red);
}

.band-list {
    display: grid;
    gap: 12px;
}

.band-row {
    display: grid;
    grid-template-columns: 65px 1fr 48px;
    align-items: center;
    gap: 10px;
    font-size: 13px;
}

.band-track {
    height: 12px;
    border-radius: 20px;
    background: #e2e8f0;
    overflow: hidden;
}

.band-fill {
    height: 100%;
    background: linear-gradient(90deg, #2563eb, #60a5fa);
    border-radius: 20px;
    min-width: 0;
}

.band-count {
    text-align: right;
    font-weight: 700;
}

.category-guide {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 14px;
}

.category-chip {
    background: #eff6ff;
    color: #1e40af;
    border: 1px solid #dbeafe;
    border-radius: 20px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 700;
}

.class-section {
    width: 95%;
    max-width: 1500px;
    margin: 18px auto;
    padding: 20px;
    background: white;
    border-radius: 13px;
    box-shadow: 0 3px 12px rgba(15, 23, 42, .045);
}

.class-tools {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin: 14px 0;
}

.class-tools input {
    flex: 1;
    min-width: 200px;
    max-width: 350px;
}

.pagination {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 14px;
}

.pagination-info {
    color: var(--muted);
    font-size: 13px;
}

.pagination-buttons {
    display: flex;
    align-items: center;
    gap: 7px;
}

.pagination-buttons button {
    border: 1px solid var(--border);
    background: white;
    color: var(--text);
    min-width: 40px;
}

.pagination-buttons button.active {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
}

.pending {
    color: var(--orange);
    font-weight: 700;
}

.pass {
    color: var(--green);
    font-weight: 700;
}

.fail {
    color: var(--red);
    font-weight: 700;
}

.small-note {
    font-size: 12px;
    color: var(--muted);
    margin-top: 10px;
}

@media(max-width: 1000px) {
    .dashboard-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .two-column {
        grid-template-columns: 1fr;
    }
}

@media(max-width: 600px) {
    .toolbar,
    .selector-box {
        align-items: stretch;
        width: 95%;
    }

    .selector-box {
        flex-direction: column;
    }

    .selector-box select,
    .academic-period-btn {
        width: 100%;
    }

    .dashboard-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px;
    }

    .stat-card {
        padding: 13px;
    }

    .stat-value {
        font-size: 22px;
    }

    .table-container,
    .panel,
    .class-section {
        padding: 13px;
    }

    .class-tools input {
        max-width: none;
        width: 100%;
    }
}

@media print {
    .toolbar,
    .message,
    .class-tools,
    .pagination,
    .download-btn,
    .logout-btn,
    .academic-period-btn {
        display: none !important;
    }

    body {
        background: white;
    }

    .table-container,
    .panel,
    .class-section,
    .stat-card {
        box-shadow: none;
        break-inside: avoid;
    }
}
</style>
</head>

<body>

</header>

<div class="toolbar">

<script src="../js/academic-period.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.4/jspdf.plugin.autotable.min.js"></script>
<script>
"use strict";

const PAGE_SIZE = 100;

let allTests = [];
let currentAcademicPeriod = null;
let loadingMarks = false;
let loadRequestNumber = 0;

let classResultsStore = new Map();
let classPagination = new Map();

/* =====================================================
   ACADEMIC PERIOD SELECTOR
===================================================== */

function openAcademicPeriodSelector() {
    if (!window.FilaAcademicPeriod) {
        showMessage(
            "The academic period selector is not available.",
            "error"
        );
        return;
    }

    window.FilaAcademicPeriod.open();
}

function updateAcademicPeriodButton(period) {
    const buttonText = document.getElementById(
        "academicPeriodBtnText"
    );

    if (!buttonText || !period) return;

    buttonText.textContent =
        `${period.academic_year} • ${period.term_name || period.term}`;
}

function waitForAcademicPeriod() {
    return new Promise((resolve, reject) => {
        if (
            window.FilaAcademicPeriod &&
            window.FilaAcademicPeriod.getSelection()
        ) {
            currentAcademicPeriod =
                window.FilaAcademicPeriod.getSelection();

            updateAcademicPeriodButton(currentAcademicPeriod);
            resolve(currentAcademicPeriod);
            return;
        }

        const readyHandler = event => {
            currentAcademicPeriod = event.detail;
            updateAcademicPeriodButton(currentAcademicPeriod);
            resolve(currentAcademicPeriod);
        };

        const errorHandler = () => {
            reject(new Error("Unable to load the academic calendar."));
        };

        window.addEventListener(
            "fila:academic-period-ready",
            readyHandler,
            { once: true }
        );

        window.addEventListener(
            "fila:academic-period-error",
            errorHandler,
            { once: true }
        );
    });
}

window.addEventListener(
    "fila:academic-period-change",
    event => {
        currentAcademicPeriod = event.detail;
        updateAcademicPeriodButton(currentAcademicPeriod);
        loadMarks(null);
    }
);

/* =====================================================
   HELPERS
===================================================== */

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    })[character]);
}

function number(value) {
    const result = Number(value);
    return Number.isFinite(result) ? result : 0;
}

function formatNumber(value) {
    return number(value).toFixed(2).replace(/\.00$/, "");
}

function percentage(part, total) {
    return total > 0 ? (part / total) * 100 : 0;
}

/*
 * Keep the existing success categories and boundaries.
 */
function getCategory(value) {
    if (value >= 80) return "A (Excellent)";
    if (value >= 75) return "B (Very Good)";
    if (value >= 70) return "C (Good)";
    if (value >= 65) return "D (Satisfactory)";
    if (value >= 60) return "E (Adequate)";
    if (value >= 50) return "S (Pass)";
    return "F (Fail)";
}

function normalizeGender(value) {
    const gender = String(value ?? "")
        .trim()
        .toLowerCase();

    if (["male", "m", "boy"].includes(gender)) return "boys";
    if (["female", "f", "girl"].includes(gender)) return "girls";

    return "unknown";
}

function showMessage(message, type = "info") {
    const box = document.getElementById("message");
    box.textContent = message;
    box.className = "message " + type;
}

function clearMessage() {
    const box = document.getElementById("message");
    box.style.display = "none";
    box.textContent = "";
}

function safeId(value) {
    return String(value).replace(/[^a-zA-Z0-9_-]/g, "_");
}

/* =====================================================
   FETCH MARKS AND TESTS
===================================================== */

async function loadMarks(preferredTestId = null) {
    const requestNumber = ++loadRequestNumber;

    const container = document.getElementById("resultsContainer");
    const dashboard = document.getElementById("dashboardContainer");
    const select = document.getElementById("testSelect");
    const analysisBody = document.getElementById("analysisBody");

    if (!currentAcademicPeriod) {
        showMessage("Please select an academic year and term.", "error");
        return;
    }

    const academicYear = currentAcademicPeriod.academic_year;
    const termNumber = currentAcademicPeriod.term_number;

    if (!academicYear || !termNumber) {
        showMessage(
            "The selected academic period is incomplete.",
            "error"
        );
        return;
    }

    loadingMarks = true;
    clearMessage();

    select.disabled = true;
    select.innerHTML = `<option value="">Loading tests...</option>`;

    dashboard.innerHTML = "";
    container.innerHTML = `
        <div class="table-container empty">
            Loading sector results...
        </div>
    `;
    analysisBody.innerHTML = "";

    try {
        const params = new URLSearchParams({
            view: "sector",
            academic_year: String(academicYear),
            term_number: String(termNumber)
        });

        const response = await fetch(
            `/api/school-marks?${params.toString()}`,
            {
                method: "GET",
                credentials: "same-origin",
                headers: {
                    "Accept": "application/json"
                },
                cache: "no-store"
            }
        );

        const data = await response.json();

        if (requestNumber !== loadRequestNumber) return;

        if (!response.ok || !data.success) {
            throw new Error(
                data.message || "Failed to load results."
            );
        }

        if (![
            "sector_admin",
            "school_admin",
            "dos"
        ].includes(data.user?.role)) {
            throw new Error(
                "You are not authorized to view these results."
            );
        }

        allTests = data.tests || [];
        select.innerHTML = "";

        if (!allTests.length) {
            select.innerHTML = `
                <option value="">No tests available</option>
            `;

            container.innerHTML = `
                <div class="table-container empty">
                    No eligible tests are available for
                    ${escapeHTML(academicYear)},
                    Term ${escapeHTML(termNumber)}.
                </div>
            `;

            dashboard.innerHTML = "";
            analysisBody.innerHTML = "";
            return;
        }

        allTests.forEach(test => {
            const option = document.createElement("option");
            option.value = String(test.id);
            option.textContent = test.name;
            select.appendChild(option);
        });

        let selectedTest = null;

        if (preferredTestId) {
            selectedTest = allTests.find(
                test => String(test.id) === String(preferredTestId)
            );
        }

        if (!selectedTest) selectedTest = allTests[0];

        select.value = String(selectedTest.id);
        displaySelectedTest();

    } catch (error) {
        if (requestNumber !== loadRequestNumber) return;

        allTests = [];
        dashboard.innerHTML = "";
        container.innerHTML = "";
        analysisBody.innerHTML = "";

        showMessage(
            error.message || "Unable to load results.",
            "error"
        );

        select.innerHTML = `
            <option value="">Unable to load tests</option>
        `;

    } finally {
        if (requestNumber === loadRequestNumber) {
            loadingMarks = false;
            select.disabled = false;
        }
    }
}

/* =====================================================
   DISPLAY SELECTED TEST
===================================================== */

function displaySelectedTest() {
    clearMessage();

    const selectedId = document.getElementById("testSelect").value;

    const test = allTests.find(
        item => String(item.id) === String(selectedId)
    );

    if (!test) {
        document.getElementById("resultsContainer").innerHTML = `
            <div class="table-container empty">
                Please select a test.
            </div>
        `;

        document.getElementById("dashboardContainer").innerHTML = "";
        document.getElementById("analysisBody").innerHTML = "";
        return;
    }

    if (!(test.classes || []).length) {
        document.getElementById("resultsContainer").innerHTML = `
            <div class="table-container empty">
                No classes or students are available for this test.
            </div>
        `;

        document.getElementById("dashboardContainer").innerHTML = "";
        document.getElementById("analysisBody").innerHTML = "";
        return;
    }

    renderClassResults(test);
}

/* =====================================================
   GROUP SAME CLASS ACROSS SCHOOLS
===================================================== */

function groupClassesAcrossSchools(classes) {
    const grouped = {};

    classes.forEach(classItem => {
        const classId = String(classItem.class_id);

        if (!grouped[classId]) {
            grouped[classId] = {
                class_id: classItem.class_id,
                class_name: classItem.class_name,
                class_level: classItem.class_level,
                subjects: [],
                students: []
            };
        }

        const group = grouped[classId];

        (classItem.subjects || []).forEach(subject => {
            const exists = group.subjects.some(
                item => String(item.id) === String(subject.id)
            );

            if (!exists) group.subjects.push(subject);
        });

        (classItem.students || []).forEach(student => {
            group.students.push({
                ...student,
                school_id: classItem.school_id,
                school_name: classItem.school_name,
                class_name: classItem.class_name
            });
        });
    });

    return Object.values(grouped).sort((a, b) =>
        a.class_name.localeCompare(b.class_name)
    );
}

/* =====================================================
   CALCULATE STUDENT RESULT
===================================================== */

function calculateStudentResult(student, subjects) {
    let total = 0;
    let maximum = 0;
    let recordedSubjects = 0;

    subjects.forEach(subject => {
        const maxMark = number(subject.maximum_mark);
        const mark = student.marks?.[String(subject.id)];

        maximum += maxMark;

        if (
            mark !== null &&
            mark !== undefined &&
            mark !== ""
        ) {
            total += number(mark);
            recordedSubjects++;
        }
    });

    const complete =
        subjects.length > 0 &&
        recordedSubjects === subjects.length &&
        maximum > 0;

    const percentageValue = maximum > 0
        ? (total / maximum) * 100
        : 0;

    return {
        total,
        maximum,
        percentage: percentageValue,
        complete,
        recordedSubjects,
        expectedSubjects: subjects.length
    };
}

/* =====================================================
   ANALYSIS DATA
===================================================== */

function buildOverallStatistics(classGroups) {
    const students = classGroups.flatMap(group => group.students);

    const stats = {
        total: students.length,
        boys: 0,
        girls: 0,
        unknownGender: 0,

        complete: 0,
        incomplete: 0,

        passed: 0,
        failed: 0,

        boysPassed: 0,
        boysFailed: 0,
        girlsPassed: 0,
        girlsFailed: 0,

        boysComplete: 0,
        girlsComplete: 0,

        totalPercentage: 0,
        bands: Array.from({ length: 10 }, (_, index) => ({
            label: `${index * 10}–${(index + 1) * 10}`,
            count: 0
        }))
    };

    students.forEach(student => {
        const gender = normalizeGender(student.gender);

        if (gender === "boys") stats.boys++;
        else if (gender === "girls") stats.girls++;
        else stats.unknownGender++;

        if (!student.complete) {
            stats.incomplete++;
            return;
        }

        stats.complete++;
        stats.totalPercentage += student.percentage;

        if (gender === "boys") stats.boysComplete++;
        if (gender === "girls") stats.girlsComplete++;

        if (student.percentage >= 50) {
            stats.passed++;

            if (gender === "boys") stats.boysPassed++;
            if (gender === "girls") stats.girlsPassed++;
        } else {
            stats.failed++;

            if (gender === "boys") stats.boysFailed++;
            if (gender === "girls") stats.girlsFailed++;
        }

        // Ten non-overlapping score bands:
        // 0–<10, 10–<20, ..., 90–100.
        let bandIndex = Math.floor(student.percentage / 10);
        bandIndex = Math.max(0, Math.min(9, bandIndex));

        stats.bands[bandIndex].count++;
    });

    stats.average = stats.complete > 0
        ? stats.totalPercentage / stats.complete
        : 0;

    stats.passRate = percentage(stats.passed, stats.complete);
    stats.failureRate = percentage(stats.failed, stats.complete);

    stats.boysPassRate = percentage(
        stats.boysPassed,
        stats.boysComplete
    );

    stats.boysFailureRate = percentage(
        stats.boysFailed,
        stats.boysComplete
    );

    stats.girlsPassRate = percentage(
        stats.girlsPassed,
        stats.girlsComplete
    );

    stats.girlsFailureRate = percentage(
        stats.girlsFailed,
        stats.girlsComplete
    );

    return stats;
}

/* =====================================================
   CLASS SEARCH AND PAGINATION
===================================================== */

function getFilteredStudents(classKey) {
    const data = classResultsStore.get(classKey);
    const state = classPagination.get(classKey);

    if (!data || !state) return [];

    const query = state.search.trim().toLowerCase();

    if (!query) return data.students;

    return data.students.filter(student =>
        String(student.name || "").toLowerCase().includes(query) ||
        String(student.student_code || "").toLowerCase().includes(query) ||
        String(student.school_name || "").toLowerCase().includes(query)
    );
}

function searchClassStudents(classKey, query) {
    const state = classPagination.get(classKey);
    if (!state) return;

    state.search = query;
    state.page = 1;

    renderClassPage(classKey);
}

function changeClassPage(classKey, page) {
    const state = classPagination.get(classKey);
    if (!state) return;

    state.page = page;
    renderClassPage(classKey);
}

function renderClassPage(classKey) {
    const data = classResultsStore.get(classKey);
    const state = classPagination.get(classKey);

    if (!data || !state) return;

    const students = getFilteredStudents(classKey);
    const total = students.length;
    const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));

    state.page = Math.max(1, Math.min(state.page, totalPages));

    const startIndex = (state.page - 1) * PAGE_SIZE;
    const pageStudents = students.slice(
        startIndex,
        startIndex + PAGE_SIZE
    );

    const subjects = data.subjects;

    const subjectHeaders = subjects.map(subject => `
        <th>
            ${escapeHTML(subject.name)}
            <br>
            <small>Out of ${formatNumber(subject.maximum_mark)}</small>
        </th>
    `).join("");

    const rows = pageStudents.map((student, index) => {
        const position = startIndex + index + 1;

        const subjectCells = subjects.map(subject => {
            const mark = student.marks?.[String(subject.id)];

            return `
                <td>
                    ${
                        mark === null || mark === undefined
                            ? "—"
                            : formatNumber(mark)
                    }
                </td>
            `;
        }).join("");

        const category = student.complete
            ? getCategory(student.percentage)
            : "Pending";

        const categoryClass = !student.complete
            ? "pending"
            : student.percentage >= 50
                ? "pass"
                : "fail";

        return `
            <tr>
                <td>${position}</td>
                <td>${escapeHTML(student.name)}</td>
                <td>${escapeHTML(student.gender || "—")}</td>
                <td class="school-name">${escapeHTML(student.school_name)}</td>
                ${subjectCells}
                <td><strong>${formatNumber(student.total)}</strong></td>
                <td>${formatNumber(student.percentage)}%</td>
                <td class="${categoryClass}">${category}</td>
            </tr>
        `;
    }).join("");

    const table = `
        <table id="classTable_${classKey}">
            <thead>
                <tr>
                    <th>Position</th>
                    <th>Student</th>
                    <th>Gender</th>
                    <th>School</th>
                    ${subjectHeaders}
                    <th>Total</th>
                    <th>%</th>
                    <th>Category</th>
                </tr>
            </thead>
            <tbody>
                ${
                    rows || `
                        <tr>
                            <td colspan="${subjects.length + 9}">
                                No learners found.
                            </td>
                        </tr>
                    `
                }
            </tbody>
        </table>
    `;

    document.getElementById(`tableWrap_${classKey}`).innerHTML = table;

    const from = total ? startIndex + 1 : 0;
    const to = Math.min(startIndex + PAGE_SIZE, total);

    const pagination = document.getElementById(
        `pagination_${classKey}`
    );

    pagination.innerHTML = `
        <div class="pagination-info">
            Showing ${from}–${to} of ${total} learners
            · Page ${state.page} of ${totalPages}
        </div>

        <div class="pagination-buttons">
            <button
                onclick="changeClassPage('${classKey}', 1)"
                ${state.page === 1 ? "disabled" : ""}>
                First
            </button>

            <button
                onclick="changeClassPage('${classKey}', ${state.page - 1})"
                ${state.page === 1 ? "disabled" : ""}>
                Previous
            </button>

            <button class="active" disabled>
                ${state.page}
            </button>

            <button
                onclick="changeClassPage('${classKey}', ${state.page + 1})"
                ${state.page >= totalPages ? "disabled" : ""}>
                Next
            </button>

            <button
                onclick="changeClassPage('${classKey}', ${totalPages})"
                ${state.page >= totalPages ? "disabled" : ""}>
                Last
            </button>
        </div>
    `;
}

/* =====================================================
   SCHOOL AND SUBJECT PERFORMANCE ANALYSIS
===================================================== */

function createSchoolAnalysis(classGroups) {
    const body = document.getElementById("analysisBody");
    body.innerHTML = "";

    const results = [];

    classGroups.forEach(classGroup => {
        const schoolGroups = {};

        classGroup.students.forEach(student => {
            const schoolId = String(student.school_id);

            if (!schoolGroups[schoolId]) {
                schoolGroups[schoolId] = {
                    school_name: student.school_name,
                    students: []
                };
            }

            schoolGroups[schoolId].students.push(student);
        });

        Object.values(schoolGroups).forEach(schoolGroup => {
            const students = schoolGroup.students.filter(
                student => student.complete
            );

            if (!students.length) return;

            const average = students.reduce(
                (sum, student) => sum + student.percentage,
                0
            ) / students.length;

            const passed = students.filter(
                student => student.percentage >= 50
            ).length;

            const failed = students.length - passed;

            const passRate = percentage(passed, students.length);

            const subjectAnalysis = classGroup.subjects.map(subject => {
                const maximum = number(subject.maximum_mark);

                const marks = students.map(student =>
                    number(student.marks[String(subject.id)])
                );

                const averageMark = marks.reduce(
                    (sum, mark) => sum + mark,
                    0
                ) / marks.length;

                const subjectPercentage = maximum > 0
                    ? (averageMark / maximum) * 100
                    : 0;

                const subjectPassed = marks.filter(
                    mark => maximum > 0 && mark >= maximum * 0.5
                ).length;

                const subjectFailed = marks.length - subjectPassed;

                return {
                    name: subject.name,
                    averageMark,
                    maximum,
                    subjectPercentage,
                    passed: subjectPassed,
                    failed: subjectFailed,
                    passRate: percentage(subjectPassed, marks.length)
                };
            });

            subjectAnalysis.sort(
                (a, b) => b.subjectPercentage - a.subjectPercentage
            );

            results.push({
                school: schoolGroup.school_name,
                class_name: classGroup.class_name,
                average,
                passed,
                failed,
                passRate,
                completeCount: students.length,
                subjectAnalysis
            });
        });
    });

    results.sort((a, b) => b.average - a.average);

    results.forEach((result, index) => {
        const mainRow = document.createElement("tr");
        mainRow.className = "analysis-school";

        mainRow.innerHTML = `
            <td>${index + 1}</td>
            <td>
                ${escapeHTML(result.school)}
                <br>
                <small>${escapeHTML(result.class_name)}</small>
            </td>
            <td>${formatNumber(result.average)}%</td>
            <td>${result.passed}</td>
            <td>${result.failed}</td>
            <td>${formatNumber(result.passRate)}%</td>
        `;

        body.appendChild(mainRow);

        result.subjectAnalysis.forEach(subject => {
            const row = document.createElement("tr");
            row.className = "analysis-subject";

            row.innerHTML = `
                <td></td>
                <td>${escapeHTML(subject.name)}</td>
                <td>
                    ${formatNumber(subject.averageMark)}
                    / ${formatNumber(subject.maximum)}
                    (${formatNumber(subject.subjectPercentage)}%)
                </td>
                <td>${subject.passed}</td>
                <td>${subject.failed}</td>
                <td>${formatNumber(subject.passRate)}%</td>
            `;

            body.appendChild(row);
        });
    });

    if (!results.length) {
        body.innerHTML = `
            <tr>
                <td colspan="6">
                    No complete performance data available.
                </td>
            </tr>
        `;
    }
}

function createPDFDocument() {
    if (!window.jspdf || !window.jspdf.jsPDF) {
        alert("PDF library is not available. Please refresh the page and try again.");
        return null;
    }

    const doc = new window.jspdf.jsPDF({
        orientation: "landscape",
        unit: "mm",
        format: "a4"
    });

    if (typeof doc.autoTable !== "function") {
        alert("PDF table library is not available. Please refresh the page and try again.");
        return null;
    }

    return doc;
}

function getSelectedTest() {
    const selectedId = document.getElementById("testSelect").value;

    return allTests.find(
        test => String(test.id) === String(selectedId)
    );
}

function getPDFFileName(name) {
    return String(name || "Fila_Grades_Report")
        .trim()
        .replace(/[^a-zA-Z0-9_-]+/g, "_")
        .replace(/^_+|_+$/g, "");
}

function addPDFHeader(doc, title, subtitle = "") {

    if (subtitle) {
        doc.text(subtitle, 148.5, 20, { align: "center" });

    doc.text(
        `Generated: ${new Date().toLocaleString()}`,
        285,

    );
}

function addPDFSectionTitle(doc, title, y) {
    doc.setFont("helvetica", "bold");

    // IMPORTANT:
    // Use data.students, not the currently displayed page.
    // This includes all learners in the class.

    const headers = [
        "No.",
        "Student Name",
        "Gender",
        "School",
        ...subjects.map(subject =>
            `${subject.name} (${formatNumber(subject.maximum_mark)})`
        ),
        "Total",
        "Percentage",
        "Category"
    ];

    const rows = data.students.map((student, index) => {
        const subjectMarks = subjects.map(subject => {
            const mark = student.marks?.[String(subject.id)];

            return mark === null || mark === undefined
                ? "Pending"
                : formatNumber(mark);
        });

        return [
            index + 1,
            student.name || "",
            student.gender || "",
            student.school_name || "",
            ...subjectMarks,
            formatNumber(student.total),
            `${formatNumber(student.percentage)}%`,
            student.complete
                ? getCategory(student.percentage)
                : "Pending"
        ];
    });

    addPDFHeader(
        doc,
        `${className} RESULTS`,
        `${testName} | ${getPDFAcademicPeriod()}`
    );

    doc.autoTable({
        startY: 32,
        head: [headers],
        body: rows,
        theme: "grid",

        margin: {
            left: 8,
            right: 8
        },

        styles: {
            font: "helvetica",
            fontSize: 7,
            cellPadding: 2,
            overflow: "linebreak",
            valign: "middle"
        },

        headStyles: {
            fillColor: [23, 63, 112],
            textColor: 255,
            fontStyle: "bold",
            halign: "center"
        },

        alternateRowStyles: {
            fillColor: [245, 248, 252]
        },

        columnStyles: {
            0: { cellWidth: 9 },
            1: { cellWidth: 35 },
            2: { cellWidth: 23 },
            3: { cellWidth: 15 },
            4: { cellWidth: 30 }
        },

        didDrawPage: function () {
            const pageHeight = doc.internal.pageSize.height;

            doc.setFontSize(8);
            doc.setFont("helvetica", "normal");

            doc.text(
                `Fila Grades System | ${className}`,
                10,
                pageHeight - 7
            );

            doc.text(
                `Page ${doc.internal.getNumberOfPages()}`,
                285,
                pageHeight - 7,
                { align: "right" }
            );
        }
    });

    doc.save(
        `${getPDFFileName(className)}_Results.pdf`
    );
}

/* =====================================================
   DOWNLOAD COMPLETE SELECTED TEST REPORT PDF
===================================================== */

function downloadFullReportPDF() {
    const test = getSelectedTest();

    if (!test) {
        alert("Please select a test first.");
        return;
    }

    if (!classResultsStore.size) {
        alert("There are no results available to download.");
        return;
    }

    const doc = createPDFDocument();

    if (!doc) return;

    const groups = Array.from(classResultsStore.values()).map(data => ({
        ...data.classGroup,
        subjects: data.subjects,
        students: data.students
    }));

    const stats = buildOverallStatistics(groups);

    const period = getPDFAcademicPeriod();

    // -------------------------------------------------
    // PAGE 1: OVERALL DASHBOARD
    // -------------------------------------------------

    addPDFHeader(
        doc,
        "FILA GRADES - COMPLETE RESULTS REPORT",
        `${test.name} | ${period}`
    );

    let y = 37;

    y = addPDFSectionTitle(doc, "OVERALL PERFORMANCE SUMMARY", y);

    const summaryRows = [
        ["Total learners", stats.total],
        ["Boys", stats.boys],
        ["Girls", stats.girls],
        ["Unknown gender", stats.unknownGender],
        ["Complete results", stats.complete],
        ["Incomplete results", stats.incomplete],
        ["Passed (50% and above)", stats.passed],
        ["Failed (below 50%)", stats.failed],
        ["Overall average", `${formatNumber(stats.average)}%`],
        ["Winning percentage / pass rate", `${formatNumber(stats.passRate)}%`],
        ["Failure rate", `${formatNumber(stats.failureRate)}%`]
    ];

    doc.autoTable({
        startY: y,
        head: [["Performance Indicator", "Result"]],

            left: 14,
            right: 14
        },

        tableWidth: 135,

        styles: {
            fontSize: 9,
            cellPadding: 3
        },

        headStyles: {
            fillColor: [23, 63, 112],
            textColor: 255
        }
    });

    y = doc.lastAutoTable.finalY + 10;

    y = addPDFSectionTitle(doc, "GENDER PERFORMANCE", y);

    const genderRows = [

            "Boys",

    doc.autoTable({

            "Total",

            "Failed",

            left: 14,
            right: 14
        },

        styles: {
            fontSize: 8,
            cellPadding: 3
        },

        headStyles: {
            fillColor: [23, 63, 112],
            textColor: 255
        }
    });

    // -------------------------------------------------
    // MARKS DISTRIBUTION
    // -------------------------------------------------

    y = doc.lastAutoTable.finalY + 10;

    y = addPDFSectionTitle(doc, "MARKS DISTRIBUTION", y);

    doc.autoTable({
        startY: y,
        head: [["Percentage Band", "Number of Learners"]],
        body: stats.bands.map(band => [
            `${band.label}%`,
            band.count
        ]),
        theme: "grid",

        margin: {
            left: 14,
            right: 14
        },

        tableWidth: 110,

        styles: {
            fontSize: 8,
            cellPadding: 2
        },

        headStyles: {
            fillColor: [23, 63, 112],
            textColor: 255
        }

    groups.forEach(group => {

                    ? "Pending"
                    : formatNumber(mark);
            });

            return [
                index + 1,
                student.name || "",

        doc.autoTable({

                cellPadding: 2,

            },

                fillColor: [23, 63, 112],
                textColor: 255
            },

            },

                1: { cellWidth: 35 },

    // -------------------------------------------------

    if (analysisTable) {

            },

                doc.setFontSize(8);

                doc.text(

                    12,

                doc.text(

                    pageHeight - 7,
                    { align: "right" }

            }

    // Download directly

/* =====================================================
   LOGOUT
===================================================== */

function logout() {
    localStorage.clear();
    location.href = "../../index.html";
}

/* =====================================================
   START
===================================================== */

async function initializePage() {
    try {
        await waitForAcademicPeriod();

        const preferredTestId = new URLSearchParams(
            window.location.search
        ).get("test_id");

        await loadMarks(preferredTestId);

    } catch (error) {
        showMessage(
            error.message || "Unable to initialize the results page.",
            "error"
        );

        document.getElementById("testSelect").innerHTML = `
            <option value="">Unable to load tests</option>
        `;
    }
}

initializePage();
