</head>

<body>

<header>
    <h1>ALL SCHOOLS RESULTS</h1>
    <p>Fila Grades Results Dashboard</p>
</header>

<div class="toolbar">

    <div class="selector-box">

        <button
            type="button"
            id="academicPeriodBtn"
            class="academic-period-btn"
            onclick="openAcademicPeriodSelector()"
            title="Change the academic year and term">

            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round"
                 aria-hidden="true">

                <rect x="3" y="5" width="18" height="16" rx="2"></rect>
                <path d="M16 3v4M8 3v4M3 10h18"></path>
                <path d="m9 16 2 2 4-4"></path>

            </svg>

            <span id="academicPeriodBtnText">
                Academic Year &amp; Term
            </span>

        </button>

        <label for="testSelect"><strong>Select Test:</strong></label>

        <select id="testSelect" onchange="displaySelectedTest()">
            <option value="">Loading tests...</option>
        </select>

    </div>

    <button class="logout-btn" onclick="logout()">Logout</button>

</div>

<div id="message" class="message"></div>

<div id="resultsContainer"></div>

<div class="table-container">

    <div class="section-header">
        <h2>School and Class Performance Analysis</h2>

        <button class="download-btn"
                onclick="downloadTable('analysisTable','School Performance Analysis')">
            Download
        </button>
    </div>

    <div class="table-scroll">

        <table id="analysisTable">

            <thead>
                <tr>
                    <th>Position</th>
                    <th>School &amp; Class</th>
                    <th>Average</th>
                    <th>Passed</th>
                    <th>Failed</th>
                    <th>Pass Rate</th>
                </tr>
            </thead>

            <tbody id="analysisBody"></tbody>

        </table>

    </div>

</div>

<!-- Load the shared academic period selector before the main script. -->
<script src="../js/academic-period.js"></script>

<script>

let allTests = [];
let currentAcademicPeriod = null;
let loadingMarks = false;
let loadRequestNumber = 0;

/* =====================================================
   ACADEMIC PERIOD SELECTOR
===================================================== */

function openAcademicPeriodSelector() {

    if (!window.FilaAcademicPeriod) {
        showMessage(
            "The academic period selector is not available.",
            "error"
        );
        return;
    }

    window.FilaAcademicPeriod.open();
}

function updateAcademicPeriodButton(period) {

    const buttonText = document.getElementById(
        "academicPeriodBtnText"
    );

    if (!buttonText || !period) return;

    buttonText.textContent =
        `${period.academic_year} • ${period.term_name || period.term}`;
}

function waitForAcademicPeriod() {

    return new Promise((resolve, reject) => {

        if (
            window.FilaAcademicPeriod &&
            window.FilaAcademicPeriod.getSelection()
        ) {

            currentAcademicPeriod =
                window.FilaAcademicPeriod.getSelection();

            updateAcademicPeriodButton(currentAcademicPeriod);

            resolve(currentAcademicPeriod);
            return;
        }

        const readyHandler = event => {

            currentAcademicPeriod = event.detail;

            updateAcademicPeriodButton(currentAcademicPeriod);

            resolve(currentAcademicPeriod);
        };

        const errorHandler = () => {

            reject(
                new Error("Unable to load the academic calendar.")
            );
        };

        window.addEventListener(
            "fila:academic-period-ready",
            readyHandler,
            { once: true }
        );

        window.addEventListener(
            "fila:academic-period-error",
            errorHandler,
            { once: true }
        );

    });
}

window.addEventListener(
    "fila:academic-period-change",
    function(event) {

        currentAcademicPeriod = event.detail;

        updateAcademicPeriodButton(currentAcademicPeriod);

        // A test from the previous period must not remain selected.
        loadMarks(null);

    }
);

/* =====================================================
   HELPERS
===================================================== */

function escapeHTML(value) {

    return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    })[character]);

}

function number(value) {

    const result = Number(value);

    return Number.isFinite(result) ? result : 0;
}

function formatNumber(value) {

    return Number(value).toFixed(2).replace(/\.00$/, "");
}

function getCategory(percentage) {

    if (percentage >= 80) return "A (Excellent)";
    if (percentage >= 75) return "B (Very Good)";
    if (percentage >= 70) return "C (Good)";
    if (percentage >= 65) return "D (Satisfactory)";
    if (percentage >= 60) return "E (Adequate)";
    if (percentage >= 50) return "S (Pass)";

    return "F (Fail)";
}

function showMessage(message, type = "info") {

    const box = document.getElementById("message");

    box.textContent = message;
    box.className = "message " + type;
    box.style.display = "block";
}

function clearMessage() {

    document.getElementById("message").style.display = "none";
}

/* =====================================================
   FETCH MARKS AND TESTS
===================================================== */

async function loadMarks(preferredTestId = null) {

    if (loadingMarks) {
        // The request number ensures older responses cannot
        // overwrite the results for a more recently selected period.
    }

    const requestNumber = ++loadRequestNumber;

    const container = document.getElementById("resultsContainer");
    const select = document.getElementById("testSelect");
    const analysisBody = document.getElementById("analysisBody");

    if (!currentAcademicPeriod) {

        showMessage(
            "Please select an academic year and term.",
            "error"
        );

        return;
    }

    const academicYear = currentAcademicPeriod.academic_year;
    const termNumber = currentAcademicPeriod.term_number;

    if (!academicYear || !termNumber) {

        showMessage(
            "The selected academic period is incomplete.",
            "error"
        );

        return;
    }

    loadingMarks = true;

    clearMessage();

    select.disabled = true;

    select.innerHTML = `
        <option value="">Loading tests...</option>
    `;

    container.innerHTML = `
        <div class="table-container empty">
            Loading sector results...
        </div>
    `;

    analysisBody.innerHTML = "";

    try {

        /*
         * view=sector tells the API this is the
         * All Schools Results page.
         *
         * The API must still enforce the existing
         * role and sector authorization restrictions.
         *
         * Do not send the old test_id when changing periods.
         * The API must return all eligible tests for the
         * newly selected period.
         */

        const params = new URLSearchParams({

            view: "sector",

            academic_year: String(academicYear),

            term_number: String(termNumber)

        });

        const response = await fetch(
            `/api/school-marks?${params.toString()}`,
            {
                method: "GET",

                credentials: "same-origin",

                headers: {
                    "Accept": "application/json"
                },

                cache: "no-store"
            }
        );

        const data = await response.json();

        // Ignore responses from previous period selections.
        if (requestNumber !== loadRequestNumber) {
            return;
        }

        if (!response.ok || !data.success) {

            throw new Error(
                data.message || "Failed to load results."
            );
        }

        /*
         * Authorization is performed by the API.
         * This is an additional interface-level role check,
         * not a replacement for backend authorization.
         */

        if (![
            "sector_admin",
            "school_admin",
            "dos"
        ].includes(data.user?.role)) {

            throw new Error(
                "You are not authorized to view these results."
            );
        }

        allTests = data.tests || [];

        select.innerHTML = "";

        if (!allTests.length) {

            select.innerHTML = `
                <option value="">No tests available</option>
            `;

            container.innerHTML = `
                <div class="table-container empty">
                    No eligible tests are available for
                    ${escapeHTML(academicYear)},
                    Term ${escapeHTML(termNumber)}.
                </div>
            `;

            analysisBody.innerHTML = "";

            return;
        }

        allTests.forEach(test => {

            const option = document.createElement("option");

            option.value = String(test.id);
            option.textContent = test.name;

            select.appendChild(option);

        });

        /*
         * On the first page load, use the test_id from the
         * URL if that test is available in the selected period.
         *
         * If it is not available, select the first available test.
         *
         * When the academic period changes, preferredTestId is null,
         * so the first test in the newly selected period is selected.
         */

        let selectedTest = null;

        if (preferredTestId) {

            selectedTest = allTests.find(
                test => String(test.id) === String(preferredTestId)
            );

        }

        if (!selectedTest) {
            selectedTest = allTests[0];
        }

        select.value = String(selectedTest.id);

        displaySelectedTest();

    } catch (error) {

        if (requestNumber !== loadRequestNumber) {
            return;
        }

        allTests = [];

        container.innerHTML = "";

        analysisBody.innerHTML = "";

        showMessage(
            error.message || "Unable to load results.",
            "error"
        );

        select.innerHTML = `
            <option value="">Unable to load tests</option>
        `;

    } finally {

        if (requestNumber === loadRequestNumber) {

            loadingMarks = false;
            select.disabled = false;

        }

    }
}

/* =====================================================
   DISPLAY SELECTED TEST
===================================================== */

function displaySelectedTest() {

    clearMessage();

    const selectedId = document.getElementById(
        "testSelect"
    ).value;

    const test = allTests.find(
        item => String(item.id) === String(selectedId)
    );

    if (!test) {

        document.getElementById("resultsContainer").innerHTML = `
            <div class="table-container empty">
                Please select a test.
            </div>
        `;

        document.getElementById("analysisBody").innerHTML = "";

        return;
    }

    const classes = test.classes || [];

    if (!classes.length) {

        document.getElementById("resultsContainer").innerHTML = `
            <div class="table-container empty">
                No classes or students are available for this test.
            </div>
        `;

        document.getElementById("analysisBody").innerHTML = "";

        return;
    }

    renderClassResults(test);
}

/* =====================================================
   COMBINE SAME CLASS ACROSS ALL SCHOOLS
===================================================== */

function groupClassesAcrossSchools(classes) {

    const grouped = {};

    classes.forEach(classItem => {

        const classId = String(classItem.class_id);

        if (!grouped[classId]) {

            grouped[classId] = {

                class_id: classItem.class_id,

                class_name: classItem.class_name,

                class_level: classItem.class_level,

                subjects: [],

                students: []

            };

        }

        const group = grouped[classId];

        (classItem.subjects || []).forEach(subject => {

            const exists = group.subjects.some(
                item => String(item.id) === String(subject.id)
            );

            if (!exists) {
                group.subjects.push(subject);
            }

        });

        (classItem.students || []).forEach(student => {

            group.students.push({

                ...student,

                school_id: classItem.school_id,

                school_name: classItem.school_name,

                class_name: classItem.class_name

            });

        });

    });

    return Object.values(grouped).sort((a, b) =>
        a.class_name.localeCompare(b.class_name)
    );
}

/* =====================================================
   CALCULATE STUDENT RESULTS
===================================================== */

function calculateStudentResult(student, subjects) {

    let total = 0;
    let maximum = 0;

    subjects.forEach(subject => {

        const maxMark = number(subject.maximum_mark);

        maximum += maxMark;

        const mark = student.marks?.[String(subject.id)];

        total += mark === null || mark === undefined
            ? 0
            : number(mark);

    });

    const percentage = maximum > 0
        ? (total / maximum) * 100
        : 0;

    return {
        total,
        maximum,
        percentage
    };
}

/* =====================================================
   DISPLAY CLASS RESULTS
===================================================== */

function renderClassResults(test) {

    const container = document.getElementById(
        "resultsContainer"
    );

    container.innerHTML = "";

    const groupedClasses = groupClassesAcrossSchools(
        test.classes || []
    );

    const analysisGroups = [];

    groupedClasses.forEach(classGroup => {

        const subjects = classGroup.subjects;

        const students = classGroup.students.map(student => {

            const result = calculateStudentResult(
                student,
                subjects
            );

            return {
                ...student,
                ...result
            };

        });

        analysisGroups.push({
            ...classGroup,
            students
        });

        students.sort((a, b) =>
            b.percentage - a.percentage ||
            a.name.localeCompare(b.name)
        );

        let rows = "";

        students.forEach((student, index) => {

            const subjectCells = subjects.map(subject => {

                const mark = student.marks?.[String(subject.id)];

                return `<td>${
                    mark === null || mark === undefined
                        ? "—"
                        : formatNumber(mark)
                }</td>`;

            }).join("");

            rows += `
                <tr>
                    <td>${index + 1}</td>

                    <td>${escapeHTML(student.name)}</td>

                    <td class="school-name">
                        ${escapeHTML(student.school_name)}
                    </td>

                    ${subjectCells}

                    <td>
                        <strong>${formatNumber(student.total)}</strong>
                    </td>

                    <td>${formatNumber(student.percentage)}%</td>

                    <td>${getCategory(student.percentage)}</td>
                </tr>
            `;

        });

        if (!students.length) {

            rows = `
                <tr>
                    <td colspan="${subjects.length + 6}">
                        No active students found in this class.
                    </td>
                </tr>
            `;

        }

        const subjectHeaders = subjects.map(subject => `

            <th>
                ${escapeHTML(subject.name)}
                <br>
                <small>
                    Out of ${formatNumber(subject.maximum_mark)}
                </small>
            </th>

        `).join("");

        const section = document.createElement("div");

        section.className = "table-container";

        const tableId = `classTable_${String(classGroup.class_id).replace(/[^a-zA-Z0-9_-]/g, "_")}`;

        section.innerHTML = `

            <div class="section-header">

                <h2 class="class-heading">
                    ${escapeHTML(classGroup.class_name)} Results
                </h2>

                <button class="download-btn"
                    onclick="downloadTable(
                        '${tableId}',
                        '${escapeHTML(test.name)} - ${escapeHTML(classGroup.class_name)}'
                    )">

                    Download

                </button>

            </div>

            <div class="table-scroll">

                <table id="${tableId}">

                    <thead>

                        <tr>
                            <th>Position</th>
                            <th>Student</th>
                            <th>School</th>
                            ${subjectHeaders}
                            <th>Total</th>
                            <th>%</th>
                            <th>Category</th>
                        </tr>

                    </thead>

                    <tbody>
                        ${rows}
                    </tbody>

                </table>

            </div>

        `;

        container.appendChild(section);

    });

    createSchoolAnalysis(analysisGroups);
}

/* =====================================================
   SCHOOL AND SUBJECT PERFORMANCE ANALYSIS
===================================================== */

function createSchoolAnalysis(classGroups) {

    const body = document.getElementById("analysisBody");

    body.innerHTML = "";

    let results = [];

    classGroups.forEach(classGroup => {

        const schoolGroups = {};

        classGroup.students.forEach(student => {

            const schoolId = String(student.school_id);

            if (!schoolGroups[schoolId]) {

                schoolGroups[schoolId] = {

                    school_name: student.school_name,

                    students: []

                };

            }

            schoolGroups[schoolId].students.push(student);

        });

        Object.values(schoolGroups).forEach(schoolGroup => {

            const students = schoolGroup.students.filter(student =>

                student.maximum > 0 &&

                student.marks &&

                classGroup.subjects.every(subject => {

                    const mark = student.marks[String(subject.id)];

                    return mark !== null &&
                           mark !== undefined &&
                           mark !== "";

                })

            );

            if (!students.length) return;

            const average = students.reduce(
                (sum, student) => sum + student.percentage,
                0
            ) / students.length;

            const passed = students.filter(
                student => student.percentage >= 50
            ).length;

            const failed = students.length - passed;

            const passRate = (passed / students.length) * 100;

            const subjectAnalysis = classGroup.subjects.map(subject => {

                const maximum = number(subject.maximum_mark);

                const marks = students.map(student =>
                    number(student.marks[String(subject.id)])
                );

                const averageMark = marks.reduce(
                    (sum, mark) => sum + mark,
                    0
                ) / marks.length;

                const subjectPercentage = maximum > 0
                    ? (averageMark / maximum) * 100
                    : 0;

                const subjectPassed = marks.filter(
                    mark => mark >= maximum * 0.5
                ).length;

                const subjectFailed = marks.length - subjectPassed;

                const subjectPassRate =
                    (subjectPassed / marks.length) * 100;

                return {

                    name: subject.name,

                    averageMark,

                    maximum,

                    subjectPercentage,

                    passed: subjectPassed,

                    failed: subjectFailed,

                    passRate: subjectPassRate

                };

            });

            subjectAnalysis.sort(
                (a, b) => b.subjectPercentage - a.subjectPercentage
            );

            results.push({

                school: schoolGroup.school_name,

                class_name: classGroup.class_name,

                average,

                passed,

                failed,

                passRate,

                subjectAnalysis

            });

        });

    });

    results.sort((a, b) => b.average - a.average);

    results.forEach((result, index) => {

        body.innerHTML += `

            <tr class="analysis-school">

                <td>${index + 1}</td>

                <td>
                    ${escapeHTML(result.school)}
                    <br>
                    <small>${escapeHTML(result.class_name)}</small>
                </td>

                <td>${formatNumber(result.average)}%</td>

                <td>${result.passed}</td>

                <td>${result.failed}</td>

                <td>${formatNumber(result.passRate)}%</td>

            </tr>

        `;

        result.subjectAnalysis.forEach(subject => {

            body.innerHTML += `

                <tr class="analysis-subject">

                    <td></td>

                    <td>${escapeHTML(subject.name)}</td>

                    <td>
                        ${formatNumber(subject.averageMark)}
                        / ${formatNumber(subject.maximum)}
                        (${formatNumber(subject.subjectPercentage)}%)
                    </td>

                    <td>${subject.passed}</td>

                    <td>${subject.failed}</td>

                    <td>${formatNumber(subject.passRate)}%</td>

                </tr>

            `;

        });

    });

    if (!results.length) {

        body.innerHTML = `
            <tr>
                <td colspan="6">
                    No performance data available.
                </td>
            </tr>
        `;

    }
}

/* =====================================================
   DOWNLOAD / PRINT TABLE
===================================================== */

function downloadTable(tableId, title) {

    const table = document.getElementById(tableId);

    if (!table) {

        alert("Table not found.");
        return;

    }

    const win = window.open("", "_blank");

    if (!win) {

        alert("Please allow pop-ups to download or print results.");
        return;

    }

    const html = `

        <!DOCTYPE html>
        <html>

        <head>

            <title>${escapeHTML(title)}</title>

            <style>

                body {
                    font-family: Arial, sans-serif;
                    padding: 20px;
                }

                h2 {
                    text-align: center;
                }

                table {
                    width: 100%;
                    border-collapse: collapse;
                }

                th, td {
                    border: 1px solid #000;
                    padding: 6px;
                    text-align: center;
                    font-size: 11px;
                }

                th {
                    background: #eee;
                }

                @media print {
                    body {
                        padding: 5px;
                    }
                }

            </style>

        </head>

        <body>

            <h2>${escapeHTML(title)}</h2>

            ${table.outerHTML}

        </body>

        </html>

    `;

    win.document.write(html);
    win.document.close();

    win.onload = function() {
        win.print();
    };
}

/* =====================================================
   LOGOUT
===================================================== */

function logout() {

    localStorage.clear();

    location.href = "../../index.html";
}

/* =====================================================
   START
===================================================== */

async function initializePage() {

    try {

        await waitForAcademicPeriod();

        // Use the original URL test only as the initial
        // preferred selection. The API returns all eligible
        // tests for the selected period.

        const preferredTestId = new URLSearchParams(
            window.location.search
        ).get("test_id");

        await loadMarks(preferredTestId);

    } catch (error) {

        showMessage(
            error.message || "Unable to initialize the results page.",
            "error"
        );

        document.getElementById("testSelect").innerHTML = `
            <option value="">Unable to load tests</option>
        `;

    }
}

initializePage();

</script>
