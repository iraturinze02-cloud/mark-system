
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Set New Password | Fila Grades System</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background: #f1f5f9;
    font-family: "Segoe UI", Arial, sans-serif;
    color: #1e293b;
}

.container {
    width: 100%;
    max-width: 440px;
    background: white;
    padding: 35px 28px;
    border-radius: 16px;
    box-shadow: 0 10px 35px rgba(15,23,42,.08);
    text-align: center;
}

.logo {
    width: 65px;
    height: 65px;
    margin: 0 auto 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #eff6ff;
    color: #1d4ed8;
    border-radius: 50%;
    font-size: 30px;
}

h1 {
    margin: 0 0 10px;
    font-size: 23px;
    color: #123b67;
}

.description {
    font-size: 14px;
    line-height: 1.7;
    color: #64748b;
    margin-bottom: 25px;
}

label {
    display: block;
    text-align: left;
    font-size: 13px;
    font-weight: 700;
    margin: 16px 0 7px;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #dbe2ea;
    border-radius: 9px;
    background: #f8fafc;
    outline: none;
    font-size: 15px;
}

input:focus {
    border-color: #2563eb;
    background: white;
    box-shadow: 0 0 0 3px rgba(37,99,235,.12);
}

.hint {
    display: block;
    text-align: left;
    color: #64748b;
    font-size: 12px;
    margin-top: 7px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 22px;
    border: none;
    border-radius: 9px;
    background: linear-gradient(135deg,#2563eb,#1d4ed8);
    color: white;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
}

button:hover {
    opacity: .93;
}

button:disabled {
    opacity: .55;
    cursor: not-allowed;
}

#message {
    display: none;
    padding: 12px;
    margin-top: 17px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.5;
}

#message.success {
    display: block;
    color: #166534;
    background: #dcfce7;
}

#message.error {
    display: block;
    color: #991b1b;
    background: #fee2e2;
}

@media(max-width: 420px) {
    .container {
        padding: 28px 20px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">🔐</div>

    <h1>Set Your New Password</h1>

    <p class="description">
        Your email has been verified successfully.
        Create a new password to complete your account setup.
    </p>

    <form id="passwordForm">

        <label for="password">New Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter your new password"
            minlength="8"
            maxlength="128"
            autocomplete="new-password"
            required
        >

        <span class="hint">
            Your password must contain at least 8 characters.
        </span>

        <label for="confirmPassword">Confirm New Password</label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm your new password"
            minlength="8"
            maxlength="128"
            autocomplete="new-password"
            required
        >

        <button type="submit" id="submitBtn">
            Set New Password
        </button>

    </form>

    <div id="message"></div>

</div>

<script>
const passwordInput = document.getElementById("password");
const confirmPasswordInput = document.getElementById("confirmPassword");
const passwordForm = document.getElementById("passwordForm");
const submitBtn = document.getElementById("submitBtn");
const message = document.getElementById("message");

/* =====================================
   GET PASSWORD SETUP TOKEN
===================================== */

const params = new URLSearchParams(window.location.search);
const setupToken = params.get("token") || "";

if (!/^[a-f0-9]{64}$/i.test(setupToken)) {
    passwordForm.style.display = "none";

    showMessage(
        "Invalid or missing password setup link. Please restart the verification process.",
        "error"
    );
}

/* =====================================
   DISPLAY MESSAGES
===================================== */

function showMessage(text, type) {
    message.textContent = text;
    message.className = type;
}

function clearMessage() {
    message.textContent = "";
    message.className = "";
}

/* =====================================
   SET NEW PASSWORD
===================================== */

passwordForm.addEventListener("submit", async function(event) {

    event.preventDefault();
    clearMessage();

    const password = passwordInput.value;
    const confirmPassword = confirmPasswordInput.value;

    if (!setupToken) {
        showMessage("Invalid password setup link.", "error");
        return;
    }

    if (password.length < 8) {
        showMessage(
            "Your password must contain at least 8 characters.",
            "error"
        );
        return;
    }

    if (password.length > 128) {
        showMessage(
            "Your password cannot exceed 128 characters.",
            "error"
        );
        return;
    }

    if (password !== confirmPassword) {
        showMessage(
            "The passwords do not match.",
            "error"
        );
        return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Saving Password...";

    try {

        const response = await fetch("/api/users/set-password", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                token: setupToken,
                password
            })
        });

        const contentType = response.headers.get("content-type") || "";

        if (!contentType.includes("application/json")) {
            throw new Error("Unexpected server response. Please try again.");
        }

        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(
                result.message || "Could not set your password."
            );
        }

        showMessage(
            "Your password has been set successfully. Redirecting to login...",
            "success"
        );

        passwordInput.disabled = true;
        confirmPasswordInput.disabled = true;

        submitBtn.textContent = "Password Saved";

        // Remove the temporary token from the address bar.
        window.history.replaceState(
            {},
            document.title,
            window.location.pathname
        );

        setTimeout(() => {
            window.location.href = "index.html";
        }, 1800);

    } catch (error) {

        showMessage(error.message, "error");

        submitBtn.disabled = false;
        submitBtn.textContent = "Set New Password";
    }
});
</script>

</body>
</html>
