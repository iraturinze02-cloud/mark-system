
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Set New Password | Fila Grades System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f3f5f9;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        h2 {
            margin: 0 0 10px;
            text-align: center;
            color: #172554;
        }

        .description {
            margin: 0 0 25px;
            color: #64748b;
            text-align: center;
            line-height: 1.5;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
            color: #334155;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #1d4ed8;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 7px;
            font-size: 14px;
            line-height: 1.5;
            text-align: center;
        }

        .error {
            display: block;
            color: #991b1b;
            background: #fee2e2;
        }

        .success {
            display: block;
            color: #166534;
            background: #dcfce7;
        }

        .unavailable {
            display: none;
            text-align: center;
        }

        .unavailable p {
            color: #64748b;
            line-height: 1.6;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            color: #64748b;
            font-size: 14px;
        }

        #passwordArea {
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Set New Password</h2>

    <p class="description">
        Create a new password for your Fila Grades System account.
    </p>

    <p id="loadingMessage" class="loading">
        Validating your password setup link...
    </p>

    <div id="passwordArea">

        <form id="passwordForm">

            <label for="password">New Password</label>
            <input
                type="password"
                id="password"
                minlength="8"
                maxlength="128"
                autocomplete="new-password"
                placeholder="Enter your new password"
                required
            >

            <label for="confirmPassword">Confirm New Password</label>
            <input
                type="password"
                id="confirmPassword"
                minlength="8"
                maxlength="128"
                autocomplete="new-password"
                placeholder="Confirm your new password"
                required
            >

            <button type="submit" id="submitButton">
                Save New Password
            </button>

        </form>

    </div>

    <div id="message" class="message"></div>

    <div id="unavailableArea" class="unavailable">
        <p>
            This password setup link is invalid, expired, or has already
            been used.
        </p>

        <p>
            Please contact your administrator for assistance.
        </p>
    </div>

</div>

<script>
const token = new URLSearchParams(window.location.search).get("token");

const loadingMessage = document.getElementById("loadingMessage");
const passwordArea = document.getElementById("passwordArea");
const unavailableArea = document.getElementById("unavailableArea");
const passwordForm = document.getElementById("passwordForm");
const message = document.getElementById("message");
const submitButton = document.getElementById("submitButton");

let validToken = false;

function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
}

function showUnavailable() {
    validToken = false;
    loadingMessage.style.display = "none";
    passwordArea.style.display = "none";
    unavailableArea.style.display = "block";

    sessionStorage.removeItem("fila_password_setup_token");

    // Remove the invalid token from the address bar.
    window.history.replaceState(
        {},
        document.title,
        window.location.pathname
    );
}

async function validateToken() {

    if (!token || !/^[a-f0-9]{64}$/i.test(token)) {
        showUnavailable();
        return;
    }

    try {
        const response = await fetch(
            "/api/users/check-password-token",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ token })
            }
        );

        const result = await response.json();

        if (!response.ok || !result.success || !result.valid) {
            showUnavailable();
            return;
        }

        validToken = true;

        loadingMessage.style.display = "none";
        passwordArea.style.display = "block";

    } catch (error) {
        console.error("Token validation error:", error);

        loadingMessage.textContent =
            "Unable to validate your link. Please check your internet connection and reload the page.";
    }
}

passwordForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    if (!validToken) {
        showUnavailable();
        return;
    }

    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (password.length < 8 || password.length > 128) {
        showMessage(
            "Your password must contain between 8 and 128 characters.",
            "error"
        );
        return;
    }

    if (password !== confirmPassword) {
        showMessage(
            "The passwords do not match.",
            "error"
        );
        return;
    }

    submitButton.disabled = true;
    submitButton.textContent = "Saving...";

    try {

        const response = await fetch(
            "/api/users/set-password",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    token,
                    password
                })
            }
        );

        const result = await response.json();

        if (!response.ok || !result.success) {
            showMessage(
                result.message || "Unable to set your password.",
                "error"
            );

            if (response.status === 403) {
                showUnavailable();
            }

            return;
        }

        validToken = false;

        showMessage(
            "Your password has been set successfully. Redirecting you to login...",
            "success"
        );

        passwordForm.reset();

        sessionStorage.removeItem("fila_password_setup_token");

        // Remove the setup token from the address bar.
        window.history.replaceState(
            {},
            document.title,
            window.location.pathname
        );

        setTimeout(function() {
            window.location.replace("/index.html");
        }, 2000);

    } catch (error) {

        console.error("Password setup error:", error);

        showMessage(
            "A connection error occurred. Please try again.",
            "error"
        );

    } finally {

        submitButton.disabled = false;
        submitButton.textContent = "Save New Password";

    }
});

validateToken();
</script>

</body>
</html>
