
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Email | Fila Grades System</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background: #f1f5f9;
    font-family: "Segoe UI", Arial, sans-serif;
    color: #1e293b;
}

.container {
    width: 100%;
    max-width: 440px;
    background: white;
    padding: 35px 28px;
    border-radius: 16px;
    box-shadow: 0 10px 35px rgba(15,23,42,.08);
    text-align: center;
}

.logo {
    width: 65px;
    height: 65px;
    margin: 0 auto 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #eff6ff;
    color: #1d4ed8;
    border-radius: 50%;
    font-size: 30px;
}

h1 {
    margin: 0 0 10px;
    font-size: 23px;
    color: #123b67;
}

.description {
    font-size: 14px;
    line-height: 1.7;
    color: #64748b;
    margin-bottom: 25px;
}

.email-display {
    padding: 12px;
    background: #eff6ff;
    border-radius: 9px;
    color: #1d4ed8;
    font-size: 14px;
    font-weight: 700;
    overflow-wrap: anywhere;
    margin-bottom: 20px;
}

label {
    display: block;
    text-align: left;
    font-size: 13px;
    font-weight: 700;
    margin: 15px 0 7px;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #dbe2ea;
    border-radius: 9px;
    background: #f8fafc;
    outline: none;
    font-size: 15px;
}

input:focus {
    border-color: #2563eb;
    background: white;
    box-shadow: 0 0 0 3px rgba(37,99,235,.12);
}

#code {
    text-align: center;
    font-size: 25px;
    font-weight: 800;
    letter-spacing: 9px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 17px;
    border: none;
    border-radius: 9px;
    background: linear-gradient(135deg,#2563eb,#1d4ed8);
    color: white;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
}

button:hover { opacity: .93; }

button:disabled {
    opacity: .55;
    cursor: not-allowed;
}

.resend-btn {
    background: #eff6ff;
    color: #1d4ed8;
    border: 1px solid #bfdbfe;
}

#message {
    display: none;
    padding: 12px;
    margin-top: 17px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.5;
}

#message.success {
    display: block;
    color: #166534;
    background: #dcfce7;
}

#message.error {
    display: block;
    color: #991b1b;
    background: #fee2e2;
}

@media(max-width: 420px) {
    .container { padding: 28px 20px; }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">✉</div>

    <h1>Verify Your Email</h1>

    <p class="description">
        We sent a six-digit verification code to the email address below.
        Enter the code to activate your account.
    </p>

    <div class="email-display" id="emailDisplay">
        Loading email address...
    </div>

    <form id="verificationForm">

        <label for="code">Verification Code</label>

        <input
            type="text"
            id="code"
            placeholder="000000"
            inputmode="numeric"
            maxlength="6"
            pattern="[0-9]{6}"
            autocomplete="one-time-code"
            required
        >

        <button type="submit" id="verifyBtn">
            Verify Email
        </button>

    </form>

    <div id="message"></div>

    <button
        type="button"
        class="resend-btn"
        id="resendBtn"
    >
        Resend Verification Code
    </button>

</div>

<script>
const codeInput = document.getElementById("code");
const emailDisplay = document.getElementById("emailDisplay");
const message = document.getElementById("message");
const verifyBtn = document.getElementById("verifyBtn");
const resendBtn = document.getElementById("resendBtn");

let resendTimer = null;

/* GET EMAIL FROM URL */

const params = new URLSearchParams(window.location.search);
const email = (params.get("email") || "").trim().toLowerCase();

if (email && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    emailDisplay.textContent = email;
} else {
    emailDisplay.textContent = "Email address not provided";
    codeInput.disabled = true;
    verifyBtn.disabled = true;
    resendBtn.disabled = true;
    showMessage(
        "Invalid verification link. Please contact your administrator.",
        "error"
    );
}

/* MESSAGES */

function showMessage(text, type) {
    message.textContent = text;
    message.className = type;
}

function clearMessage() {
    message.textContent = "";
    message.className = "";
}

/* READ API RESPONSE */

async function readResponse(response) {
    const contentType = response.headers.get("content-type") || "";

    if (!contentType.includes("application/json")) {
        throw new Error("Unexpected server response. Please try again.");
    }

    return await response.json();
}

/* VERIFY EMAIL */

document.getElementById("verificationForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();
    clearMessage();

    const code = codeInput.value.trim();

    if (!email) {
        showMessage("Invalid verification link.", "error");
        return;
    }

    if (!/^\d{6}$/.test(code)) {
        showMessage("Please enter the six-digit verification code.", "error");
        return;
    }

    verifyBtn.disabled = true;
    verifyBtn.textContent = "Verifying...";

    try {
        const response = await fetch("/api/users/verify-email", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ email, code })
        });

        const result = await readResponse(response);

        if (!response.ok || !result.success) {
            throw new Error(result.message || "Email verification failed.");
        }

        showMessage(
            "Email verified successfully. Redirecting you to set your new password...",
            "success"
        );

        codeInput.disabled = true;
        resendBtn.disabled = true;
        verifyBtn.textContent = "Email Verified";

        setTimeout(() => {
    window.location.href =
        "/pages/sector/set-password.html?token=" +
        encodeURIComponent(result.setupToken);
}, 1500);

    } catch (error) {
        showMessage(error.message, "error");
        verifyBtn.disabled = false;
        verifyBtn.textContent = "Verify Email";
    }
});

/* RESEND VERIFICATION CODE */

resendBtn.addEventListener("click", async function() {

    clearMessage();

    if (!email) {
        showMessage("Invalid verification link.", "error");
        return;
    }

    resendBtn.disabled = true;
    resendBtn.textContent = "Sending...";

    try {
        const response = await fetch("/api/users/resend-verification", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ email })
        });

        const result = await readResponse(response);

        if (!response.ok || !result.success) {
            throw new Error(result.message || "Could not resend the code.");
        }

        showMessage(result.message, "success");
        codeInput.value = "";

        startResendTimer(60);

    } catch (error) {
        showMessage(error.message, "error");
        resendBtn.disabled = false;
        resendBtn.textContent = "Resend Verification Code";
    }
});

/* RESEND COUNTDOWN */

function startResendTimer(seconds) {

    clearInterval(resendTimer);

    let remaining = seconds;

    resendBtn.disabled = true;
    resendBtn.textContent = `Resend available in ${remaining}s`;

    resendTimer = setInterval(() => {

        remaining--;

        if (remaining <= 0) {
            clearInterval(resendTimer);
            resendBtn.disabled = false;
            resendBtn.textContent = "Resend Verification Code";
            return;
        }

        resendBtn.textContent = `Resend available in ${remaining}s`;

    }, 1000);
}

/* OTP INPUT */

codeInput.addEventListener("input", function() {
    this.value = this.value.replace(/\D/g, "").slice(0, 6);
});
</script>

</body>
</html>
