
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Record and manage student marks for assigned classes and subjects in Fila Grades System.">

    <meta name="theme-color" content="#173f70">

    <link rel="icon" type="image/x-icon" href="../../images/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="512x512" href="../../images/favicon/favicon.png">

    <title>Sector Administrators | Fila Grades System</title>

    <link rel="stylesheet" href="../../stye.css">

    <style>
        :root {
            --primary: #1d4ed8;
            --primary-dark: #123b67;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #d97706;
            --text: #1e293b;
            --muted: #64748b;
            --border: #e2e8f0;
            --surface: #ffffff;
            --background: #f1f5f9;
            --radius: 14px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--background);
            color: var(--text);
            font-family: "Segoe UI", Arial, sans-serif;
        }

        header {
            position: relative;
            background: linear-gradient(120deg, #123b67, #1d4ed8);
            color: white;
            padding: 32px 6%;
            min-height: 150px;
            box-shadow: 0 5px 18px rgba(18,59,103,.18);
        }

        header h1 {
            font-size: 25px;
            font-weight: 800;
            letter-spacing: 1px;
            margin: 0 0 9px;
        }

        header p {
            color: #dbeafe;
            font-size: 14px;
            margin: 0;
        }

        .logout-btn {
            position: absolute;
            right: 6%;
            top: 32px;
            background: rgba(255,255,255,.14);
            color: white;
            border: 1px solid rgba(255,255,255,.35);
            padding: 11px 19px;
            border-radius: 9px;
            font-weight: 600;
            cursor: pointer;
        }

        .logout-btn:hover {
            background: white;
            color: var(--primary-dark);
        }

        .dashboard-container {
            width: 100%;
            max-width: 1250px;
            margin: 35px auto;
            padding: 0 22px;
        }

        .card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 28px;
            box-shadow: 0 5px 25px rgba(15,23,42,.06);
            border: 1px solid #e9eef5;
            width: 100%;
        }

        .card h2 {
            font-size: 21px;
            font-weight: 750;
            color: #123b67;
            margin: 0;
        }

        .btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 7px;
            padding: 11px 17px;
            border: none;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            color: white;
            background: linear-gradient(135deg,#2563eb,#1d4ed8);
            box-shadow: 0 3px 8px rgba(37,99,235,.18);
            transition: all .25s ease;
        }

        .btn:hover { transform: translateY(-2px); }

        .btn:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-success {
            background: linear-gradient(135deg,#22c55e,#15803d);
        }

        .btn-danger {
            background: linear-gradient(135deg,#ef4444,#b91c1c);
        }

        .btn-warning {
            background: linear-gradient(135deg,#f59e0b,#d97706);
        }

        .btn-sm {
            padding: 8px 12px;
            font-size: 12px;
            border-radius: 7px;
        }

        .btn-block {
            width: 100%;
            margin-top: 12px;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            margin-top: 22px;
            border: 1px solid var(--border);
            border-radius: 11px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 680px;
            background: white;
        }

        thead { background: #f1f5f9; }

        th {
            color: #475569;
            font-size: 12px;
            font-weight: 750;
            text-transform: uppercase;
            letter-spacing: .5px;
            padding: 16px 15px;
            text-align: left;
            white-space: nowrap;
        }

        td {
            padding: 15px;
            border-top: 1px solid #edf0f4;
            color: #334155;
            font-size: 13px;
        }

        tbody tr:hover { background: #f8fbff; }

        .actions {
            display: flex;
            align-items: center;
            gap: 7px;
            flex-wrap: wrap;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            padding: 18px;
            background: rgba(15,23,42,.58);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            width: 100%;
            max-width: 460px;
            max-height: 90vh;
            overflow-y: auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,.2);
        }

        .modal-content h2 {
            font-size: 21px;
            color: #123b67;
            margin: 0 0 7px;
            font-weight: 800;
        }

        .modal-content label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #334155;
            margin-top: 17px;
            margin-bottom: 7px;
        }

        .modal-content input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #dbe2ea;
            background: #f8fafc;
            border-radius: 9px;
            font-size: 14px;
            color: #1e293b;
            outline: none;
        }

        .modal-content input:focus {
            background: white;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,.12);
        }

        .modal-content input:read-only {
            background: #e2e8f0;
            color: #475569;
            cursor: not-allowed;
        }

        .modal-content button { min-height: 43px; }

        #message {
            display: none;
            padding: 14px 17px;
            border-radius: 9px;
            margin: 15px 0;
            font-size: 13px;
            font-weight: 600;
        }

        #message.success {
            display: block;
            color: #166534;
            background: #dcfce7;
            border: 1px solid #bbf7d0;
        }

        #message.error {
            display: block;
            color: #991b1b;
            background: #fee2e2;
            border: 1px solid #fecaca;
        }

        .helper-text {
            font-size: 12px;
            color: #64748b;
            margin-top: 6px;
        }

        @media(max-width: 768px) {
            header { padding: 25px 20px 75px; }

            header h1 {
                font-size: 21px;
                max-width: 75%;
            }

            header p { font-size: 12px; }

            .logout-btn {
                left: 20px;
                right: auto;
                top: auto;
                bottom: 18px;
                padding: 9px 16px;
            }

            .dashboard-container {
                margin: 20px auto;
                padding: 0 12px;
            }

            .card { padding: 18px 13px; }

            .card h2 { font-size: 17px; }

            .modal-content { padding: 23px 19px; }
        }

        @media(max-width: 420px) {
            header h1 { font-size: 18px; }

            .btn {
                padding: 10px 12px;
                font-size: 12px;
            }

            .card { border-radius: 11px; }
        }
    </style>
</head>

<body>

<header>
    <h1>SECTOR MANAGEMENT</h1>
    <p>Manage sectors and sector administrators</p>
    <button class="logout-btn" onclick="logout()">Logout</button>
</header>

<main class="dashboard-container">

    <div class="card" style="max-width:1000px; width:95%;">

        <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:15px;">
            <h2>Sector & Admin Overview</h2>

            <button class="btn" onclick="openAdd()">
                + Add Sector Admin
            </button>
        </div>

        <div id="message"></div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Sector</th>
                        <th>Sector Code</th>
                        <th>Admin Name</th>
                        <th>Phone Number</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="sectorTable">
                    <tr>
                        <td colspan="6">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

</main>

<div id="modal" class="modal">
    <div class="modal-content">

        <h2 id="modalTitle">Add Sector Admin</h2>

        <input type="hidden" id="editId">

        <label for="adminSector">Sector Name</label>
        <input
            type="text"
            id="adminSector"
            placeholder="Enter sector name"
            maxlength="200"
            required
        >

        <label for="sectorCode">Sector Code</label>
        <input
            type="text"
            id="sectorCode"
            placeholder="Enter sector code"
            maxlength="50"
            required
        >

        <label for="adminName">Full Name</label>
        <input
            type="text"
            id="adminName"
            placeholder="Enter full name"
            maxlength="200"
            autocomplete="name"
            required
        >

        <label for="adminEmail">Email Address</label>
        <input
            type="email"
            id="adminEmail"
            placeholder="Enter email address"
            maxlength="254"
            autocomplete="email"
            required
        >

        <p class="helper-text" id="emailHelp">
            A verification code will be sent to this email address.
        </p>

        <label for="adminPhone">Phone Number</label>
        <input
            type="tel"
            id="adminPhone"
            placeholder="e.g. 0780000000"
            maxlength="30"
            autocomplete="tel"
            required
        >

        <button class="btn btn-success btn-block" id="saveBtn" onclick="saveAdmin()">
            Save
        </button>

        <button class="btn btn-danger btn-block" onclick="closeModal()">
            Cancel
        </button>

    </div>
</div>

<script>

// ===================================
// OWNER SECURITY GUARD
// ===================================

const currentUser = JSON.parse(
    localStorage.getItem("currentUser") || "null"
);

const role = localStorage.getItem("role");

if (
    !currentUser ||
    !currentUser.id ||
    role !== "owner" ||
    currentUser.role !== "owner"
) {
    window.location.replace("../../index.html");
}

// ===================================
// VARIABLES
// ===================================

let sectors = [];
let admins = [];
let editMode = false;

const table = document.getElementById("sectorTable");
const modal = document.getElementById("modal");
const message = document.getElementById("message");
const saveBtn = document.getElementById("saveBtn");

const sectorInput = document.getElementById("adminSector");
const sectorCodeInput = document.getElementById("sectorCode");
const nameInput = document.getElementById("adminName");
const emailInput = document.getElementById("adminEmail");
const phoneInput = document.getElementById("adminPhone");

// ===================================
// SAFE API RESPONSE HANDLING
// ===================================

async function readJsonResponse(response) {
    const contentType =
        response.headers.get("content-type") || "";

    if (!contentType.includes("application/json")) {
        await response.text();

        throw new Error(
            `Server returned an unexpected response. HTTP status: ${response.status}.`
        );
    }

    return await response.json();
}

// ===================================
// MESSAGES
// ===================================

function showMessage(text, type) {
    message.textContent = text;
    message.className = type;
    message.style.display = "block";
}

function clearMessage() {
    message.textContent = "";
    message.className = "";
    message.style.display = "none";
}

// ===================================
// SAFE HTML OUTPUT
// ===================================

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function escapeJS(value) {
    return String(value ?? "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");
}

// ===================================
// LOAD SECTORS
// ===================================

async function loadSectors() {
    const res = await fetch("/api/sectors", {
        credentials: "same-origin"
    });

    const data = await readJsonResponse(res);

    if (!res.ok || !data.success) {
        throw new Error(
            data.message || "Unable to load sectors."
        );
    }

    sectors = data.sectors || [];
}

// ===================================
// LOAD SECTOR ADMINISTRATORS
// ===================================

async function loadSectorAdmins() {
    table.innerHTML =
        '<tr><td colspan="6">Loading...</td></tr>';

    const res = await fetch("/api/sector-admins", {
        credentials: "same-origin"
    });

    const data = await readJsonResponse(res);

    if (!res.ok || !data.success) {
        throw new Error(
            data.message || "Unable to load administrators."
        );
    }

    admins = data.admins || [];

    renderTable();
}

// ===================================
// DISPLAY TABLE
// ===================================

function renderTable() {
    table.innerHTML = "";

    if (sectors.length === 0) {
        table.innerHTML =
            '<tr><td colspan="6">No sectors registered.</td></tr>';
        return;
    }

    const adminBySector = new Map(
        admins.map(admin => [
            String(admin.sector_id),
            admin
        ])
    );

    sectors.forEach((sector, index) => {
        const admin = adminBySector.get(String(sector.id));

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${index + 1}</td>
            <td>${escapeHTML(sector.sector_name)}</td>
            <td>${escapeHTML(sector.sector_code)}</td>
            <td>${admin ? escapeHTML(admin.full_name) : "-"}</td>
            <td>${admin ? escapeHTML(admin.phone) : "-"}</td>
            <td>
                <div class="actions">
                    ${
                        admin
                        ? `<button
                            class="btn btn-warning btn-sm"
                            onclick="openEdit('${escapeJS(admin.id)}')">
                            Edit
                           </button>`
                        : "-"
                    }
                </div>
            </td>
        `;

        table.appendChild(row);
    });
}

// ===================================
// OPEN ADD MODAL
// ===================================

function openAdd() {
    clearMessage();

    editMode = false;

    document.getElementById("modalTitle").textContent =
        "Add Sector Admin";

    document.getElementById("editId").value = "";

    sectorInput.value = "";
    sectorCodeInput.value = "";
    nameInput.value = "";
    emailInput.value = "";
    phoneInput.value = "";

    sectorInput.readOnly = false;
    sectorCodeInput.readOnly = false;

    emailInput.readOnly = false;
    emailInput.required = true;

    nameInput.readOnly = false;
    phoneInput.readOnly = false;

    document.getElementById("emailHelp").textContent =
        "A verification code will be sent to this email address.";

    saveBtn.textContent = "Save";
    saveBtn.disabled = false;

    modal.style.display = "flex";
}

// ===================================
// OPEN EDIT MODAL
// ===================================

function openEdit(id) {
    clearMessage();

    const admin = admins.find(
        item => String(item.id) === String(id)
    );

    if (!admin) {
        showMessage("Administrator not found.", "error");
        return;
    }

    const sector = sectors.find(
        item => String(item.id) === String(admin.sector_id)
    );

    editMode = true;

    document.getElementById("modalTitle").textContent =
        "Edit Sector Admin";

    document.getElementById("editId").value = admin.id;

    sectorInput.value =
        sector?.sector_name || admin.sector_name || "";

    sectorCodeInput.value =
        sector?.sector_code || admin.sector_code || "";

    nameInput.value = admin.full_name || "";
    emailInput.value = admin.email || "";
    phoneInput.value = admin.phone || "";

    // Protect sector information and registered email.
    sectorInput.readOnly = true;
    sectorCodeInput.readOnly = true;
    emailInput.readOnly = true;

    emailInput.required = false;

    document.getElementById("emailHelp").textContent =
        "The registered email address cannot be changed here.";

    saveBtn.textContent = "Update";
    saveBtn.disabled = false;

    modal.style.display = "flex";
}

// ===================================
// CLOSE MODAL
// ===================================

function closeModal() {
    modal.style.display = "none";

    sectorInput.readOnly = false;
    sectorCodeInput.readOnly = false;
    emailInput.readOnly = false;
    emailInput.required = true;

    nameInput.readOnly = false;
    phoneInput.readOnly = false;

    saveBtn.disabled = false;
}

// ===================================
// SAVE ADMINISTRATOR
// ===================================

async function saveAdmin() {
    const sector_name = sectorInput.value.trim();
    const sector_code = sectorCodeInput.value.trim();
    const full_name = nameInput.value.trim();

    const email =
        emailInput.value.trim().toLowerCase();

    const phone = phoneInput.value.trim();

    if (!sector_name || !sector_code || !full_name || !phone) {
        showMessage(
            "Please complete all required fields.",
            "error"
        );
        return;
    }

    if (!editMode) {
        if (!email) {
            showMessage(
                "Please enter the administrator's email address.",
                "error"
            );
            return;
        }

        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (!emailPattern.test(email)) {
            showMessage(
                "Please enter a valid email address.",
                "error"
            );
            return;
        }
    }

    const payload = {
        sector_name,
        sector_code,
        full_name,
        phone
    };

    const url = editMode
        ? "/api/users/update-sector-admin"
        : "/api/users/create-sector-admin";

    if (editMode) {
        payload.id =
            document.getElementById("editId").value;
    } else {
        payload.email = email;
    }

    const wasEdit = editMode;

    saveBtn.disabled = true;
    saveBtn.textContent = wasEdit
        ? "Updating..."
        : "Saving...";

    try {
        const res = await fetch(url, {
            method: "POST",
            credentials: "same-origin",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        });

        const result = await readJsonResponse(res);

        if (!res.ok || !result.success) {
            throw new Error(
                result.message || "Operation failed."
            );
        }

        closeModal();

        showMessage(
            result.message || (
                wasEdit
                    ? "Administrator updated successfully."
                    : "Administrator created successfully. Verification email sent."
            ),
            "success"
        );

        await loadSectors();
        await loadSectorAdmins();

    } catch (error) {
        showMessage(error.message, "error");

    } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = wasEdit ? "Update" : "Save";
    }
}

// ===================================
// LOGOUT
// ===================================

async function logout() {
    if (!confirm("Are you sure you want to log out?")) {
        return;
    }

    try {
        await fetch("/api/logout", {
            method: "POST",
            credentials: "same-origin"
        });

    } finally {
        localStorage.removeItem("currentUser");
        localStorage.removeItem("role");

        window.location.replace("../../index.html");
    }
}

// ===================================
// INITIALIZE
// ===================================

async function initializePage() {
    try {
        await loadSectors();
        await loadSectorAdmins();

    } catch (error) {
        console.error("Page initialization failed:", error);

        showMessage(
            error.message || "Unable to initialize the page.",
            "error"
        );
    }
}

initializePage();

</script>

</body>
</html>
