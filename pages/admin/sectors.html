
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sector Administrators</title>

    <link rel="stylesheet" href="../../style.css">

    <style>
        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 25px;
            width: 90%;
            max-width: 420px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            margin-bottom: 18px;
        }

        .modal-content label {
            display: block;
            margin-top: 12px;
            font-weight: 600;
            font-size: 14px;
        }

        .modal-content input,
        .modal-content select {
            width: 100%;
            padding: 11px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        /* BUTTONS */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 18px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            color: white;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.15);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        .btn-warning {
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }

        .btn-success {
            background: linear-gradient(135deg, #22c55e, #16a34a);
        }

        .btn-sm {
            padding: 8px 12px;
            font-size: 12px;
            border-radius: 8px;
        }

        .btn-block {
            width: 100%;
            margin-top: 12px;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        #message {
            display: none;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 15px;
            font-size: 13px;
        }

        #message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        #message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            border-collapse: collapse;
            min-width: 650px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #f8fafc;
        }

        @media(max-width: 600px) {
            .modal-content {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>SECTOR MANAGEMENT</h1>
    <p>Manage sectors and sector administrators</p>
    <button class="logout-btn" onclick="logout()">Logout</button>
</header>

<main class="dashboard-container">

    <div class="card" style="max-width:1000px; width:95%;">

        <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:15px;">
            <h2>Sector & Admin Overview</h2>

            <button class="btn" onclick="openAdd()">
                + Add Sector Admin
            </button>
        </div>

        <div id="message"></div>

        <div class="table-wrapper">
            <table style="width:100%; margin-top:20px;">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Sector</th>
                        <th>Sector Code</th>
                        <th>Admin Name</th>
                        <th>Phone Number</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="sectorTable">
                    <tr>
                        <td colspan="6">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

</main>

<!-- ADD / EDIT MODAL -->
<div id="modal" class="modal">

    <div class="modal-content">

        <h2 id="modalTitle">Add Sector Admin</h2>

        <input type="hidden" id="editId">

        <label for="adminSector">Sector</label>
        <select id="adminSector" required>
            <option value="">-- Select Sector --</option>
        </select>

        <label for="adminName">Full Name</label>
        <input
            type="text"
            id="adminName"
            placeholder="Enter full name"
            maxlength="200"
        >

        <label for="adminPhone">Phone Number</label>
        <input
            type="tel"
            id="adminPhone"
            placeholder="e.g. 0780000000"
            maxlength="30"
        >

        <label for="adminPassword">Password</label>
        <input
            type="password"
            id="adminPassword"
            placeholder="Enter password"
            minlength="8"
            autocomplete="new-password"
        >

        <p style="font-size:12px;color:#64748b;margin-top:3px;">
            At least 8 characters. When editing, leave blank to keep the current password.
        </p>

        <button class="btn btn-success btn-block" id="saveBtn" onclick="saveAdmin()">
            Save
        </button>

        <button class="btn btn-danger btn-block" onclick="closeModal()">
            Cancel
        </button>

    </div>

</div>

<script>
// ===================================
// OWNER SECURITY GUARD
// ===================================

const currentUser = JSON.parse(
    localStorage.getItem("currentUser") || "null"
);

const role = localStorage.getItem("role");

if (
    !currentUser ||
    !currentUser.id ||
    role !== "owner" ||
    currentUser.role !== "owner"
) {
    window.location.replace("index.html");
}

// ===================================
// VARIABLES
// ===================================

let sectors = [];
let admins = [];
let editMode = false;

const table = document.getElementById("sectorTable");
const modal = document.getElementById("modal");
const message = document.getElementById("message");
const saveBtn = document.getElementById("saveBtn");

// ===================================
// MESSAGES
// ===================================

function showMessage(text, type) {
    message.textContent = text;
    message.className = type;
}

function clearMessage() {
    message.textContent = "";
    message.className = "";
    message.style.display = "none";
}

// ===================================
// LOAD SECTORS
// ===================================

async function loadSectors() {

    const select = document.getElementById("adminSector");

    try {
        const res = await fetch("/api/sectors", {
            credentials: "same-origin"
        });

        const data = await res.json();

        if (!res.ok || !data.success) {
            throw new Error(data.message || "Unable to load sectors.");
        }

        sectors = data.sectors || [];

        select.innerHTML = '<option value="">-- Select Sector --</option>';

        sectors
            .filter(sector => sector.status === "active")
            .forEach(sector => {
                const option = document.createElement("option");
                option.value = sector.id;
                option.textContent = sector.sector_name;
                select.appendChild(option);
            });

    } catch (error) {
        select.innerHTML = '<option value="">Unable to load sectors</option>';
        showMessage(error.message, "error");
    }
}

// ===================================
// LOAD SECTOR ADMINISTRATORS
// ===================================

async function loadSectorAdmins() {

    table.innerHTML =
        '<tr><td colspan="6">Loading...</td></tr>';

    try {
        const res = await fetch("/api/sector-admins", {
            credentials: "same-origin"
        });

        const data = await res.json();

        if (!res.ok || !data.success) {
            throw new Error(data.message || "Unable to load administrators.");
        }

        admins = data.admins || [];

        renderTable();

    } catch (error) {
        table.innerHTML =
            `<tr><td colspan="6">${escapeHTML(error.message)}</td></tr>`;
    }
}

// ===================================
// DISPLAY TABLE
// ===================================

function renderTable() {

    table.innerHTML = "";

    if (sectors.length === 0) {
        table.innerHTML =
            '<tr><td colspan="6">No sectors registered.</td></tr>';
        return;
    }

    const adminBySector = new Map(
        admins.map(admin => [String(admin.sector_id), admin])
    );

    sectors.forEach((sector, index) => {

        const admin = adminBySector.get(String(sector.id));

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${index + 1}</td>
            <td>${escapeHTML(sector.sector_name)}</td>
            <td>${escapeHTML(sector.sector_code)}</td>
            <td>${admin ? escapeHTML(admin.full_name) : "-"}</td>
            <td>${admin ? escapeHTML(admin.phone) : "-"}</td>
            <td>
                <div class="actions">
                    ${
                        admin
                        ? `<button class="btn btn-warning btn-sm"
                            onclick="openEdit('${escapeJS(admin.id)}')">
                            Edit
                           </button>`
                        : `<button class="btn btn-sm"
                            onclick="openAdd('${escapeJS(sector.id)}')">
                            Add Admin
                           </button>`
                    }
                </div>
            </td>
        `;

        table.appendChild(row);
    });
}

// ===================================
// SAFE HTML OUTPUT
// ===================================

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function escapeJS(value) {
    return String(value ?? "").replace(/\\/g, "\\\\").replace(/'/g, "\\'");
}

// ===================================
// OPEN ADD MODAL
// ===================================

function openAdd(sectorId = "") {

    editMode = false;

    document.getElementById("modalTitle").textContent =
        "Add Sector Admin";

    document.getElementById("editId").value = "";
    document.getElementById("adminSector").value = sectorId;
    document.getElementById("adminName").value = "";
    document.getElementById("adminPhone").value = "";
    document.getElementById("adminPassword").value = "";

    document.getElementById("adminSector").disabled = false;

    saveBtn.textContent = "Save";
    modal.style.display = "flex";
}

// ===================================
// OPEN EDIT MODAL
// ===================================

function openEdit(id) {

    const admin = admins.find(item => String(item.id) === String(id));

    if (!admin) return;

    editMode = true;

    document.getElementById("modalTitle").textContent =
        "Edit Sector Admin";

    document.getElementById("editId").value = admin.id;
    document.getElementById("adminSector").value = admin.sector_id;
    document.getElementById("adminName").value = admin.full_name || "";
    document.getElementById("adminPhone").value = admin.phone || "";
    document.getElementById("adminPassword").value = "";

    document.getElementById("adminSector").disabled = true;

    saveBtn.textContent = "Update";
    modal.style.display = "flex";
}

// ===================================
// CLOSE MODAL
// ===================================

function closeModal() {
    modal.style.display = "none";
}

// ===================================
// SAVE ADMIN
// ===================================

async function saveAdmin() {

    const full_name =
        document.getElementById("adminName").value.trim();

    const phone =
        document.getElementById("adminPhone").value.trim();

    const password =
        document.getElementById("adminPassword").value;

    const sector_id =
        document.getElementById("adminSector").value;

    if (!full_name || !phone || !sector_id) {
        alert("Please fill in all required fields.");
        return;
    }

    if (!editMode && password.length < 8) {
        alert("Password must contain at least 8 characters.");
        return;
    }

    if (editMode && password && password.length < 8) {
        alert("New password must contain at least 8 characters.");
        return;
    }

    const payload = {
        full_name,
        phone,
        sector_id,
        role: "sector_admin"
    };

    let url = "/api/users/create-sector-admin";

    if (editMode) {
        payload.id = document.getElementById("editId").value;

        if (password) {
            payload.password = password;
        }

        url = "/api/users/update-sector-admin";
    } else {
        payload.password = password;
    }

    saveBtn.disabled = true;
    saveBtn.textContent = "Saving...";

    try {

        const res = await fetch(url, {
            method: "POST",
            credentials: "same-origin",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        });

        const result = await res.json();

        if (!res.ok || !result.success) {
            throw new Error(result.message || "Could not save administrator.");
        }

        closeModal();

        showMessage(
            editMode
                ? "Sector administrator updated successfully."
                : "Sector administrator created successfully.",
            "success"
        );

        await loadSectorAdmins();

    } catch (error) {
        showMessage(error.message, "error");
    } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = editMode ? "Update" : "Save";
    }
}

// ===================================
// LOGOUT
// ===================================

async function logout() {

    if (!confirm("Are you sure you want to log out?")) return;

    try {
        await fetch("/api/logout", {
            method: "POST",
            credentials: "same-origin"
        });
    } finally {
        localStorage.removeItem("currentUser");
        localStorage.removeItem("role");
        window.location.replace("index.html");
    }
}

// ===================================
// INITIALIZE
// ===================================

async function initializePage() {
    await loadSectors();
    await loadSectorAdmins();
    renderTable();
}

initializePage();

</script>

</body>
</html>
